# Replaces nginx-unprivileged's stock default.conf (COPYed to that exact path — see
# the Dockerfile). The base image's own default `location /` does `try_files $uri
# $uri/ =404;`, which 404s any client-side route (e.g. /org/settings) on a hard
# reload or bookmark — a SPA needs unmatched paths to fall through to index.html so
# react-router can take over. Also carries the same absolute_redirect fix as the
# portal (see portal/nginx-absolute-redirect-off.conf's comment for why) even though
# this app has no directory-style routes today, so it doesn't regress if one is added.
absolute_redirect off;

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed asset filenames (Vite) are safe to cache indefinitely; index.html names
    # the current hashes, so it must always be revalidated or a stale client never
    # picks up a new deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri /index.html;
    }
}
