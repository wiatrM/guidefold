/* The loader, ui/design/landing/v3/SPEC.md. It lives here rather than in a component
   because its whole job is to hold the graphite field for the one moment nothing else
   can paint: the page has no pre-JS text shell any more, so without it a visitor sees an
   empty white document until React commits.

   It is `position:fixed` and `pointer-events:none`, so it contributes no layout and traps
   no click: removing it shifts nothing and CLS stays 0.000. The values are literals
   because this rule must be in the first bytes of the document, before tokens.css exists;
   the field and the mark size match --graphite-950 and --landing-loader-mark.

   Two ways out, and the page is never trapped by either. The default is the CSS-only
   fallback: fade after 4 s, whatever JavaScript did or did not do. The normal path is
   `data-gone`, set once `document.fonts.ready` has resolved and the hero has committed;
   it restates the whole `animation` shorthand with no delay, so it cannot race the
   fallback, it replaces it. A `noscript` rule removes the overlay outright. */

#loader img{width:64px;height:64px;object-fit:contain;animation:gf-loader-breathe 900ms ease-in-out infinite alternate}
@keyframes gf-loader-breathe{from{opacity:.4}to{opacity:1}}
@keyframes gf-loader-out{to{opacity:0;visibility:hidden}}
