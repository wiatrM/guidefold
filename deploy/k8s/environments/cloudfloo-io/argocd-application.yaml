    path: deploy/k8s/chart
    repoURL: https://github.com/wiatrM/guidefold.git
    targetRevision: 7b0958cfe8511ddbe86eaae6d62200749ade774c
  destination:
    server: https://kubernetes.default.svc
    namespace: guidefold
  syncPolicy:
