# ArgoCD AppProject + Application for guidefold.cloudfloo.io.
#
# targetRevision is the tag deploy-cloudfloo-chart-r12, not main. The chart on
# main carries the OAuth guard added in #130: it renders WORKOS_CLIENT_ID and
# GUIDEFOLD_PUBLIC_URL into the ConfigMap and fails template rendering when
# workos.clientID is empty. This environment has no WorkOS client id and no
# guidefold-workos secret, which is also why the API container has been in
# CrashLoopBackOff on workos_requires_api_key_and_client_id. On top of that the
# live ConfigMap is immutable, so a render that adds keys cannot be applied in
# place. The tag pins the chart revision the live release was built from; its
# render is byte-identical to the live manifest apart from the UI image.
#
# Moving this back to main needs three things, in order: a real workos.clientID
# and publicURL in the values, the guidefold-workos secret created in the
# namespace, and the immutable ConfigMap deleted so it can be recreated.
#
# The values below are the release's own computed values, read back from the
# cluster, with only ui.image advanced. Verified by rendering the tagged chart
# locally: the diff against the live manifest is one line, the UI image.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: guidefold
  namespace: argocd
spec:
  description: Guidefold pilot deployment (guidefold.cloudfloo.io)
  sourceRepos:
    - https://github.com/wiatrM/guidefold.git
  destinations:
    - namespace: guidefold
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: "*", kind: "*"}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guidefold
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: guidefold
spec:
  project: guidefold
  source:
    repoURL: https://github.com/wiatrM/guidefold.git
    targetRevision: deploy-cloudfloo-chart-r12
    path: deploy/k8s/chart
    helm:
      values: |
        artifactImage: ''
        auth: workos
        autoscaling:
          cpuUtilization: 70
          enabled: true
          inflightMetric: ''
          inflightTarget: '4'
          maxReplicas: 3
          minReplicas: 2
        credentialsSecret: guidefold-credentials
        database:
          adminUser: postgres
          connectionBudget: 128
          host: guidefold-postgres-rw.guidefold.svc.cluster.local
          name: guidefold
          networkPeers:
          - podSelector:
              matchLabels:
                cnpg.io/cluster: guidefold-postgres
          port: 5432
          reservedConnections: 16
          sslMode: verify-full
          tlsSecret: guidefold-postgres-ca
          user: guidefold_api
        developmentMode: false
        gpu:
          autoscaling:
            enabled: false
            maxReplicas: 2
            minReplicas: 1
            queueMetric: ''
            queueTarget: '4'
          batchRequests: 1
          enabled: false
          encoderID: ''
          image: ''
          nodeSelector:
            kubernetes.io/arch: amd64
          replicas: 1
          resources:
            limits:
              cpu: '2'
              memory: 4Gi
              nvidia.com/gpu: 1
            requests:
              cpu: '1'
              memory: 2Gi
              nvidia.com/gpu: 1
          tolerations: []
        image: ghcr.io/wiatrm/guidefold-search@sha256:cbcc19478240567dcf848f621bedbcb06595133b32d7907840cbbe8af7520702
        imagePullPolicy: IfNotPresent
        imagePullSecrets: []
        ingress:
          annotations: {}
          className: nginx
          enabled: true
          host: guidefold.cloudfloo.io
          tlsSecret: ''
        job:
          timeoutSeconds: 1800
          ttlSecondsAfterFinished: 86400
        metrics:
          additionalLabels: {}
          serviceMonitor: false
        networkPolicy:
          clientPeers:
          - podSelector:
              matchLabels:
                guidefold.client: 'true'
          enabled: true
        nodeSelector: {}
        operatorCredentialsSecret: guidefold-operator-credentials
        portal:
          enabled: true
          image: ghcr.io/wiatrm/guidefold-portal@sha256:5ef818b9f8a58a82505662ce12bb91e36408488ff803cabf28972c5195d2975b
          replicas: 1
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
        replicas: 2
        repository: guidefold
        resources:
          limits:
            cpu: '2'
            ephemeral-storage: 256Mi
            memory: 2Gi
          requests:
            cpu: 500m
            ephemeral-storage: 64Mi
            memory: 512Mi
        snapshotID: unpublished
        tenant: cloudfloo
        tolerations: []
        ui:
          enabled: true
          image: ghcr.io/wiatrm/guidefold-ui@sha256:6cb8100637e6150bde1893d49dd5ced9b70781f062b2fc25b6446757025db627
          replicas: 2
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
        worker:
          enabled: true
          generator: deterministic
          image: ghcr.io/wiatrm/guidefold-worker@sha256:09b89b02de57c73224135c6ac8d8206491a5cfd10e33940dbfceadf5145ca28a
          nodeSelector: {}
          replicas: 1
          resources:
            limits:
              cpu: '1'
              ephemeral-storage: 512Mi
              memory: 1Gi
            requests:
              cpu: 250m
              ephemeral-storage: 64Mi
              memory: 256Mi
          tolerations: []
        workload: serve
  destination:
    server: https://kubernetes.default.svc
    namespace: guidefold
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true, PrunePropagationPolicy=foreground, PruneLast=true]
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 3m}
