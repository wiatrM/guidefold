apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: guidefold
  namespace: argocd
spec:
  description: Guidefold pilot deployment (guidefold.cloudfloo.io)
  sourceRepos:
  - https://github.com/wiatrM/guidefold.git
  destinations:
  - namespace: guidefold
    server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guidefold
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: guidefold
spec:
  project: guidefold
  source:
    helm:
      values: "artifactImage: ''\nauth: workos\nautoscaling:\n  cpuUtilization: 70\n\
        \  enabled: true\n  inflightMetric: ''\n  inflightTarget: '4'\n  maxReplicas:\
        \ 3\n  minReplicas: 2\ncredentialsSecret: guidefold-credentials\ndatabase:\n\
        \  adminUser: postgres\n  connectionBudget: 128\n  host: guidefold-postgres-rw.guidefold.svc.cluster.local\n\
        \  name: guidefold\n  networkPeers:\n  - podSelector:\n      matchLabels:\n\
        \        cnpg.io/cluster: guidefold-postgres\n  port: 5432\n  reservedConnections:\
        \ 16\n  sslMode: verify-full\n  tlsSecret: guidefold-postgres-ca\n  user:\
        \ guidefold_api\ndevelopmentMode: false\ngpu:\n  autoscaling:\n    enabled:\
