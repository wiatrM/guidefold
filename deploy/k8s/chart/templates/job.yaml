{{- if ne .Values.workload "serve" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gf.name" . }}
  labels:
    {{- include "gf.labels" . | nindent 4 }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.job.timeoutSeconds }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "gf.labels" . | nindent 8 }}
        app.kubernetes.io/component: operator
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "gf.name" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "gf.podSecurity" . | nindent 8 }}
      imagePullSecrets: {{ toJson .Values.imagePullSecrets }}
      {{- if and (eq .Values.workload "publish") .Values.gpu.enabled }}
      initContainers:
        - name: stage-catalog
          image: {{ .Values.artifactImage | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: [publish, /input/snapshot.json]
          {{- include "gf.operatorContainer" . | nindent 10 }}
      {{- end }}
      containers:
        - name: operator
          {{- if eq .Values.workload "migrate" }}
          image: {{ .Values.image | quote }}
          args: [migrate]
          {{- else }}
          image: {{ .Values.artifactImage | quote }}
          {{- if .Values.gpu.enabled }}
          args: [publish-embeddings, /input/embeddings.json]
          {{- else }}
          args: [publish, /input/snapshot.json]
          {{- end }}
          {{- end }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- include "gf.operatorContainer" . | nindent 10 }}
      volumes:
        - name: credentials
          secret:
            secretName: {{ .Values.operatorCredentialsSecret }}
            defaultMode: 0440
            items:
              - {key: admin-password, path: admin-password}
              - {key: app-password, path: app-password}
        - {name: tmp, emptyDir: {sizeLimit: 32Mi}}
        {{- include "gf.tlsVolume" . | nindent 8 }}
{{- end }}
{{- define "gf.operatorContainer" -}}
securityContext:
  {{- include "gf.containerSecurity" . | nindent 2 }}
envFrom: [{configMapRef: {name: {{ include "gf.name" . }}}}]
env:
  {{- include "gf.dbEnv" . | nindent 2 }}
  - {name: PGUSER, value: {{ .Values.database.adminUser | quote }}}
  - {name: PG_PASSWORD_FILE, value: /run/credentials/admin-password}
  - {name: APP_PASSWORD_FILE, value: /run/credentials/app-password}
  - {name: GUIDEFOLD_PUBLISH_ACTIVATE, value: "false"}
resources:
  {{- toYaml .Values.resources | nindent 2 }}
volumeMounts:
  - {name: credentials, mountPath: /run/credentials, readOnly: true}
  - {name: tmp, mountPath: /tmp}
  {{- include "gf.tlsMount" . | nindent 2 }}
{{- end -}}
