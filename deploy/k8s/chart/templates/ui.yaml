{{- if .Values.ui.enabled }}
{{- if not .Values.ui.image }}{{ fail "ui.image is required when ui.enabled" }}{{ end }}
# The hosted U4 React app: static build behind an unprivileged nginx (ui/Dockerfile).
# Same-origin by design — it calls /api and /v1 on its own host (ingress.yaml routes
# those to the api Service), so it reads nothing and writes nothing itself; no
# database, no credentials, no egress. Separate Deployment/Service from api/worker so
# any of them can scale, restart or roll back independently.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gf.name" . }}-ui
  labels:
    {{- include "gf.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      {{- include "gf.labels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "gf.labels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ui
          image: {{ .Values.ui.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # nginx-unprivileged writes its pid and cache under /tmp
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 30
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gf.name" . }}-ui
  labels:
    {{- include "gf.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  selector:
    {{- include "gf.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.ingress.host }}
---
# Path / (catch-all) on the shared host — must coexist with ingress.yaml's /api,/v1
# and portal.yaml's /docs on the same host; nginx-ingress matches the more specific
# prefixes first regardless of which Ingress object declares them, so declaration
# order across these three files doesn't matter.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gf.name" . }}-ui
  labels:
    {{- include "gf.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tlsSecret }}
  tls:
    - hosts: [{{ .Values.ingress.host }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "gf.name" . }}-ui
                port: {name: http}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# The UI answers HTTP from the ingress and needs nothing else of its own: no DNS, no
# database, no egress. Its browser-side fetches to /api and /v1 are the visitor's own
# connection back through the ingress, not egress from this pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gf.name" . }}-ui
  labels:
    {{- include "gf.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  podSelector:
    matchLabels:
      {{- include "gf.labels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{protocol: TCP, port: 8080}]
  egress: []
{{- end }}
{{- end }}
