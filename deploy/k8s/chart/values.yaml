# Each Helm installation owns ONE immutable release. Use a new installation name
# for a new artifact set; the stable traffic Service is managed separately.
workload: serve # serve | migrate | publish
developmentMode: false
# Sign-in provider. `dev` mounts a local form that mints a session for any
# e-mail, so it is refused outside developmentMode; the service has no default
# and refuses to start if this is empty.
auth: workos # workos | dev
publicURL: "" # absolute browser origin used by OAuth callbacks (required for WorkOS)
workos:
  clientID: "" # WorkOS client id; secret stays in workos.secretName
  secretName: guidefold-workos # key: api-key
github:
  webhookSecretName: "" # optional GitHub App webhook secret; key: webhook-secret
# Optional deployment master keyring for organisation-supplied provider credentials
# (ADR-0045). Empty means no keyring is mounted and GUIDEFOLD_SECRET_KEY_FILE is left
# unset: internal/secrets.LoadKeyring then returns no keyring, credential PUT answers
# 503 secret_encryption_unavailable, and the Model keys screen says so instead of
# storing anything in the clear. Set it to run the Live Agent or PR review model calls.
# Secret key: `keyring`, whose value is the whole JSON file
# internal/secrets.LoadKeyring reads: {"active": "<key_id>", "keys": {"<key_id>":
# "<base64 of 32 random bytes>", ...}} (see tools/dev/stack.py's generate_keyring()
# for the same shape used locally). Mounted identically by the API and the worker.
secretKeyringSecretName: ""
api:
  # Peers the API may open TLS to. This is a much smaller need than the worker's
  # externalEgress below: PUT {org_base}/credentials/{provider} makes one
  # short-lived authenticated call to the organisation's model provider to
  # verify a key an owner just typed, before sealing it (ADR-0045 point 5,
  # secrets.NewHTTPVerifier in main.go) — not a job that reads a repository or
  # does real model work. A NetworkPolicy matches peers, never hostnames, so
  # the operator names them here rather than the chart guessing a CIDR that
  # will rot. Empty is a supported state, not an oversight: the API then
  # reaches only DNS, the database and (if enabled) the GPU shadow, and
  # storing a credential answers `provider_unavailable` instead of hanging on
  # a connection that will never open.
  externalEgress: []
image: "" # registry/image@sha256:... (Go runtime)
artifactImage: "" # same runtime with /input/snapshot.json and optional embeddings.json
imagePullPolicy: IfNotPresent
imagePullSecrets: []
tenant: ""
repository: ""
snapshotID: ""
credentialsSecret: guidefold-credentials # keys: app-password, api-token
operatorCredentialsSecret: guidefold-operator-credentials # keys: admin-password, app-password
database:
  host: ""
  port: 5432
  name: guidefold
  user: guidefold_api
  adminUser: postgres
  sslMode: verify-full
  tlsSecret: guidefold-postgres-ca # key ca.crt
  networkPeers: [] # explicit NetworkPolicy peers: pod/namespace selectors or ipBlock
  connectionBudget: 128 # capacity assigned to TWO overlapping releases, plus reserve
  reservedConnections: 16
replicas: 2
resources:
  requests: {cpu: 500m, memory: 512Mi, ephemeral-storage: 64Mi}
  limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 256Mi}
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  cpuUtilization: 70
  # Requires Prometheus Adapter exposing the per-pod sum of the admission gauge.
  inflightMetric: ""
  inflightTarget: "4"
nodeSelector: {}
tolerations: []
networkPolicy:
  enabled: true
  clientPeers:
    - podSelector:
        matchLabels: {guidefold.client: "true"}
ingress:
  enabled: false
  className: ""
  host: "" # required when enabled, e.g. guidefold.example.com
  tlsSecret: "" # empty = HTTP only; set once a cert-manager/ACME secret exists
  annotations: {}
metrics:
  serviceMonitor: false # requires Prometheus Operator CRDs
  additionalLabels: {}
gpu:
  enabled: false # shadow only; never changes primary SEARCH output
  image: "" # pinned TEI image with the verified adapter baked into /model
  encoderID: ""
  replicas: 1
  batchRequests: 1
  nodeSelector: {kubernetes.io/arch: amd64}
  tolerations: []
  resources:
    requests: {cpu: "1", memory: 2Gi, nvidia.com/gpu: 1}
    limits: {cpu: "2", memory: 4Gi, nvidia.com/gpu: 1}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    queueMetric: "" # operator-provided per-pod TEI queue metric via adapter
    queueTarget: "4"
worker:
  enabled: false # runs `guidefold-search worker` (import.parse); separate image, no Python in the api one
  image: "" # registry/image@sha256:... (services/search/Dockerfile.worker: same Go binary + pinned Python/PyYAML)
  replicas: 1
  generator: none # none | deterministic | openai | anthropic (API-CONTRACT §8 proposal.generate backend)
  resources:
    requests: {cpu: 250m, memory: 256Mi, ephemeral-storage: 64Mi}
    limits: {cpu: "1", memory: 1Gi, ephemeral-storage: 512Mi}
  nodeSelector: {}
  tolerations: []
  # Peers the worker may open TLS to. Both destinations below are needed together,
  # not one or the other: api.github.com (read a repository for `live.repo`, read
  # a diff and post the sticky PR comment for `pr.report`, and — with github.com —
  # push the branch and open the PR for `ascend.run`) and the organisation's model
  # provider endpoint (opened directly by `pr.report` and by the `proposal.generate`
  # job `live.repo` waits on, both through internal/secrets.OpenFor with the
  # organisation's own key from ADR-0045; `ascend.run` calls the deployment's own
  # generator key the same way). See ADR-0046 §2/§9, ADR-0036 and API-CONTRACT §8.
  # A NetworkPolicy matches peers, never hostnames, so the operator names them here
  # rather than the chart guessing a CIDR that will rot. Empty is a supported
  # state, not an oversight: the worker then reaches only DNS and the database,
  # and every one of those job kinds terminates `skipped` with a named reason
  # (`github_app_not_configured`) instead of hanging on a connection that will
  # never open. This is separate from, and larger than, `api.externalEgress`
  # above: the API only ever checks a key someone just typed; the worker does
  # the actual repository reads and model calls.
  externalEgress: []
job:
  timeoutSeconds: 1800
  ttlSecondsAfterFinished: 86400

# The developer portal (portal/Dockerfile): static docs behind an unprivileged nginx, no
# database, no credentials, no egress. Off by default; served at ingress.host + /docs
# when both ingress.host and portal.enabled are set (see templates/portal.yaml).
portal:
  enabled: false
  image: ""
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 128Mi}

# The hosted U4 React app (ui/Dockerfile): static build behind an unprivileged nginx,
# same-origin to the API (no database, no credentials, no egress of its own). Off by
# default; served at ingress.host + / when both ingress.host and ui.enabled are set
# (see templates/ui.yaml) — bring ingress.enabled up too, or its /api,/v1 calls 404.
ui:
  enabled: false
  image: ""
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 128Mi}
