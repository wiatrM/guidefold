maxConns` mid-incident.\n6. Rollback: `kubectl -n turnstile rollout undo deploy/turnstile`, then revert the change in\n   `deploy/deployment.yaml` through a PR so the manifest matches the cluster again.\n7. Escalate to turnstile-team after 30 min without mitigation, or immediately if a mitigation would\n   change `legacyAuthMode` or any other `config.auth` value.\n8. Write the incident note within 24 h using `docs/incidents/TEMPLATE.md`.\n\n## Conventions specific to this scope\n- Turnstile fails closed. An outage is a 403 storm, not a security bypass; do not \"open\" auth to\n  restore traffic. There is no flag for that and none may be added.\n- Only three mitigations are approved for on-call use without a second reviewer: rollout undo,\n  bundle re-pin, rolling pod restart.\n- `deploy/deployment.yaml` is the single source of truth for flags; a manual `kubectl set env` is a\n  temporary mitigation and must be reconciled by a PR before the incident is closed.\n- Never run ad-hoc SQL against the principal tables during an incident; read-only checks go through\n  the `turnstile_ro` role.\n- Alert thresholds live in `deploy/alerts.yaml` next to `deployment.yaml`; tuning one is a PR, not\n  a dashboard edit.\n- The rota is turnstile-oncall (a turnstile-team sub-team); handover notes go in the incident channel\n  at the end of each shift.\n\n## Verify\n- After mitigation, the `turnstile_authz_errors_total` rate is back to baseline for 15 min and the\n  atlas gateway 403 rate matches the previous day.\n- `kubectl -n turnstile get configmap turnstile-config -o yaml` matches the ConfigMap in\n  `deploy/deployment.yaml`, or a reconciling PR is open.\n- The incident note links the alert, the mitigation used and the follow-up issue.\n\n## See also\n- urn:skill:meridian:atlas.identity.turnstile:postgres-auth (required)\n- urn:skill:meridian:_root:postgres-production\n- urn:skill:meridian:atlas.identity:rbac-policies\n", "path": "platforms/atlas/identity/turnstile/.agents/skills/turnstile-oncall-runbook/SKILL.md", "revision": "c1341346a8c30e570c684a6bba037ff5eaea94f4ec619f055007ed1a256b3cd5", "bytes": 5170, "requires": ["urn:skill:meridian:atlas.identity.turnstile:postgres-auth"], "refines": [], "references": ["platforms/atlas/identity/turnstile/deploy/deployment.yaml"]}, {"id": "urn:skill:meridian:forge:dataset-conventions", "name": "dataset-conventions", "scope": "forge", "owner": "forge-platform", "sourceLayer": "platform", "knowledgeLayer": "Unclassified", "sourceStatus": "active", "description": "[forge] Naming, schema registration, and lineage tagging rules for datasets produced or consumed on the Forge data-integration platform. Use when creating a new dataset, renaming or re-partitioning an existing one, or registering a schema in the Forge schema registry. Do not use for ontology object types (forge.ontology) or for Kafka topic definitions (forge.pipelines.streaming).", "body": "# Forge dataset conventions\n\n## When to use / when NOT to use\nUse this skill when you:\n- create a dataset under `platforms/forge/**` (batch or streaming output),\n- rename, re-partition, or change the schema of an existing dataset,\n- register or update a schema in the Forge schema registry,\n- add or fix lineage tags on a dataset.\n\nDo NOT use it for:\n- ontology object types, links, or properties (`forge.ontology:ontology-modeling`),\n- Kafka topic naming and retention (`forge.pipelines.streaming:kafka-ingestion`),\n- PySpark job structure (`forge.pipelines:spark-pipeline-conventions`).\n\n## Steps\n1. Pick the name: `\u003cdomain>.\u003centity>_\u003cgrain>`, e.g. `fleet.vehicle_daily`, `facilities.site_current`.\n   Registered domains are listed in `platforms/forge/schemas/README.md`; add a new one via PR to forge-platform.\n2. Write the schema file `platforms/forge/schemas/\u003cdomain>/\u003centity>_\u003cgrain>.schema.json`\n   (JSON Schema draft 2020-12, one top-level object, `additionalProperties: false`).\n3. Register it: `forge datasets register platforms/forge/schemas/\u003cdomain>/\u003centity>_\u003cgrain>.schema.json`.\n   The command fails if the name is taken or the schema is not backward-compatible with the last revision.\n4. Fill the `x-lineage` block: `producer` (pipeline name), `inputs` (upstream dataset names),\n   `refresh` (`batch-daily`, `batch-hourly`, `streaming`).\n5. Add the dataset to the catalogue table in `platforms/forge/schemas/README.md` with owner and refresh cadence.\n6. Open the PR with the `dataset` label; forge-platform reviews naming and lineage, the domain team reviews columns.\n\n## Conventions specific to this scope\n- Names are lowercase snake_case; the only dot separates domain from entity. No environment prefixes\n  (`dev_`, `prod_`): environments are selected by the writer, never encoded in the name.\n- Grain suffixes are fixed: `_current` (latest state), `_daily`, `_hourly`, `_event` (append-only),\n  `_snapshot_\u003cyyyymm>`. Anything else fails `forge datasets lint`.\n- Every dataset has `id` (string, stable), `ingested_at` (timestamp, UTC), and `source_system` (string).\n- Timestamps are ISO-8601 UTC; no local-time columns. Geometries are WKT strings with a `_wkt` suffix.\n- Schema evolution: adding nullable columns is allowed in place. Removing or retyping a column requires a\n  new dataset name (`_v2` suffixes are forbidden; change the grain or entity) plus a deprecation note in the README.\n- Partitioning defaults to `ingested_date`; override only with a written reason in the `x-partitioning` block.\n- Every schema carries `x-classification` using the platform classification labels.\n- Lineage tags are mandatory; `forge datasets lint` rejects schemas without `x-lineage.producer`.\n- The producing pipeline's `name` must equal the dataset name, so lineage is resolvable without a lookup table.\n\n## Verify\n```bash\nforge datasets lint platforms/forge/schemas/                     # naming, required columns, lineage block\nforge datasets diff \u003cdomain>.\u003centity>_\u003cgrain> --against registry  # backward-compat vs last registered revision\ngrep -n \"x-lineage\" platforms/forge/schemas/\u003cdomain>/\u003centity>_\u003cgrain>.schema.json\n```\nCI runs `forge datasets lint` on every PR that touches `platforms/forge/schemas/**`.\n\n## See also\n- urn:skill:meridian:forge.ontology:ontology-modeling\n- urn:skill:meridian:forge.pipelines.streaming:kafka-ingestion", "raw": "---\nname: dataset-conventions\ndescription: \"[forge] Naming, schema registration, and lineage tagging rules for datasets produced or consumed on the Forge data-integration platform. Use when creating a new dataset, renaming or re-partitioning an existing one, or registering a schema in the Forge schema registry. Do not use for ontology object types (forge.ontology) or for Kafka topic definitions (forge.pipelines.streaming).\"\nlicense: Apache-2.0\ncompatibility: \"Needs a checkout of platforms/forge and forge-cli (`forge datasets ...`) in PATH; no cluster access required.\"\nmetadata:\n  scope: forge\n  owner: forge-platform\n  references: \"platforms/forge/schemas/README.md\"\n  status: active\n  since: \"2026-09-04\"\n  kind: engineering\n  layer: platform\n  triggers: \"dataset naming domain.entity_grain, schema registry, x-lineage tags, forge datasets register, grain suffix, schema evolution\"\n  digest: >-\n    Every Forge dataset is named \u003cdomain>.\u003centity>_\u003cgrain>, registered in the schema registry\n    before its first write, and tagged with lineage metadata pointing at the producing pipeline.\n    Schema changes are additive by default; breaking changes mean a new dataset name.\n---\n# Forge dataset conventions\n\n## When to use / when NOT to use\nUse this skill when you:\n- create a dataset under `platforms/forge/**` (batch or streaming output),\n- rename, re-partition, or change the schema of an existing dataset,\n- register or update a schema in the Forge schema registry,\n- add or fix lineage tags on a dataset.\n\nDo NOT use it for:\n- ontology object types, links, or properties (`forge.ontology:ontology-modeling`),\n- Kafka topic naming and retention (`forge.pipelines.streaming:kafka-ingestion`),\n- PySpark job structure (`forge.pipelines:spark-pipeline-conventions`).\n\n## Steps\n1. Pick the name: `\u003cdomain>.\u003centity>_\u003cgrain>`, e.g. `fleet.vehicle_daily`, `facilities.site_current`.\n   Registered domains are listed in `platforms/forge/schemas/README.md`; add a new one via PR to forge-platform.\n2. Write the schema file `platforms/forge/schemas/\u003cdomain>/\u003centity>_\u003cgrain>.schema.json`\n   (JSON Schema draft 2020-12, one top-level object, `additionalProperties: false`).\n3. Register it: `forge datasets register platforms/forge/schemas/\u003cdomain>/\u003centity>_\u003cgrain>.schema.json`.\n   The command fails if the name is taken or the schema is not backward-compatible with the last revision.\n4. Fill the `x-lineage` block: `producer` (pipeline name), `inputs` (upstream dataset names),\n   `refresh` (`batch-daily`, `batch-hourly`, `streaming`).\n5. Add the dataset to the catalogue table in `platforms/forge/schemas/README.md` with owner and refresh cadence.\n6. Open the PR with the `dataset` label; forge-platform reviews naming and lineage, the domain team reviews columns.\n\n## Conventions specific to this scope\n- Names are lowercase snake_case; the only dot separates domain from entity. No environment prefixes\n  (`dev_`, `prod_`): environments are selected by the writer, never encoded in the name.\n- Grain suffixes are fixed: `_current` (latest state), `_daily`, `_hourly`, `_event` (append-only),\n  `_snapshot_\u003cyyyymm>`. Anything else fails `forge datasets lint`.\n- Every dataset has `id` (string, stable), `ingested_at` (timestamp, UTC), and `source_system` (string).\n- Timestamps are ISO-8601 UTC; no local-time columns. Geometries are WKT strings with a `_wkt` suffix.\n- Schema evolution: adding nullable columns is allowed in place. Removing or retyping a column requires a\n  new dataset name (`_v2` suffixes are forbidden; change the grain or entity) plus a deprecation note in the README.\n- Partitioning defaults to `ingested_date`; override only with a written reason in the `x-partitioning` block.\n- Every schema carries `x-classification` using the platform classification labels.\n- Lineage tags are mandatory; `forge datasets lint` rejects schemas without `x-lineage.producer`.\n- The producing pipeline's `name` must equal the dataset name, so lineage is resolvable without a lookup table.\n\n## Verify\n```bash\nforge datasets lint platforms/forge/schemas/                     # naming, required columns, lineage block\nforge datasets diff \u003cdomain>.\u003centity>_\u003cgrain> --against registry  # backward-compat vs last registered revision\ngrep -n \"x-lineage\" platforms/forge/schemas/\u003cdomain>/\u003centity>_\u003cgrain>.schema.json\n```\nCI runs `forge datasets lint` on every PR that touches `platforms/forge/schemas/**`.\n\n## See also\n- urn:skill:meridian:forge.ontology:ontology-modeling\n- urn:skill:meridian:forge.pipelines.streaming:kafka-ingestion\n", "path": "platforms/forge/.agents/skills/dataset-conventions/SKILL.md", "revision": "8ba74e5d5b634cd377a687089396af5f6a20d04d7f8115c102201119baeb2be4", "bytes": 4538, "requires": [], "refines": [], "references": ["platforms/forge/schemas/README.md"]}, {"id": "urn:skill:meridian:forge.ontology:object-type-migrations", "name": "object-type-migrations", "scope": "forge.ontology", "owner": "ontology-team", "sourceLayer": "team", "knowledgeLayer": "Unclassified", "sourceStatus": "active", "description": "[forge/ontology] Migrating released ontology object types: adding, renaming, widening, or dropping properties and links on types that already hold rows in Postgres. Use when changing an object type that exists in a tagged ontology version. Do not use for brand-new object types (ontology-modeling) or for application-table migrations outside the ontology.", "body": "# Object type migrations\n\n## When to use / when NOT to use\nUse when an object type or link type present in a tagged ontology release (`ontology/v*`) needs to\nchange: new property, property rename, type widening, dropped property, changed link cardinality, or\na different backing dataset.\n\nDo NOT use when:\n- the object type is not yet released; edit `object-types.yaml` directly (`forge.ontology:ontology-modeling`),\n- you are migrating non-ontology tables; application schemas follow `_root:postgres-production` on their own,\n- the change is only inside the backing dataset and the compiled columns are unaffected.\n\n## Steps\n1. Edit `platforms/forge/ontology/schema/object-types.yaml` to the target state.\n2. Generate the skeleton: `forge ontology migrate new --name \u003cverb>_\u003cObjectType>_\u003cdetail>` creates\n   `platforms/forge/ontology/migrations/NNNN_\u003cname>/{migration.yaml,expand.sql,contract.sql}`.\n3. Fill `migration.yaml`: `objectType`, `kind` (`add-property` | `rename-property` | `drop-property` |\n   `widen-type` | `change-link` | `rebackfill`), `deprecates` (old names), `backfill` (SQL file or pipeline name).\n4. Write `expand.sql`: additive only (new nullable column, `CREATE INDEX CONCURRENTLY`, view alias for old name).\n5. Write `contract.sql`: the destructive half, guarded by a `-- requires-release: \u003cnext-version>` header.\n6. Apply to a staging snapshot: `forge ontology migrate apply --phase expand --db \"$STAGING_DB_URL\"`.\n7. Run the backfill and the compatibility tests (see Verify). Attach timing output to the PR.\n8. Ship the expand phase in release N; the contract phase ships in release N+1 at the earliest.\n\n## Conventions specific to this scope\n- Migration directories are zero-padded, monotonically increasing, and never renumbered or reused.\n- One migration touches exactly one object type or one link type. Multi-type changes are several migrations.\n- Renames are never `ALTER COLUMN ... RENAME`; they are add-new, backfill, view alias, drop-old-later.\n- Drops require `deprecatedSince` on the property in `object-types.yaml` for at least one release.\n- Type changes are widen-only (`integer` to `bigint`, `string` to `text`). Narrowing is a new property.\n- Backfills over one million rows run as a Forge batch pipeline, not inline SQL; name it in `migration.yaml`.\n- Index creation always uses `CONCURRENTLY` and lives in `expand.sql`, never in `contract.sql`.\n- Lock timeouts, statement timeouts, and batch sizes follow `_root:postgres-production` exactly.\n- Migration PRs carry the `ontology-migration` label and a rollback note describing how to undo `expand`\n  if `contract` never ships.\n- The rules in `platforms/forge/ontology/migrations/README.md` are the authoritative checklist for reviewers.\n\n## Verify\n```bash\nforge ontology migrate lint platforms/forge/ontology/migrations/            # numbering, one-type rule, phase guards\nforge ontology migrate apply --phase expand --dry-run --db \"$STAGING_DB_URL\"\npytest platforms/forge/ontology/tests/migrations -k NNNN                    # old readers still resolve the type\nforge ontology diff --from ontology/v\u003cprev> --to HEAD                       # only the expected properties changed\n```\n\n## See also\n- urn:skill:meridian:forge.ontology:ontology-modeling\n- urn:skill:meridian:_root:postgres-production\n- urn:skill:meridian:forge:dataset-conventions", "raw": "---\nname: object-type-migrations\ndescription: \"[forge/ontology] Migrating released ontology object types: adding, renaming, widening, or dropping properties and links on types that already hold rows in Postgres. Use when changing an object type that exists in a tagged ontology version. Do not use for brand-new object types (ontology-modeling) or for application-table migrations outside the ontology.\"\nlicense: Apache-2.0\ncompatibility: \"Needs forge-cli, psql, and read access to a staging Postgres with a production-shaped ontology; production apply is done by the release pipeline only.\"\nmetadata:\n  scope: forge.ontology\n  owner: ontology-team\n  requires: \"urn:skill:meridian:forge.ontology:ontology-modeling, urn:skill:meridian:_root:postgres-production\"\n  references: \"platforms/forge/ontology/migrations/README.md\"\n  status: active\n  since: \"2026-09-04\"\n  kind: engineering\n  layer: team\n  refines: \"urn:skill:meridian:_root:postgres-production\"\n  triggers: \"object type migration, expand contract phase, migration.yaml, backfill batches, rename property, ontology release version\"\n  digest: >-\n    Changes to released object types are expressed as numbered migration directories under\n    ontology/migrations and applied in expand and contract phases so readers never see a broken type.\n    Renames and drops need a deprecation window of at least one ontology release.\n---\n# Object type migrations\n\n## When to use / when NOT to use\nUse when an object type or link type present in a tagged ontology release (`ontology/v*`) needs to\nchange: new property, property rename, type widening, dropped property, changed link cardinality, or\na different backing dataset.\n\nDo NOT use when:\n- the object type is not yet released; edit `object-types.yaml` directly (`forge.ontology:ontology-modeling`),\n- you are migrating non-ontology tables; application schemas follow `_root:postgres-production` on their own,\n- the change is only inside the backing dataset and the compiled columns are unaffected.\n\n## Steps\n1. Edit `platforms/forge/ontology/schema/object-types.yaml` to the target state.\n2. Generate the skeleton: `forge ontology migrate new --name \u003cverb>_\u003cObjectType>_\u003cdetail>` creates\n   `platforms/forge/ontology/migrations/NNNN_\u003cname>/{migration.yaml,expand.sql,contract.sql}`.\n3. Fill `migration.yaml`: `objectType`, `kind` (`add-property` | `rename-property` | `drop-property` |\n   `widen-type` | `change-link` | `rebackfill`), `deprecates` (old names), `backfill` (SQL file or pipeline name).\n4. Write `expand.sql`: additive only (new nullable column, `CREATE INDEX CONCURRENTLY`, view alias for old name).\n5. Write `contract.sql`: the destructive half, guarded by a `-- requires-release: \u003cnext-version>` header.\n6. Apply to a staging snapshot: `forge ontology migrate apply --phase expand --db \"$STAGING_DB_URL\"`.\n7. Run the backfill and the compatibility tests (see Verify). Attach timing output to the PR.\n8. Ship the expand phase in release N; the contract phase ships in release N+1 at the earliest.\n\n## Conventions specific to this scope\n- Migration directories are zero-padded, monotonically increasing, and never renumbered or reused.\n- One migration touches exactly one object type or one link type. Multi-type changes are several migrations.\n- Renames are never `ALTER COLUMN ... RENAME`; they are add-new, backfill, view alias, drop-old-later.\n- Drops require `deprecatedSince` on the property in `object-types.yaml` for at least one release.\n- Type changes are widen-only (`integer` to `bigint`, `string` to `text`). Narrowing is a new property.\n- Backfills over one million rows run as a Forge batch pipeline, not inline SQL; name it in `migration.yaml`.\n- Index creation always uses `CONCURRENTLY` and lives in `expand.sql`, never in `contract.sql`.\n- Lock timeouts, statement timeouts, and batch sizes follow `_root:postgres-production` exactly.\n- Migration PRs carry the `ontology-migration` label and a rollback note describing how to undo `expand`\n  if `contract` never ships.\n- The rules in `platforms/forge/ontology/migrations/README.md` are the authoritative checklist for reviewers.\n\n## Verify\n```bash\nforge ontology migrate lint platforms/forge/ontology/migrations/            # numbering, one-type rule, phase guards\nforge ontology migrate apply --phase expand --dry-run --db \"$STAGING_DB_URL\"\npytest platforms/forge/ontology/tests/migrations -k NNNN                    # old readers still resolve the type\nforge ontology diff --from ontology/v\u003cprev> --to HEAD                       # only the expected properties changed\n```\n\n## See also\n- urn:skill:meridian:forge.ontology:ontology-modeling\n- urn:skill:meridian:_root:postgres-production\n- urn:skill:meridian:forge:dataset-conventions\n", "path": "platforms/forge/ontology/.agents/skills/object-type-migrations/SKILL.md", "revision": "8a52bf8735600162c3c71737fff00162fa15e93247f4a9c638f3346b5bb637a3", "bytes": 4719, "requires": ["urn:skill:meridian:forge.ontology:ontology-modeling", "urn:skill:meridian:_root:postgres-production"], "refines": ["urn:skill:meridian:_root:postgres-production"], "references": ["platforms/forge/ontology/migrations/README.md"]}, {"id": "urn:skill:meridian:forge.ontology:ontology-modeling", "name": "ontology-modeling", "scope": "forge.ontology", "owner": "ontology-team", "sourceLayer": "team", "knowledgeLayer": "Unclassified", "sourceStatus": "active", "description": "[forge/ontology] How to define object types, properties, and link types in the Forge ontology backed by Postgres. Use when adding a new object type, adding properties to an unreleased type, or introducing a link between object types. Do not use for changing an object type that already holds rows in a released ontology version (that is object-type-migrations) or for dataset schemas.", "body": "# Ontology modelling on Forge\n\n## When to use / when NOT to use\nUse when you:\n- add a new object type (for example `Facility`, `Vehicle`, `Incident`) to `platforms/forge/ontology/schema/object-types.yaml`,\n- add properties to an object type that has not yet shipped in a tagged ontology release,\n- introduce a link type between two object types,\n- decide which dataset backs an object type.\n\nDo NOT use when:\n- the object type exists in a released ontology version and has rows: follow `forge.ontology:object-type-migrations`,\n- you are changing the dataset schema itself (`forge:dataset-conventions`),\n- you need geospatial indexes on properties; that is owned by `atlas.geo`.\n\n## Steps\n1. Draft the object type under `objectTypes:` in `platforms/forge/ontology/schema/object-types.yaml`.\n   Required keys: `id` (PascalCase), `backingDataset`, `primaryKey`, `titleProperty`, `properties`.\n2. Declare each property with `name` (camelCase), `type` (`string`, `integer`, `double`, `boolean`,\n   `timestamp`, `date`, `geopoint`, `geoshape`, or `array\u003c...>`), and `nullable`.\n3. Declare links under `linkTypes:` with `id`, `from`, `to`, `cardinality` (`one-to-many` | `many-to-many`),\n   and `foreignKey` on the `from` side. Many-to-many links must name a `joinDataset`.\n4. Compile locally: `forge ontology compile platforms/forge/ontology/schema/ --out build/ontology/`.\n   This generates the Postgres DDL plus the Go and TypeScript typings.\n5. Apply to a local database: `forge ontology apply --db \"$DEV_DB_URL\" build/ontology/`.\n6. Add or update the fixture `platforms/forge/ontology/fixtures/\u003cObjectType>.jsonl` (3 to 10 rows).\n7. Open a PR labelled `ontology`; ontology-team reviews naming, the backing dataset owner reviews mappings.\n\n## Conventions specific to this scope\n- Object type ids are singular PascalCase nouns (`Facility`, not `Facilities`). Link ids are\n  `\u003cFrom>At\u003cTo>` / `\u003cFrom>AssignedTo\u003cTo>` style verb phrases, never bare concatenations.\n- Exactly one `backingDataset` per object type, named per `forge:dataset-conventions`; the dataset's\n  `id` column is the `primaryKey`. Composite keys are not allowed.\n- `titleProperty` must be a non-nullable string; the analyst workspace renders it in lists and search results.\n- Property names never repeat the object type name (`Facility.name`, not `Facility.facilityName`).\n- Time is `timestamp` (UTC) or `date`; never model time as `string`.\n- Every object type carries `classification` (string, non-nullable) copied from the dataset's `x-classification`.\n- Enumerations are `string` plus an `enum:` list; the compiler emits a CHECK constraint.\n- Derived or aggregated values are not properties; expose them as a separate object type backed by a\n  `_daily` or `_current` dataset.\n- Keep `objectTypes` sorted by id and `linkTypes` sorted by `from`, then `to`; lint enforces order.\n- `ontologyVersion` at the top of the file is bumped only by the release process, never in a modelling PR.\n\n## Verify\n```bash\nforge ontology lint platforms/forge/ontology/schema/               # naming, key, link, ordering rules\nforge ontology compile platforms/forge/ontology/schema/ --check    # compiles without warnings\nforge ontology apply --dry-run --db \"$DEV_DB_URL\" build/ontology/\npytest platforms/forge/ontology/tests -k fixtures                   # fixtures load against the compiled DDL\n```\n\n## See also\n- urn:skill:meridian:forge.ontology:object-type-migrations\n- urn:skill:meridian:forge:dataset-conventions", "raw": "---\nname: ontology-modeling\ndescription: \"[forge/ontology] How to define object types, properties, and link types in the Forge ontology backed by Postgres. Use when adding a new object type, adding properties to an unreleased type, or introducing a link between object types. Do not use for changing an object type that already holds rows in a released ontology version (that is object-type-migrations) or for dataset schemas.\"\nlicense: Apache-2.0\ncompatibility: \"Needs a checkout of platforms/forge/ontology and forge-cli; a local Postgres 16 from docker compose is sufficient.\"\nmetadata:\n  scope: forge.ontology\n  owner: ontology-team\n  references: \"platforms/forge/ontology/schema/object-types.yaml\"\n  status: active\n  since: \"2026-09-04\"\n  kind: knowledge\n  layer: team\n  triggers: \"object-types.yaml, define object type, link type cardinality, backingDataset primaryKey, titleProperty, forge ontology compile\"\n  digest: >-\n    Ontology object types, properties, and links are declared in object-types.yaml and compiled\n    into Postgres tables by forge-cli. Each object type maps to exactly one backing dataset with a\n    single-column primary key, and links are declared on the side that owns the foreign key.\n---\n# Ontology modelling on Forge\n\n## When to use / when NOT to use\nUse when you:\n- add a new object type (for example `Facility`, `Vehicle`, `Incident`) to `platforms/forge/ontology/schema/object-types.yaml`,\n- add properties to an object type that has not yet shipped in a tagged ontology release,\n- introduce a link type between two object types,\n- decide which dataset backs an object type.\n\nDo NOT use when:\n- the object type exists in a released ontology version and has rows: follow `forge.ontology:object-type-migrations`,\n- you are changing the dataset schema itself (`forge:dataset-conventions`),\n- you need geospatial indexes on properties; that is owned by `atlas.geo`.\n\n## Steps\n1. Draft the object type under `objectTypes:` in `platforms/forge/ontology/schema/object-types.yaml`.\n   Required keys: `id` (PascalCase), `backingDataset`, `primaryKey`, `titleProperty`, `properties`.\n2. Declare each property with `name` (camelCase), `type` (`string`, `integer`, `double`, `boolean`,\n   `timestamp`, `date`, `geopoint`, `geoshape`, or `array\u003c...>`), and `nullable`.\n3. Declare links under `linkTypes:` with `id`, `from`, `to`, `cardinality` (`one-to-many` | `many-to-many`),\n   and `foreignKey` on the `from` side. Many-to-many links must name a `joinDataset`.\n4. Compile locally: `forge ontology compile platforms/forge/ontology/schema/ --out build/ontology/`.\n   This generates the Postgres DDL plus the Go and TypeScript typings.\n5. Apply to a local database: `forge ontology apply --db \"$DEV_DB_URL\" build/ontology/`.\n6. Add or update the fixture `platforms/forge/ontology/fixtures/\u003cObjectType>.jsonl` (3 to 10 rows).\n7. Open a PR labelled `ontology`; ontology-team reviews naming, the backing dataset owner reviews mappings.\n\n## Conventions specific to this scope\n- Object type ids are singular PascalCase nouns (`Facility`, not `Facilities`). Link ids are\n  `\u003cFrom>At\u003cTo>` / `\u003cFrom>AssignedTo\u003cTo>` style verb phrases, never bare concatenations.\n- Exactly one `backingDataset` per object type, named per `forge:dataset-conventions`; the dataset's\n  `id` column is the `primaryKey`. Composite keys are not allowed.\n- `titleProperty` must be a non-nullable string; the analyst workspace renders it in lists and search results.\n- Property names never repeat the object type name (`Facility.name`, not `Facility.facilityName`).\n- Time is `timestamp` (UTC) or `date`; never model time as `string`.\n- Every object type carries `classification` (string, non-nullable) copied from the dataset's `x-classification`.\n- Enumerations are `string` plus an `enum:` list; the compiler emits a CHECK constraint.\n- Derived or aggregated values are not properties; expose them as a separate object type backed by a\n  `_daily` or `_current` dataset.\n- Keep `objectTypes` sorted by id and `linkTypes` sorted by `from`, then `to`; lint enforces order.\n- `ontologyVersion` at the top of the file is bumped only by the release process, never in a modelling PR.\n\n## Verify\n```bash\nforge ontology lint platforms/forge/ontology/schema/               # naming, key, link, ordering rules\nforge ontology compile platforms/forge/ontology/schema/ --check    # compiles without warnings\nforge ontology apply --dry-run --db \"$DEV_DB_URL\" build/ontology/\npytest platforms/forge/ontology/tests -k fixtures                   # fixtures load against the compiled DDL\n```\n\n## See also\n- urn:skill:meridian:forge.ontology:object-type-migrations\n- urn:skill:meridian:forge:dataset-conventions\n", "path": "platforms/forge/ontology/.agents/skills/ontology-modeling/SKILL.md", "revision": "c9799afada33b6f05a6268cd326219dce8179b12538b93b70bed887a17036d47", "bytes": 4684, "requires": [], "refines": [], "references": ["platforms/forge/ontology/schema/object-types.yaml"]}, {"id": "urn:skill:meridian:forge.pipelines:pipeline-testing", "name": "pipeline-testing", "scope": "forge.pipelines", "owner": "pipelines-team", "sourceLayer": "team", "knowledgeLayer": "Unclassified", "sourceStatus": "active", "description": "[forge/pipelines] Unit and golden-file testing of PySpark batch pipelines with pytest, a local SparkSession, and shared conftest fixtures. Use when adding or changing tests for a pipeline, fixing a flaky Spark test, or adding a fixture to conftest.py. Do not use for integration runs against a cluster or for testing streaming consumers.", "body": "# Pipeline testing\n\n## When to use / when NOT to use\nUse when you:\n- add tests for a new or changed pipeline under `platforms/forge/pipelines/tests/`,\n- add or change a fixture in `platforms/forge/pipelines/tests/conftest.py`,\n- update golden outputs after an intentional transform change,\n- debug a flaky or slow Spark test.\n\nDo NOT use when:\n- you need an end-to-end run against staging (`forge pipelines run --env staging`, owned by CI),\n- you are testing a Kafka consumer (`forge.pipelines.streaming:kafka-ingestion` has its own harness),\n- the change is in the pipeline code itself (`forge.pipelines:spark-pipeline-conventions`).\n\n## Steps\n1. Mirror the job path: `tests/jobs/\u003cdomain>/test_\u003centity>_\u003cgrain>.py` for `jobs/\u003cdomain>/\u003centity>_\u003cgrain>.py`.\n2. Use the `spark` fixture from `conftest.py` (session-scoped, `local[2]`, two shuffle partitions).\n3. Build inputs with `make_df(spark, rows, schema)` or the domain fixtures (`sample_vehicles`, `sample_facilities`).\n4. Test `transform` directly: `Pipeline().transform({\"vehicles\": df})`, then\n   `chispa.assert_df_equality(actual, expected, ignore_row_order=True, ignore_nullable=True)`.\n5. Test `validate` with one passing DataFrame and at least one failing one (`pytest.raises(ValidationError)`).\n6. Add the golden test: `tests/golden/\u003cname>/input.jsonl` and `expected.jsonl`; `test_golden` is\n   parametrised by `pytest_generate_tests` in conftest, so only the files are needed.\n7. Regenerate goldens on purpose with `pytest --update-golden -k \u003cname>` and review the diff in the PR.\n\n## Conventions specific to this scope\n- No test touches the network, a real Delta table, or a path outside `tmp_path`.\n- Every test module runs in under 30 s locally; anything slower is `@pytest.mark.slow` with a justification.\n- Row order is never asserted; use `ignore_row_order=True`. Sort explicitly only when testing sort logic.\n- Timestamps in fixtures are explicit UTC (`datetime(2026, 9, 1, tzinfo=timezone.utc)`), never `now()`.\n- Use `ignore_nullable=True`; nullability drift is caught by the golden schema check, not unit tests.\n- Golden files hold at most 50 rows and no real identifiers; use the `fake_id(\"VEH\")` helper.\n- Fixtures are named for what they contain (`sample_incidents`), not for the test that uses them.\n- `conftest.py` at the tests root exposes only session-wide fixtures; per-domain fixtures live in\n  `tests/jobs/\u003cdomain>/conftest.py`.\n- A failing validation test asserts on the error `code` attribute, not on the message text.\n- Coverage gate: `transform` and `validate` at 100 % line coverage per pipeline; `read` and `write` are excluded.\n\n## Verify\n```bash\ncd platforms/forge/pipelines && pytest -q -m \"not slow\"\npytest -q --cov=meridian_pipelines --cov-report=term-missing tests/jobs/\u003cdomain>\npytest -q tests/golden -k \u003cname>\npytest --collect-only -q | grep -c \"test_\"          # sanity: new tests are collected\n```\n\n## See also\n- urn:skill:meridian:forge.pipelines:spark-pipeline-conventions\n- urn:skill:meridian:forge:dataset-conventions", "raw": "---\nname: pipeline-testing\ndescription: \"[forge/pipelines] Unit and golden-file testing of PySpark batch pipelines with pytest, a local SparkSession, and shared conftest fixtures. Use when adding or changing tests for a pipeline, fixing a flaky Spark test, or adding a fixture to conftest.py. Do not use for integration runs against a cluster or for testing streaming consumers.\"\nlicense: Apache-2.0\ncompatibility: \"Needs the platforms/forge/pipelines virtualenv with pytest, pyspark, and chispa installed; runs on a laptop with a local Spark master.\"\nmetadata:\n  scope: forge.pipelines\n  owner: pipelines-team\n  requires: \"urn:skill:meridian:forge.pipelines:spark-pipeline-conventions\"\n  references: \"platforms/forge/pipelines/tests/conftest.py\"\n  status: active\n  since: \"2026-09-04\"\n  kind: engineering\n  layer: team\n  triggers: \"PySpark pipeline test, conftest fixtures, chispa assert_df_equality, golden-file test, flaky Spark test, spark session fixture\"\n  digest: >-\n    Pipeline tests exercise the transform and validate hooks against small in-memory DataFrames\n    built from conftest fixtures, plus one golden-file test per output dataset. Tests are\n    deterministic, cluster-free, and finish in under thirty seconds per module.\n---\n# Pipeline testing\n\n## When to use / when NOT to use\nUse when you:\n- add tests for a new or changed pipeline under `platforms/forge/pipelines/tests/`,\n- add or change a fixture in `platforms/forge/pipelines/tests/conftest.py`,\n- update golden outputs after an intentional transform change,\n- debug a flaky or slow Spark test.\n\nDo NOT use when:\n- you need an end-to-end run against staging (`forge pipelines run --env staging`, owned by CI),\n- you are testing a Kafka consumer (`forge.pipelines.streaming:kafka-ingestion` has its own harness),\n- the change is in the pipeline code itself (`forge.pipelines:spark-pipeline-conventions`).\n\n## Steps\n1. Mirror the job path: `tests/jobs/\u003cdomain>/test_\u003centity>_\u003cgrain>.py` for `jobs/\u003cdomain>/\u003centity>_\u003cgrain>.py`.\n2. Use the `spark` fixture from `conftest.py` (session-scoped, `local[2]`, two shuffle partitions).\n3. Build inputs with `make_df(spark, rows, schema)` or the domain fixtures (`sample_vehicles`, `sample_facilities`).\n4. Test `transform` directly: `Pipeline().transform({\"vehicles\": df})`, then\n   `chispa.assert_df_equality(actual, expected, ignore_row_order=True, ignore_nullable=True)`.\n5. Test `validate` with one passing DataFrame and at least one failing one (`pytest.raises(ValidationError)`).\n6. Add the golden test: `tests/golden/\u003cname>/input.jsonl` and `expected.jsonl`; `test_golden` is\n   parametrised by `pytest_generate_tests` in conftest, so only the files are needed.\n7. Regenerate goldens on purpose with `pytest --update-golden -k \u003cname>` and review the diff in the PR.\n\n## Conventions specific to this scope\n- No test touches the network, a real Delta table, or a path outside `tmp_path`.\n- Every test module runs in under 30 s locally; anything slower is `@pytest.mark.slow` with a justification.\n- Row order is never asserted; use `ignore_row_order=True`. Sort explicitly only when testing sort logic.\n- Timestamps in fixtures are explicit UTC (`datetime(2026, 9, 1, tzinfo=timezone.utc)`), never `now()`.\n- Use `ignore_nullable=True`; nullability drift is caught by the golden schema check, not unit tests.\n- Golden files hold at most 50 rows and no real identifiers; use the `fake_id(\"VEH\")` helper.\n- Fixtures are named for what they contain (`sample_incidents`), not for the test that uses them.\n- `conftest.py` at the tests root exposes only session-wide fixtures; per-domain fixtures live in\n  `tests/jobs/\u003cdomain>/conftest.py`.\n- A failing validation test asserts on the error `code` attribute, not on the message text.\n- Coverage gate: `transform` and `validate` at 100 % line coverage per pipeline; `read` and `write` are excluded.\n\n## Verify\n```bash\ncd platforms/forge/pipelines && pytest -q -m \"not slow\"\npytest -q --cov=meridian_pipelines --cov-report=term-missing tests/jobs/\u003cdomain>\npytest -q tests/golden -k \u003cname>\npytest --collect-only -q | grep -c \"test_\"          # sanity: new tests are collected\n```\n\n## See also\n- urn:skill:meridian:forge.pipelines:spark-pipeline-conventions\n- urn:skill:meridian:forge:dataset-conventions\n", "path": "platforms/forge/pipelines/.agents/skills/pipeline-testing/SKILL.md", "revision": "34262f9542a0bbe1f16ebb1672eea1a011b122a1dab5b9a30da320d2003f9e55", "bytes": 4265, "requires": ["urn:skill:meridian:forge.pipelines:spark-pipeline-conventions"], "refines": [], "references": ["platforms/forge/pipelines/tests/conftest.py"]}, {"id": "urn:skill:meridian:forge.pipelines:spark-pipeline-conventions", "name": "spark-pipeline-conventions", "scope": "forge.pipelines", "owner": "pipelines-team", "sourceLayer": "team", "knowledgeLayer": "Unclassified", "sourceStatus": "active", "description": "[forge/pipelines] Structure, naming, and lifecycle hooks for PySpark batch pipelines in the meridian_pipelines package. Use when creating or modifying a batch pipeline, adding a transform, or registering a pipeline in the scheduler catalogue. Do not use for streaming Kafka consumers or for dataset naming rules.", "body": "# Spark pipeline conventions\n\n## When to use / when NOT to use\nUse when you:\n- add a new batch pipeline under `platforms/forge/pipelines/src/meridian_pipelines/jobs/`,\n- change a transform, validation, or write step in an existing pipeline,\n- register a pipeline in `platforms/forge/pipelines/catalogue.yaml` for scheduling.\n\nDo NOT use when:\n- the job consumes Kafka and runs continuously (`forge.pipelines.streaming:kafka-ingestion`),\n- the question is what to call the output dataset (`forge:dataset-conventions`),\n- you are only writing or fixing tests (`forge.pipelines:pipeline-testing`).\n\n## Steps\n1. Create `src/meridian_pipelines/jobs/\u003cdomain>/\u003centity>_\u003cgrain>.py`: one module per output dataset.\n2. Subclass `BasePipeline` from `src/meridian_pipelines/base.py`; set `name`, `output_dataset`, `inputs`.\n3. Implement the hooks: `read(spark) -> dict[str, DataFrame]`, `transform(inputs) -> DataFrame`,\n   `validate(df) -> None` (raise `ValidationError`), and `write(df, run_date)` only if the default Delta write is wrong.\n4. Keep `transform` pure: no I/O, no `spark.read`, no side effects. All I/O belongs in `read` and `write`.\n5. Register the pipeline in `platforms/forge/pipelines/catalogue.yaml` with `schedule`, `owner`, `sla_minutes`.\n6. Run locally: `forge pipelines run \u003cname> --local --date 2026-09-01`.\n7. Add tests per `forge.pipelines:pipeline-testing` and open a PR labelled `pipeline`.\n\n## Conventions specific to this scope\n- Module, class, and `name` are one identifier in three casings: `fleet/vehicle_daily.py`,\n  `VehicleDailyPipeline`, `fleet.vehicle_daily`. The `name` equals the output dataset name.\n- Never call `SparkSession.builder` inside a job; use the session passed into `BasePipeline.run()`.\n- Column expressions use `pyspark.sql.functions` (`F.col`, `F.lit`); string SQL is allowed only in `read` for pushdown.\n- Every output has `ingested_at` and `pipeline_run_id`; `BasePipeline.run` adds them before `validate`.\n- Writes are idempotent per partition: `mode(\"overwrite\")` with `replaceWhere` on the run date. No appends in batch.\n- Validation is mandatory: at minimum non-null `id` and row-count bounds, via `self.expect(condition, code)`.\n- UDFs only when no native function exists; they live in `src/meridian_pipelines/udfs/` with a benchmark note.\n- Configuration comes from `self.config` (loaded from `catalogue.yaml`); jobs never read environment variables.\n- Log through `self.log` (structured JSON); `print()` fails lint.\n- Dependencies between pipelines are declared in `inputs`, never implied by scheduling order.\n- Spark settings (`shuffle.partitions`, memory) are set in the catalogue entry, not in code.\n\n## Verify\n```bash\nruff check platforms/forge/pipelines/src && ruff format --check platforms/forge/pipelines/src\nforge pipelines lint platforms/forge/pipelines/catalogue.yaml            # names match modules and datasets\nforge pipelines run \u003cname> --local --date 2026-09-01 --dry-run            # plan only; prints resolved lineage\npytest platforms/forge/pipelines/tests -k \u003centity>\n```\n\n## See also\n- urn:skill:meridian:forge.pipelines:pipeline-testing\n- urn:skill:meridian:forge:dataset-conventions", "raw": "---\nname: spark-pipeline-conventions\ndescription: \"[forge/pipelines] Structure, naming, and lifecycle hooks for PySpark batch pipelines in the meridian_pipelines package. Use when creating or modifying a batch pipeline, adding a transform, or registering a pipeline in the scheduler catalogue. Do not use for streaming Kafka consumers or for dataset naming rules.\"\nlicense: Apache-2.0\ncompatibility: \"Needs Python 3.12, PySpark 3.5, and the platforms/forge/pipelines virtualenv (`make venv`); no cluster access required for local runs.\"\nmetadata:\n  scope: forge.pipelines\n  owner: pipelines-team\n  references: \"platforms/forge/pipelines/src/meridian_pipelines/base.py\"\n  status: active\n  since: \"2026-09-04\"\n  kind: engineering\n  layer: team\n  triggers: \"BasePipeline subclass, transform validate hooks, catalogue.yaml registration, idempotent partition overwrite, batch pipeline module, PySpark job structure\"\n  digest: >-\n    Batch pipelines subclass BasePipeline and implement read, transform, validate, and optionally\n    write hooks; the base class owns session handling, lineage columns, and idempotent partition\n    overwrites. One pipeline per output dataset, one module per pipeline, registered in the catalogue.\n---\n# Spark pipeline conventions\n\n## When to use / when NOT to use\nUse when you:\n- add a new batch pipeline under `platforms/forge/pipelines/src/meridian_pipelines/jobs/`,\n- change a transform, validation, or write step in an existing pipeline,\n- register a pipeline in `platforms/forge/pipelines/catalogue.yaml` for scheduling.\n\nDo NOT use when:\n- the job consumes Kafka and runs continuously (`forge.pipelines.streaming:kafka-ingestion`),\n- the question is what to call the output dataset (`forge:dataset-conventions`),\n- you are only writing or fixing tests (`forge.pipelines:pipeline-testing`).\n\n## Steps\n1. Create `src/meridian_pipelines/jobs/\u003cdomain>/\u003centity>_\u003cgrain>.py`: one module per output dataset.\n2. Subclass `BasePipeline` from `src/meridian_pipelines/base.py`; set `name`, `output_dataset`, `inputs`.\n3. Implement the hooks: `read(spark) -> dict[str, DataFrame]`, `transform(inputs) -> DataFrame`,\n   `validate(df) -> None` (raise `ValidationError`), and `write(df, run_date)` only if the default Delta write is wrong.\n4. Keep `transform` pure: no I/O, no `spark.read`, no side effects. All I/O belongs in `read` and `write`.\n5. Register the pipeline in `platforms/forge/pipelines/catalogue.yaml` with `schedule`, `owner`, `sla_minutes`.\n6. Run locally: `forge pipelines run \u003cname> --local --date 2026-09-01`.\n7. Add tests per `forge.pipelines:pipeline-testing` and open a PR labelled `pipeline`.\n\n## Conventions specific to this scope\n- Module, class, and `name` are one identifier in three casings: `fleet/vehicle_daily.py`,\n  `VehicleDailyPipeline`, `fleet.vehicle_daily`. The `name` equals the output dataset name.\n- Never call `SparkSession.builder` inside a job; use the session passed into `BasePipeline.run()`.\n- Column expressions use `pyspark.sql.functions` (`F.col`, `F.lit`); string SQL is allowed only in `read` for pushdown.\n- Every output has `ingested_at` and `pipeline_run_id`; `BasePipeline.run` adds them before `validate`.\n- Writes are idempotent per partition: `mode(\"overwrite\")` with `replaceWhere` on the run date. No appends in batch.\n- Validation is mandatory: at minimum non-null `id` and row-count bounds, via `self.expect(condition, code)`.\n- UDFs only when no native function exists; they live in `src/meridian_pipelines/udfs/` with a benchmark note.\n- Configuration comes from `self.config` (loaded from `catalogue.yaml`); jobs never read environment variables.\n- Log through `self.log` (structured JSON); `print()` fails lint.\n- Dependencies between pipelines are declared in `inputs`, never implied by scheduling order.\n- Spark settings (`shuffle.partitions`, memory) are set in the catalogue entry, not in code.\n\n## Verify\n```bash\nruff check platforms/forge/pipelines/src && ruff format --check platforms/forge/pipelines/src\nforge pipelines lint platforms/forge/pipelines/catalogue.yaml            # names match modules and datasets\nforge pipelines run \u003cname> --local --date 2026-09-01 --dry-run            # plan only; prints resolved lineage\npytest platforms/forge/pipelines/tests -k \u003centity>\n```\n\n## See also\n- urn:skill:meridian:forge.pipelines:pipeline-testing\n- urn:skill:meridian:forge:dataset-conventions\n", "path": "platforms/forge/pipelines/.agents/skills/spark-pipeline-conventions/SKILL.md", "revision": "7798003397b4e97f6141432a2e45cef59bac9f6bb44524ebfc1d9f580f18f311", "bytes": 4384, "requires": [], "refines": [], "references": ["platforms/forge/pipelines/src/meridian_pipelines/base.py"]}, {"id": "urn:skill:meridian:forge.pipelines.streaming:kafka-ingestion", "name": "kafka-ingestion", "scope": "forge.pipelines.streaming", "owner": "streaming-team", "sourceLayer": "team", "knowledgeLayer": "Unclassified", "sourceStatus": "active", "description": "[forge/pipelines/streaming] Building Kafka ingestion jobs with Spark Structured Streaming: topic declaration, consumer groups, checkpointing, dead-letter handling, and landing into Forge _event datasets. Use when adding a topic to config/topics.yaml, writing or changing a streaming consumer, or tuning retention and checkpoint settings. Do not use for scheduled batch pipelines or for Kafka producers owned by other platforms.", "body": "# Kafka ingestion\n\n## When to use / when NOT to use\nUse when you:\n- declare a new topic or change `retentionMs`, `partitions`, or `schemaRef` in\n  `platforms/forge/pipelines/streaming/config/topics.yaml`,\n- write or modify a consumer under `platforms/forge/pipelines/streaming/src/meridian_streaming/consumers/`,\n- change checkpointing, trigger interval, watermark, or dead-letter handling.\n\nDo NOT use when:\n- the job runs on a schedule and reads tables or files (`forge.pipelines:spark-pipeline-conventions`),\n- you are producing to Kafka from another platform; producers own their schema and contract tests,\n- you only need to name the landing dataset (`forge:dataset-conventions`).\n\n## Steps\n1. Declare the topic in `config/topics.yaml`: `name`, `partitions`, `retentionMs`, `schemaRef`\n   (Avro schema path), `owner`, `landingDataset`.\n2. Create `consumers/\u003cdomain>/\u003centity>_event.py` subclassing `StreamingPipeline` (itself a `BasePipeline`).\n   Set `topic`, `output_dataset` (must end in `_event`), and `idempotency_key`.\n3. Implement `transform(df)` on the decoded Avro payload; keep it pure, same rules as batch.\n4. Implement `validate(df)`; malformed records go to `\u003ctopic>.dlq` through `self.dead_letter(df, reason)`.\n5. Set `checkpoint_path = f\"checkpoints/{self.name}\"` relative to the streaming root; never share checkpoints.\n6. Run locally: `make kafka-up && forge streaming run \u003cname> --local --from-beginning`.\n7. Publish sample events with `forge streaming produce \u003ctopic> --file tests/events/\u003centity>.jsonl` and\n   confirm rows land in the `_event` dataset.\n8. Open a PR labelled `streaming`; streaming-team reviews topic config, the dataset owner reviews the landing schema.\n\n## Conventions specific to this scope\n- Topic names: `meridian.\u003cdomain>.\u003centity>.\u003cversion>` (`meridian.fleet.vehicle-position.v1`). A version bump\n  is a new topic; the old one stays until `retentionMs` drains it.\n- `retentionMs` is mandatory and explicit even when it equals the default of 7 days (`604800000`).\n  Anything above 30 days needs a reason comment next to the value in `topics.yaml`.\n- Partitions: minimum 3, always a multiple of 3; changing partition count means a new topic version.\n- Consumer group id equals the pipeline `name`; one consumer group per topic per landing dataset.\n- Trigger interval defaults to `30 seconds`; `availableNow` is only for backfills and runs with `--once`.\n- Exactly-once is a `MERGE` on `idempotency_key` into the `_event` dataset; never rely on Kafka offsets alone.\n- Checkpoints are never deleted by hand. To reprocess, deploy a new consumer with `--reset-offsets earliest`\n  under a change ticket.\n- Payloads are Avro with a registered schema; JSON is accepted only on `*.dlq` topics.\n- Watermark is `ingested_at` with 10 minutes of allowed lateness; late records go to the `_late` partition, not the DLQ.\n- SASL credentials come from the mounted `kafka-auth` secret, never from `topics.yaml` or code.\n\n## Verify\n```bash\nforge streaming lint platforms/forge/pipelines/streaming/config/topics.yaml   # names, retentionMs present, partitions % 3\nforge streaming run \u003cname> --local --from-beginning --max-batches 3\nforge datasets lint platforms/forge/schemas/\u003cdomain>/\u003centity>_event.schema.json\npytest platforms/forge/pipelines/streaming/tests -k \u003centity>\n```\n\n## See also\n- urn:skill:meridian:forge.pipelines:spark-pipeline-conventions\n- urn:skill:meridian:forge:dataset-conventions\n- urn:skill:meridian:forge.pipelines:pipeline-testing", "raw": "---\nname: kafka-ingestion\ndescription: \"[forge/pipelines/streaming] Building Kafka ingestion jobs with Spark Structured Streaming: topic declaration, consumer groups, checkpointing, dead-letter handling, and landing into Forge _event datasets. Use when adding a topic to config/topics.yaml, writing or changing a streaming consumer, or tuning retention and checkpoint settings. Do not use for scheduled batch pipelines or for Kafka producers owned by other platforms.\"\nlicense: Apache-2.0\ncompatibility: \"Needs the pipelines virtualenv plus a local single-broker Kafka (`make kafka-up` via docker compose); cluster credentials are not needed for local work.\"\nmetadata:\n  scope: forge.pipelines.streaming\n  owner: streaming-team\n  requires: \"urn:skill:meridian:forge.pipelines:spark-pipeline-conventions, urn:skill:meridian:forge:dataset-conventions\"\n  references: \"platforms/forge/pipelines/streaming/config/topics.yaml#retentionMs\"\n  status: active\n  since: \"2026-09-04\"\n  kind: engineering\n  layer: team\n  refines: \"urn:skill:meridian:forge.pipelines:spark-pipeline-conventions\"\n  triggers: \"Kafka topic declaration, topics.yaml retentionMs, StreamingPipeline consumer, checkpoint path, dead-letter handling, _event dataset merge\"\n  digest: >-\n    Streaming consumers are StreamingPipeline subclasses that read one declared Kafka topic,\n    checkpoint to their own path, and merge records into an _event dataset by idempotency key.\n    Topics, partitions, and retentionMs are declared in topics.yaml and reviewed by streaming-team.\n---\n# Kafka ingestion\n\n## When to use / when NOT to use\nUse when you:\n- declare a new topic or change `retentionMs`, `partitions`, or `schemaRef` in\n  `platforms/forge/pipelines/streaming/config/topics.yaml`,\n- write or modify a consumer under `platforms/forge/pipelines/streaming/src/meridian_streaming/consumers/`,\n- change checkpointing, trigger interval, watermark, or dead-letter handling.\n\nDo NOT use when:\n- the job runs on a schedule and reads tables or files (`forge.pipelines:spark-pipeline-conventions`),\n- you are producing to Kafka from another platform; producers own their schema and contract tests,\n- you only need to name the landing dataset (`forge:dataset-conventions`).\n\n## Steps\n1. Declare the topic in `config/topics.yaml`: `name`, `partitions`, `retentionMs`, `schemaRef`\n   (Avro schema path), `owner`, `landingDataset`.\n2. Create `consumers/\u003cdomain>/\u003centity>_event.py` subclassing `StreamingPipeline` (itself a `BasePipeline`).\n   Set `topic`, `output_dataset` (must end in `_event`), and `idempotency_key`.\n3. Implement `transform(df)` on the decoded Avro payload; keep it pure, same rules as batch.\n4. Implement `validate(df)`; malformed records go to `\u003ctopic>.dlq` through `self.dead_letter(df, reason)`.\n5. Set `checkpoint_path = f\"checkpoints/{self.name}\"` relative to the streaming root; never share checkpoints.\n6. Run locally: `make kafka-up && forge streaming run \u003cname> --local --from-beginning`.\n7. Publish sample events with `forge streaming produce \u003ctopic> --file tests/events/\u003centity>.jsonl` and\n   confirm rows land in the `_event` dataset.\n8. Open a PR labelled `streaming`; streaming-team reviews topic config, the dataset owner reviews the landing schema.\n\n## Conventions specific to this scope\n- Topic names: `meridian.\u003cdomain>.\u003centity>.\u003cversion>` (`meridian.fleet.vehicle-position.v1`). A version bump\n  is a new topic; the old one stays until `retentionMs` drains it.\n- `retentionMs` is mandatory and explicit even when it equals the default of 7 days (`604800000`).\n  Anything above 30 days needs a reason comment next to the value in `topics.yaml`.\n- Partitions: minimum 3, always a multiple of 3; changing partition count means a new topic version.\n- Consumer group id equals the pipeline `name`; one consumer group per topic per landing dataset.\n- Trigger interval defaults to `30 seconds`; `availableNow` is only for backfills and runs with `--once`.\n- Exactly-once is a `MERGE` on `idempotency_key` into the `_event` dataset; never rely on Kafka offsets alone.\n- Checkpoints are never deleted by hand. To reprocess, deploy a new consumer with `--reset-offsets earliest`\n  under a change ticket.\n- Payloads are Avro with a registered schema; JSON is accepted only on `*.dlq` topics.\n- Watermark is `ingested_at` with 10 minutes of allowed lateness; late records go to the `_late` partition, not the DLQ.\n- SASL credentials come from the mounted `kafka-auth` secret, never from `topics.yaml` or code.\n\n## Verify\n```bash\nforge streaming lint platforms/forge/pipelines/streaming/config/topics.yaml   # names, retentionMs present, partitions % 3\nforge streaming run \u003cname> --local --from-beginning --max-batches 3\nforge datasets lint platforms/forge/schemas/\u003cdomain>/\u003centity>_event.schema.json\npytest platforms/forge/pipelines/streaming/tests -k \u003centity>\n```\n\n## See also\n- urn:skill:meridian:forge.pipelines:spark-pipeline-conventions\n- urn:skill:meridian:forge:dataset-conventions\n- urn:skill:meridian:forge.pipelines:pipeline-testing\n", "path": "platforms/forge/pipelines/streaming/.agents/skills/kafka-ingestion/SKILL.md", "revision": "fc1ab52ecac4802718cbca0e3b0cd6550a1d2f5e57023de515060adb787f45a2", "bytes": 5018, "requires": ["urn:skill:meridian:forge.pipelines:spark-pipeline-conventions", "urn:skill:meridian:forge:dataset-conventions"], "refines": ["urn:skill:meridian:forge.pipelines:spark-pipeline-conventions"], "references": ["platforms/forge/pipelines/streaming/config/topics.yaml#retentionMs"]}, {"id": "urn:skill:meridian:security:classification-labels", "name": "classification-labels", "scope": "security", "owner": "security-org", "sourceLayer": "platform", "knowledgeLayer": "Unclassified", "sourceStatus": "active", "description": "[security] Data-classification labels in Meridian: the Label enum in libs/classification (UNCLASSIFIED, OFFICIAL, RESTRICTED, CONFIDENTIAL), how labels attach to datasets, records and API responses, and how they propagate through joins, pipelines and exports. Use when you add a field or dataset that carries a label, write code that merges or derives data, or expose data over an API. Do not use for audit event formats or for RBAC policy authoring.", "body": "# Classification labels\n\n## When to use / when NOT to use\nUse when you:\n- add a table, dataset, Kafka topic or object type that stores labelled data;\n- write pipeline, join, aggregation or export code that combines inputs with different labels;\n- return data from an API and must set the response label header;\n- add a new label value or handling caveat (this needs security-org review and an ADR).\n\nDo not use for how audit events are recorded (`security.audit:audit-logging`) or for writing access\npolicies that consume labels (`atlas.identity:rbac-policies`).\n\n## Steps\n1. Import `meridian.example/libs/classification` and use the `Label` type; never a bare string or int.\n   Valid values, lowest to highest: `UNCLASSIFIED`, `OFFICIAL`, `RESTRICTED`, `CONFIDENTIAL`.\n2. Store the label in a dedicated column or field named `classification` with a NOT NULL constraint and a\n   check against the enum. In ontology schemas the property is `classification: label`.\n3. When deriving data compute the output label with `classification.Propagate(inputs...)`, which returns the\n   highest input label. Do not hand-roll `max` over strings; the order is defined once in `labels.go`.\n4. On HTTP responses set `X-Meridian-Classification: \u003clabel>` from the payload's computed label. gRPC uses\n   the `meridian-classification` metadata key. The auth SDK reads it for policy checks.\n5. Exports (CSV, Parquet, bundle) write the label into file metadata and the file name suffix\n   (`dataset_2026-09.RESTRICTED.parquet`).\n6. Downgrading a label is a manual, audited action through the security service; code paths must never\n   assign a lower label than `Propagate` returns.\n7. Run the classification lint before pushing; CI blocks any labelled type without a `classification` field.\n\n## Conventions specific to this scope\n- The enum is closed. Adding a value changes `labels.go`, the Python mirror, the Postgres domain type and\n  the ontology schema in one PR with security-org approval.\n- Label comparisons use `a.AtMost(b)` and `a.Dominates(b)`; `==` is only for equality of the same level.\n- Unknown or missing labels are an error (`ErrUnlabelled`), never a default to `UNCLASSIFIED`.\n- Caveats (for example `REL-PARTNER`) are a separate `Caveats []string` field; they are additive and also\n  propagate.\n- Test fixtures use labelled sample data from `libs/classification/testdata`; do not invent label strings.\n- Logs and metrics never include record content, only the label level as a dimension.\n- UI components render labels with the shared banner component; colour and wording come from the library,\n  not from per-app CSS.\n\n## Verify\n```bash\ngo test ./libs/classification/...                                        # enum order and Propagate\ngo run ./libs/classification/cmd/classlint ./platforms/...              # every labelled type carries a Label\ngrep -rn '\"RESTRICTED\"\\|\"CONFIDENTIAL\"' --include=*.go platforms/ libs/  # literals outside labels.go are a smell\npsql \"$DATABASE_URL\" -c \"\\dT+ classification_label\"                      # Postgres domain matches the enum\n```\n\n## See also\n- urn:skill:meridian:security.audit:audit-logging\n- urn:skill:meridian:atlas.identity:rbac-policies", "raw": "---\nname: classification-labels\ndescription: \"[security] Data-classification labels in Meridian: the Label enum in libs/classification (UNCLASSIFIED, OFFICIAL, RESTRICTED, CONFIDENTIAL), how labels attach to datasets, records and API responses, and how they propagate through joins, pipelines and exports. Use when you add a field or dataset that carries a label, write code that merges or derives data, or expose data over an API. Do not use for audit event formats or for RBAC policy authoring.\"\nlicense: Apache-2.0\ncompatibility: \"Needs the libs/classification Go module (or its Python mirror) and the classification lint in CI.\"\nmetadata:\n  scope: security\n  owner: security-org\n  references: \"libs/classification/labels.go#Label\"\n  status: active\n  since: \"2026-09-04\"\n  kind: governance\n  layer: platform\n  triggers: \"classification Label enum, UNCLASSIFIED OFFICIAL RESTRICTED CONFIDENTIAL, Propagate helper, X-Meridian-Classification header, label downgrade, libs/classification\"\n  digest: >-\n    Every dataset, record and API response in Meridian carries a classification Label from libs/classification,\n    ordered UNCLASSIFIED to CONFIDENTIAL. Derived data always takes the highest label of its inputs, and code\n    must use the shared Propagate helper rather than string comparisons.\n---\n\n# Classification labels\n\n## When to use / when NOT to use\nUse when you:\n- add a table, dataset, Kafka topic or object type that stores labelled data;\n- write pipeline, join, aggregation or export code that combines inputs with different labels;\n- return data from an API and must set the response label header;\n- add a new label value or handling caveat (this needs security-org review and an ADR).\n\nDo not use for how audit events are recorded (`security.audit:audit-logging`) or for writing access\npolicies that consume labels (`atlas.identity:rbac-policies`).\n\n## Steps\n1. Import `meridian.example/libs/classification` and use the `Label` type; never a bare string or int.\n   Valid values, lowest to highest: `UNCLASSIFIED`, `OFFICIAL`, `RESTRICTED`, `CONFIDENTIAL`.\n2. Store the label in a dedicated column or field named `classification` with a NOT NULL constraint and a\n   check against the enum. In ontology schemas the property is `classification: label`.\n3. When deriving data compute the output label with `classification.Propagate(inputs...)`, which returns the\n   highest input label. Do not hand-roll `max` over strings; the order is defined once in `labels.go`.\n4. On HTTP responses set `X-Meridian-Classification: \u003clabel>` from the payload's computed label. gRPC uses\n   the `meridian-classification` metadata key. The auth SDK reads it for policy checks.\n5. Exports (CSV, Parquet, bundle) write the label into file metadata and the file name suffix\n   (`dataset_2026-09.RESTRICTED.parquet`).\n6. Downgrading a label is a manual, audited action through the security service; code paths must never\n   assign a lower label than `Propagate` returns.\n7. Run the classification lint before pushing; CI blocks any labelled type without a `classification` field.\n\n## Conventions specific to this scope\n- The enum is closed. Adding a value changes `labels.go`, the Python mirror, the Postgres domain type and\n  the ontology schema in one PR with security-org approval.\n- Label comparisons use `a.AtMost(b)` and `a.Dominates(b)`; `==` is only for equality of the same level.\n- Unknown or missing labels are an error (`ErrUnlabelled`), never a default to `UNCLASSIFIED`.\n- Caveats (for example `REL-PARTNER`) are a separate `Caveats []string` field; they are additive and also\n  propagate.\n- Test fixtures use labelled sample data from `libs/classification/testdata`; do not invent label strings.\n- Logs and metrics never include record content, only the label level as a dimension.\n- UI components render labels with the shared banner component; colour and wording come from the library,\n  not from per-app CSS.\n\n## Verify\n```bash\ngo test ./libs/classification/...                                        # enum order and Propagate\ngo run ./libs/classification/cmd/classlint ./platforms/...              # every labelled type carries a Label\ngrep -rn '\"RESTRICTED\"\\|\"CONFIDENTIAL\"' --include=*.go platforms/ libs/  # literals outside labels.go are a smell\npsql \"$DATABASE_URL\" -c \"\\dT+ classification_label\"                      # Postgres domain matches the enum\n```\n\n## See also\n- urn:skill:meridian:security.audit:audit-logging\n- urn:skill:meridian:atlas.identity:rbac-policies\n", "path": "security/.agents/skills/classification-labels/SKILL.md", "revision": "12e069b9d8dead036040d73ff3a0e2c86d4cc140aa36322c4bed27872a2ff623", "bytes": 4486, "requires": [], "refines": [], "references": ["libs/classification/labels.go#Label"]}, {"id": "urn:skill:meridian:security.audit:audit-logging", "name": "audit-logging", "scope": "security.audit", "owner": "audit-team", "sourceLayer": "team", "knowledgeLayer": "Unclassified", "sourceStatus": "active", "description": "[security/audit] How Meridian services emit tamper-evident audit events: the structured logger in security/audit/src, mandatory fields (actor, action, resource, classification, outcome), what must and must not be recorded, sinks, retention and verification. Use when you add an operation that reads or changes labelled data, wire a new service into the audit pipeline, or change event fields. Do not use for application debug logging or metrics.", "body": "# Audit logging\n\n## When to use / when NOT to use\nUse when you:\n- add an endpoint, job or pipeline step that reads, writes, exports or deletes labelled data;\n- onboard a new service to the audit sink or change its sink configuration;\n- add or rename a field in the audit event schema;\n- investigate a gap reported by the audit completeness check.\n\nDo not use for debug or application logs (use the platform logger), for metrics and traces, or for\nsecurity incident handling procedures.\n\n## Steps\n1. Construct one logger per process from `security/audit/src`:\n   `al, err := audit.NewLogger(audit.Config{Service: \"atlas-graph\", Sink: sink})`. Never per request.\n2. Emit exactly one event per logical operation, after the outcome is known:\n   `al.Emit(ctx, audit.Event{Action: \"dataset.export\", Resource: urn, Classification: lbl, Outcome: audit.Denied})`.\n   Actor and session come from the auth SDK principal in `ctx`; do not pass them by hand.\n3. Cover the error path: a denied, failed or timed-out operation is still an event with `Outcome` set.\n   A missing event on failure is a CI-blocking bug.\n4. Put context in `Details` as a small flat map (query id, row count, export format). Never include record\n   content, tokens or free-text user input.\n5. Set `Classification` to the label of the data touched, computed with `classification.Propagate` when\n   several inputs are involved; the sink indexes on it.\n6. For batch jobs emit a `batch.start` and `batch.end` pair sharing one `CorrelationID`, with per-item events\n   only for writes.\n7. Run the completeness check in CI: it compares actions registered in the policy registry with actions seen\n   in the test sink and fails on any missing one.\n\n## Conventions specific to this scope\n- The schema is versioned (`schema_version: 3`) and append-only; fields are never removed, only deprecated.\n- Mandatory fields: `time` (RFC 3339, UTC), `service`, `actor`, `session_id`, `action`, `resource`,\n  `classification`, `outcome`, `correlation_id`, `prev_hash`, `hash`.\n- Actions are `\u003cnoun>.\u003cverb>` and must exist in the policy registry; the logger rejects unknown actions.\n- Events are hash-chained per service: `prev_hash` is the previous event's `hash`, so gaps are detectable.\n- The sink is append-only. Retention is seven years for RESTRICTED and above, two years otherwise; rotation\n  is by day or by 512 MiB, whichever comes first.\n- The file sink is for tests and air-gapped buffering only; production uses the streaming sink with\n  at-least-once delivery and a local spool during outages.\n- Events are written synchronously before the response is returned; a sink failure blocks the operation\n  unless the service is marked `audit.BestEffort` with a security-org approved exception.\n- Audit logs are themselves CONFIDENTIAL; reading the sink is a labelled operation and is audited.\n\n## Verify\n```bash\ngo test ./security/audit/...                                       # schema, chaining, sink behaviour\ngo run ./security/audit/cmd/auditcheck --sink file://./audit.log   # chain verifies, no gaps\ngo run ./security/audit/cmd/auditcheck --coverage ./platforms/...  # every registered action emits in tests\njq -r '.action' audit.log | sort | uniq -c                         # action names follow noun.verb\n```\n\n## See also\n- urn:skill:meridian:security:classification-labels\n- urn:skill:meridian:shared.auth-sdk:auth-sdk-usage\n- urn:skill:meridian:_root:security-baseline", "raw": "---\nname: audit-logging\ndescription: \"[security/audit] How Meridian services emit tamper-evident audit events: the structured logger in security/audit/src, mandatory fields (actor, action, resource, classification, outcome), what must and must not be recorded, sinks, retention and verification. Use when you add an operation that reads or changes labelled data, wire a new service into the audit pipeline, or change event fields. Do not use for application debug logging or metrics.\"\nlicense: Apache-2.0\ncompatibility: \"Needs the security/audit Go module, the audit sink endpoint (or the file sink for tests) and the classification library.\"\nmetadata:\n  scope: security.audit\n  owner: audit-team\n  requires: \"urn:skill:meridian:security:classification-labels\"\n  references: \"security/audit/src/logger.go\"\n  status: active\n  since: \"2026-09-04\"\n  kind: governance\n  layer: team\n  triggers: \"audit event schema, tamper-evident logging, actor action resource outcome, hash chaining, audit sink retention, security/audit logger\"\n  digest: >-\n    Every access to or change of labelled data in Meridian produces one structured audit event through the\n    shared logger in security/audit, with a fixed schema, hash chaining and an append-only sink. Services never\n    write audit records with their application logger or skip them on error paths.\n---\n\n# Audit logging\n\n## When to use / when NOT to use\nUse when you:\n- add an endpoint, job or pipeline step that reads, writes, exports or deletes labelled data;\n- onboard a new service to the audit sink or change its sink configuration;\n- add or rename a field in the audit event schema;\n- investigate a gap reported by the audit completeness check.\n\nDo not use for debug or application logs (use the platform logger), for metrics and traces, or for\nsecurity incident handling procedures.\n\n## Steps\n1. Construct one logger per process from `security/audit/src`:\n   `al, err := audit.NewLogger(audit.Config{Service: \"atlas-graph\", Sink: sink})`. Never per request.\n2. Emit exactly one event per logical operation, after the outcome is known:\n   `al.Emit(ctx, audit.Event{Action: \"dataset.export\", Resource: urn, Classification: lbl, Outcome: audit.Denied})`.\n   Actor and session come from the auth SDK principal in `ctx`; do not pass them by hand.\n3. Cover the error path: a denied, failed or timed-out operation is still an event with `Outcome` set.\n   A missing event on failure is a CI-blocking bug.\n4. Put context in `Details` as a small flat map (query id, row count, export format). Never include record\n   content, tokens or free-text user input.\n5. Set `Classification` to the label of the data touched, computed with `classification.Propagate` when\n   several inputs are involved; the sink indexes on it.\n6. For batch jobs emit a `batch.start` and `batch.end` pair sharing one `CorrelationID`, with per-item events\n   only for writes.\n7. Run the completeness check in CI: it compares actions registered in the policy registry with actions seen\n   in the test sink and fails on any missing one.\n\n## Conventions specific to this scope\n- The schema is versioned (`schema_version: 3`) and append-only; fields are never removed, only deprecated.\n- Mandatory fields: `time` (RFC 3339, UTC), `service`, `actor`, `session_id`, `action`, `resource`,\n  `classification`, `outcome`, `correlation_id`, `prev_hash`, `hash`.\n- Actions are `\u003cnoun>.\u003cverb>` and must exist in the policy registry; the logger rejects unknown actions.\n- Events are hash-chained per service: `prev_hash` is the previous event's `hash`, so gaps are detectable.\n- The sink is append-only. Retention is seven years for RESTRICTED and above, two years otherwise; rotation\n  is by day or by 512 MiB, whichever comes first.\n- The file sink is for tests and air-gapped buffering only; production uses the streaming sink with\n  at-least-once delivery and a local spool during outages.\n- Events are written synchronously before the response is returned; a sink failure blocks the operation\n  unless the service is marked `audit.BestEffort` with a security-org approved exception.\n- Audit logs are themselves CONFIDENTIAL; reading the sink is a labelled operation and is audited.\n\n## Verify\n```bash\ngo test ./security/audit/...                                       # schema, chaining, sink behaviour\ngo run ./security/audit/cmd/auditcheck --sink file://./audit.log   # chain verifies, no gaps\ngo run ./security/audit/cmd/auditcheck --coverage ./platforms/...  # every registered action emits in tests\njq -r '.action' audit.log | sort | uniq -c                         # action names follow noun.verb\n```\n\n## See also\n- urn:skill:meridian:security:classification-labels\n- urn:skill:meridian:shared.auth-sdk:auth-sdk-usage\n- urn:skill:meridian:_root:security-baseline\n", "path": "security/audit/.agents/skills/audit-logging/SKILL.md", "revision": "b4fc7a2e986e6dfb4cc4b8e5f37031b53d3037afb5116bcb3e4be46e00092bd2", "bytes": 4772, "requires": ["urn:skill:meridian:security:classification-labels"], "refines": [], "references": ["security/audit/src/logger.go"]}]}</script><script>'use strict';
const F = JSON.parse(document.getElementById('fixture').textContent);

const member = P.get('role') === 'member';

const e = value => String(value ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function go(view, changes={}){location.href=url(view,changes);}
function link(view, text, changes={}, cls=''){return `<a ${cls?`class="${cls}"`:''} href="${e(url(view,changes))}">${e(text)}</a>`;}
const disabled = readonly ? 'disabled' : '';
const byId = id => F.skills.find(s=>s.id===id || s.name===id);
const proposalSkill = byId('postgres-auth');

const sourceURL = path => 'https://github.com/wiatrM/guidefold/blob/'+F.commit+'/examples/monorepo/'+path.split('#')[0];
function sourceLink(path,label){return `<a href="${e(sourceURL(path))}" target="_blank" rel="noopener noreferrer">${e(label || path)} <span class="tiny">(GitHub, new tab)</span></a>`;}
function refs(s){return `<ul class="linklist">${s.references.map(r=>`<li>${sourceLink(r)}${r.includes('#')?`<p class="help">Source fragment: <code>${e(r.split('#')[1])}</code>; no verified line mapping.</p>`:''}</li>`).join('') || '<li>No references declared in the fixture.</li>'}</ul>`;}
function relationList(s){const origin=VIEW==='map'?'map':(['map','library','proposals','usage'].includes(P.get('from'))?P.get('from'):'library'); const axis=VIEW==='map'?(['repository','scopes','pyramid'].includes(P.get('tab'))?P.get('tab'):'repository'):P.get('return_tab');return ['requires','refines'].map(type=>`<div><h3>${type}</h3><ul class="linklist">${s[type].map(id=>`<li>${byId(id)?link('skill',byId(id).name,{skill:id,tab:'source',from:origin,return_tab:axis}):e(id)}<br><small>${e(id)}</small></li>`).join('') || '<li>None declared in source.</li>'}</ul></div>`).join('');}
function metadata(s){const node=F.nodes.find(n=>n.id===s.scope);return `<dl><dt>Repository</dt><dd>${e(F.repo)}</dd><dt>Scope</dt><dd>${e(s.scope)}</dd><dt>Scope paths</dt><dd>${e(node?.paths.join(', ') || 'Unknown')}</dd><dt>Owner from source</dt><dd>${e(s.owner)} (ownership metadata; not an access grant)</dd><dt>Source layer</dt><dd>${e(s.sourceLayer)}</dd><dt>Knowledge layer</dt><dd>Unclassified</dd><dt>Source status</dt><dd>${e(s.sourceStatus)}</dd><dt>Publication</dt><dd>Not established by source status</dd><dt>Source path</dt><dd><code>${e(s.path)}</code></dd><dt>Base commit</dt><dd><code>${e(F.commit)}</code></dd><dt>Content SHA-256</dt><dd><code>${e(s.revision)}</code><br><small>Digest of the exact SKILL.md bytes, including frontmatter.</small></dd></dl>`;}
function tabs(items,current){return `<nav class="tabs" aria-label="${e(views[VIEW])} sections">${items.map(([id,text])=>`<a href="${e(url(VIEW,{tab:id}))}"${current===id?' aria-current="page"':''}>${e(text)}</a>`).join('')}</nav>`;}
function panel(title,content){return `<section class="panel"><h2>${title}</h2>${content}</section>`;}
function note(text){return `<div class="notice" role="status">${text}</div>`;}
function header(){return `<header><div class="brand"><strong>Guidefold <span class="tiny">/ LOW-FI</span></strong><span class="badge">Meridian fixture · Local simulation · No repository writes</span></div></header><div class="shell"><nav class="mainnav" aria-label="Primary">${Object.entries(views).map(([id,label])=>`<a href="${e(url(id))}"${VIEW===id?' aria-current="page"':''}>${label}</a>`).join('')}</nav><main id="main" tabindex="-1"><p class="eyebrow">Stage 4 · interaction wireframe</p><h1>${views[VIEW]}</h1>`;}
function partialManifest(){
 const delivered=new Set(dataSkills.map(s=>s.id));
 const omitted=F.skills.filter(s=>!delivered.has(s.id));
 return `<section class="panel"><h2>Partial QA delivery manifest</h2><p>Identical subset across Import, Library and Map: ${dataSkills.length}/${F.skills.length} skills. All paths below come from the fixture; omission is simulated.</p><details><summary>Delivered source paths (${dataSkills.length})</summary><ul class="linklist">${dataSkills.map(s=>`<li><code>${e(s.path)}</code></li>`).join('')}</ul></details><details><summary>Omitted source paths (${omitted.length})</summary><ul class="linklist">${omitted.map(s=>`<li><code>${e(s.path)}</code></li>`).join('')}</ul></details></section>`;
}
