dr: numbering, template sections, status lifecycle and who must approve. Use when a change affects more than one platform, introduces a new datastore, protocol or external dependency, or when a reviewer asks for an ADR. Do not use for routine refactors, bug fixes or per-team runbooks.", "body": "# ADR process\n\n## When to use / when NOT to use\nWrite an ADR when a change:\n- crosses a platform boundary (forge, atlas, relay, security, libs) or changes a shared interface;\n- introduces or removes a datastore, message broker, serialization format or external dependency;\n- changes how software is built, released or deployed (Bazel rules, bundle format, Helm layout);\n- would be expensive to reverse in six months, or a reviewer explicitly asks for one.\n\nSkip the ADR for bug fixes, refactors that keep interfaces stable, team-local tooling and operational\nrunbooks (those belong in the owning node's skills).\n\n## Steps\n1. Copy the template block from `docs/adr/README.md` into `docs/adr/NNNN-short-kebab-title.md`, where\n   `NNNN` is the next free number listed in the index. Numbers are never reused.\n2. Fill the sections in order: Context, Decision, Alternatives considered, Consequences, Status. Keep\n   Context factual; put opinions in Decision.\n3. Set `Status: proposed` and add the row to the index table in `docs/adr/README.md`, bumping the\n   \"next free number\" line.\n4. Open the PR with the ADR and, where possible, the first implementation slice together. Title it\n   `adr: NNNN \u003ctitle>`.\n5. Request review from the owners of every node the decision touches, plus `@meridian/platform-engineering`\n   for anything under `libs/` or the build system.\n6. On approval flip the status to `accepted` in the same PR. Approval means two owner approvals and no\n   unresolved blocking comment after five working days.\n7. To change an accepted decision, write a new ADR that says `Supersedes: NNNN` and mark the old one\n   `superseded by NNNN`. Never edit the body of an accepted ADR beyond the status line.\n\n## Conventions specific to this scope\n- One decision per file; if a proposal contains two independent choices, split it.\n- File name and H1 must match: `0005-h3-as-geo-index.md` starts with `# 0005: H3 as geo index`.\n- Alternatives considered lists at least two options with a sentence on why each lost.\n- Consequences include the migration plan and the rollback path, not only the benefits.\n- Link code with paths relative to the repo root (`platforms/atlas/geo/src/index/h3_index.go`), never\n  absolute paths or branch URLs.\n- Diagrams are Mermaid fenced blocks inside the ADR; no binary images in `docs/adr/`.\n- Deprecated ADRs keep their number and file; the index marks them so search still finds the history.\n- Air-gap note: every ADR that adds an external dependency states how it is mirrored into the offline\n  release bundle.\n\n## Verify\n```bash\nls docs/adr | sort | tail -3                                   # next number is unused\ngrep -n \"^| 00\" docs/adr/README.md | tail -3                    # index row added\ngrep -En \"^Status: (proposed|accepted|deprecated|superseded by [0-9]{4})$\" docs/adr/[0-9]*.md\nhead -1 docs/adr/NNNN-*.md                                     # H1 matches the file name\n```\nReviewers also check that the ADR names every touched node owner and that the PR description links it.\n\n## See also\n- urn:skill:meridian:_root:monorepo-conventions\n- urn:skill:meridian:forge.ontology:object-type-migrations", "raw": "---\nname: adr-process\ndescription: \"[meridian] How Meridian records architecture decisions as ADRs under docs/adr: numbering, template sections, status lifecycle and who must approve. Use when a change affects more than one platform, introduces a new datastore, protocol or external dependency, or when a reviewer asks for an ADR. Do not use for routine refactors, bug fixes or per-team runbooks.\"\nlicense: Apache-2.0\ncompatibility: \"Only needs a text editor and a pull request; n ing, widening, or dropping properties and links \n- `urn:skill:meridian:forge.ontology:ontology-modeling` — [forge/ontology] How to define object types, properties, and link types in the Forge ontology backed by Postgres. Use wh\n\n## forge.pipelines  (owner: pipelines-team)  paths: platforms/forge/pipelines/**\n- `urn:skill:meridian:forge.pipelines:pipeline-testing` — [forge/pipelines] Unit and golden-file testing of PySpark batch pipelines with pytest, a local SparkSession, and shared \n- `urn:skill:meridian:forge.pipelines:spark-pipeline-conventions` — [forge/pipelines] Structure, naming, and lifecycle hooks for PySpark batch pipelines in the meridian_pipelines package. \n\n## forge.pipelines.streaming  (owner: streaming-team)  paths: platforms/forge/pipelines/streaming/**\n- `urn:skill:meridian:forge.pipelines.streaming:kafka-ingestion` — [forge/pipelines/streaming] Building Kafka ingestion jobs with Spark Structured Streaming: topic declaration, consumer g\n\n## atlas  (owner: atlas-platform)  paths: platforms/atlas/**\n- `urn:skill:meridian:atlas:atlas-api-conventions` — [atlas] HTTP API design rules for every atlas service: URL layout, the shared error envelope, cursor pagination, version\n\n## atlas.geo  (owner: geo-team)  paths: platforms/atlas/geo/**\n- `urn:skill:meridian:atlas.geo:geospatial-indexing` — [atlas/geo] Indexing conventions for geospatial layers in atlas: PostGIS geometry columns, companion H3 cell columns, Gi\n- `urn:skill:meridian:atlas.geo:map-tile-serving` — [atlas/geo] Serving atlas geo layers as Mapbox vector tiles: per-layer zoom ranges, simplification, generalisation by H3\n\n## atlas.graph  (owner: graph-team)  paths: platforms/atlas/graph/**\n- `urn:skill:meridian:atlas.graph:link-analysis-api` — [atlas/graph] Design and implementation rules for the atlas graph endpoints (/v1/graph/neighbors, /v1/graph/paths): requ\n\n## atlas.identity  (owner: identity-platform)  paths: platforms/atlas/identity/**\n- `urn:skill:meridian:atlas.identity:legacy-session-auth` — [atlas/identity] DEPRECATED. Cookie-based session authorization evaluated inside each atlas service, superseded by turns\n- `urn:skill:meridian:atlas.identity:rbac-policies` — [atlas/identity] Authoring and testing the atlas RBAC policy bundle in OPA Rego: the analyst/supervisor/admin role model\n\n## atlas.identity.turnstile  (owner: turnstile-team)  paths: platforms/atlas/identity/turnstile/**\n- `urn:skill:meridian:atlas.identity.turnstile:postgres-auth` — [atlas/identity/turnstile] Add or change authorization checks in the turnstile service: bearer-token validation, princip\n- `urn:skill:meridian:atlas.identity.turnstile:turnstile-oncall-runbook` — [atlas/identity/turnstile] On-call runbook for the turnstile authorization service: what each TurnstileAuth* alert means\n\n## relay  (owner: relay-infra)  paths: infra/relay/**\n- `urn:skill:meridian:relay:terraform-conventions` — [relay] Terraform layout, module usage, remote state, and review rules for Meridian infrastructure under infra/relay. Us\n\n## relay.edge  (owner: edge-team)  paths: infra/relay/edge/**\n- `urn:skill:meridian:relay.edge:air-gapped-deploy` — [relay/edge] Assembling and installing the Meridian offline bundle for air-gapped edge sites: image mirroring by digest,\n\n## relay.k8s  (owner: k8s-team)  paths: infra/relay/k8s/**\n- `urn:skill:meridian:relay.k8s:helm-conventions` — [relay/k8s] Authoring and releasing Helm charts for Meridian services under infra/relay/k8s/charts: chart layout, values\n\n## security  (owner: security-org)  paths: security/**\n- `urn:skill:meridian:security:classification-labels` — [security] Data-classification labels in Meridian: the Label enum in libs/classification (UNCLASSIFIED, OFFICIAL, RESTRI\n\n## security.audit  (owner: audit-team)  paths: security/audit/**\n- `urn:skill:meridian:security.audit:audit-logging` — [security/audit] How Meridian services emit tamper-evident audit events: the structured logger in security/audit/src, ma\n\n## shared  (owner: shared-libs)  paths: libs/**\n- `urn:skill:meridian:shared:shared-lib-versioning` — [shared] Semantic versioning, tagging and compatibility rules for the shared libraries under libs (db, classification, a\n\n## shared.auth-sdk  (owner: identity-platform)  paths: libs/auth-sdk/**\n- `urn:skill:meridian:shared.auth-sdk:auth-sdk-usage` — [shared/auth-sdk] How services consume the Meridian auth SDK (Go and Python) to authenticate callers and enforce RBAC de\n", "path": ".agents/skills/hierarchy-index/SKILL.md", "revision": "0b491e7bc670958cf135a0978a656c461680b52ae6a23322345d63b411ff6da8", "bytes": 6112, "requires": [], "refines": [], "references": []}, {"id": "urn:skill:meridian:_root:monorepo-conventions", "name": "monorepo-conventions", "scope": "_root", "owner": "platform-engineering", "sourceLayer": "org", "knowledgeLayer": "Unclassified", "sourceStatus": "active", "description": "[meridian] Layout, ownership and build conventions for the Meridian monorepo: directory structure per platform, Bazel targets and visibility, CODEOWNERS alignment with guidefold.yaml, trunk-based branching and PR rules. Use when adding a new package, service or node, moving code between platforms, or editing WORKSPACE, BUILD files or CODEOWNERS. Do not use for release tagging, ADR authoring or platform-specific coding style, which have their own skills.", "body": "# Monorepo conventions\n\n## When to use / when NOT to use\nUse this skill when you:\n- create a new package, service or library anywhere under `platforms/`, `infra/`, `libs/` or `security/`;\n- add or rename a node in `guidefold.yaml` (this always needs a matching `.github/CODEOWNERS` line);\n- change `WORKSPACE`, `.bazelrc` or a `BUILD.bazel` visibility rule;\n- move code between platforms or promote a helper into `libs/`.\n\nDo NOT use it for cutting releases (`release-process`), recording design decisions (`adr-process`) or\nlanguage style inside a platform; those live in the platform's own skills.\n\n## Steps\n1. Pick the owning node. Every directory sits under exactly one `guidefold.yaml` node; the most specific\n   path glob wins. If no node fits, propose one in the same PR and get the parent node owner's review.\n2. Create the directory with a `BUILD.bazel` next to the code. Targets are named after the directory\n   (`//libs/db:db`, `//platforms/atlas/geo/tiles:tiles`). Never `glob([\"**\"])` across package boundaries.\n3. Set `visibility` explicitly. Default is `//visibility:private`; export to the platform with\n   `//platforms/forge:__subpackages__`, and to everyone only from `libs/`.\n4. Add the CODEOWNERS line. Format is `\u003cpath>/  @meridian/\u003cowner>` (two spaces); the owner must equal the\n   node `owner` (or a listed subteam) in `guidefold.yaml`.\n5. Register external dependencies in `WORKSPACE` (or `MODULE.bazel` once the bzlmod migration lands) with\n   a pinned version and sha256. No `latest`, no floating branches.\n6. Open a PR from a short-lived branch named `\u003cteam>/\u003ctopic>` (under three days old). Squash-merge to\n   `main`; rebase rather than merge-commit when refreshing.\n7. Run `bazel test` for the affected platform before requesting review; CI runs the full graph.\n\n## Conventions specific to this scope\n- Directory layout: `platforms/\u003cplatform>/\u003ccomponent>/{src,tests,deploy,config}`; `infra/relay/\u003carea>`;\n  `libs/\u003clib>`; `security/\u003carea>`. Tooling that is not shipped lives in `tools/`.\n- Go: one `go.mod` at the repo root; import path prefix `meridian.example/`.\n- Python: one `requirements.lock` per platform resolved with `pip-compile`; packages are named\n  `meridian_\u003cplatform>_\u003ccomponent>`.\n- Generated files (`AGENTS.md`, `CLAUDE.md`, `.github/instructions/*.instructions.md`) are committed but\n  never hand-edited; regenerate with `guidefold materialize`.\n- Cross-platform imports go through `libs/` only. `platforms/atlas` must not import `platforms/forge`.\n- Commit messages: `\u003cnode>: \u003cimperative summary>` (`atlas.geo: add H3 index sharding`); the body says why.\n- Feature flags over long-lived branches. Anything behind a flag defaults off and has an owner and a\n  removal date.\n\n## Verify\n```bash\nbazel build //...                                   # whole graph builds\nbazel test //platforms/forge/...                    # scoped tests for the platform you touched\nguidefold validate                                  # every skill dir maps to one node; owners match CODEOWNERS\nfor p in $(grep -o '\"[a-z/]*/\\*\\*\"' guidefold.yaml | tr -d '\"*'); do \\\n  grep -q \"^/$p\" .github/CODEOWNERS || echo \"missing CODEOWNERS line for $p\"; done\ngit log --oneline -5                                # commit prefixes match node names\n```\n\n## See also\n- urn:skill:meridian:_root:adr-process\n- urn:skill:meridian:_root:release-process\n- urn:skill:meridian:shared:shared-lib-versioning", "raw": "---\nname: monorepo-conventions\ndescription: \"[meridian] Layout, ownership and build conventions for the Meridian monorepo: directory structure per platform, Bazel targets and visibility, CODEOWNERS alignment with guidefold.yaml, trunk-based branching and PR rules. Use when adding a new package, service or node, moving code between platforms, or editing WORKSPACE, BUILD files or CODEOWNERS. Do not use for release tagging, ADR authoring or platform-specific coding style, which have their own skills.\"\nlicense: Apache-2.0\ncompatibility: \"Needs a Bazel 7+ toolchain (bazelisk) and read access to guidefold.yaml and .github/CODEOWNERS.\"\nmetadata:\n  scope: _root\n  owner: platform-engineering\n  references: \"WORKSPACE, .github/CODEOWNERS\"\n  status: active\n  since: \"2026-09-04\"\n  kind: engineering\n  layer: org\n  triggers: \"new package or service, BUILD.bazel target, CODEOWNERS line, guidefold.yaml node, Bazel visibility, WORKSPACE dependency\"\n  negative_triggers: \"release tagging, ADR authoring\"\n  digest: >-\n    Meridian is a single Bazel monorepo split into platforms (forge, atlas), infra (relay), security and\n    shared libs, each owned by a team listed in guidefold.yaml and mirrored in CODEOWNERS. Code lands on\n    main through short-lived branches, and every directory belongs to exactly one owning node.\n---\n\n# Monorepo conventions\n\n## When to use / when NOT to use\nUse this skill when you:\n- create a new package, service or library anywhere under `platforms/`, `infra/`, `libs/` or `security/`;\n- add or rename a node in `guidefold.yaml` (this always needs a matching `.github/CODEOWNERS` line);\n- change `WORKSPACE`, `.bazelrc` or a `BUILD.bazel` visibility rule;\n- move code between platforms or promote a helper into `libs/`.\n\nDo NOT use it for cutting releases (`release-process`), recording design decisions (`adr-process`) or\nlanguage style inside a platform; those live in the platform's own skills.\n\n## Steps\n1. Pick the owning node. Every directory sits under exactly one `guidefold.yaml` node; the most specific\n   path glob wins. If no node fits, propose one in the same PR and get the parent node owner's review.\n2. Create the directory with a `BUILD.bazel` next to the code. Targets are named after the directory\n   (`//libs/db:db`, `//platforms/atlas/geo/tiles:tiles`). Never `glob([\"**\"])` across package boundaries.\n3. Set `visibility` explicitly. Default is `//visibility:private`; export to the platform with\n   `//platforms/forge:__subpackages__`, and to everyone only from `libs/`.\n4. Add the CODEOWNERS line. Format is `\u003cpath>/  @meridian/\u003cowner>` (two spaces); the owner must equal the\n   node `owner` (or a listed subteam) in `guidefold.yaml`.\n5. Register external dependencies in `WORKSPACE` (or `MODULE.bazel` once the bzlmod migration lands) with\n   a pinned version and sha256. No `latest`, no floating branches.\n6. Open a PR from a short-lived branch named `\u003cteam>/\u003ctopic>` (under three days old). Squash-merge to\n   `main`; rebase rather than merge-commit when refreshing.\n7. Run `bazel test` for the affected platform before requesting review; CI runs the full graph.\n\n## Conventions specific to this scope\n- Directory layout: `platforms/\u003cplatform>/\u003ccomponent>/{src,tests,deploy,config}`; `infra/relay/\u003carea>`;\n  `libs/\u003clib>`; `security/\u003carea>`. Tooling that is not shipped lives in `tools/`.\n- Go: one `go.mod` at the repo root; import path prefix `meridian.example/`.\n- Python: one `requirements.lock` per platform resolved with `pip-compile`; packages are named\n  `meridian_\u003cplatform>_\u003ccomponent>`.\n- Generated files (`AGENTS.md`, `CLAUDE.md`, `.github/instructions/*.instructions.md`) are committed but\n  never hand-edited; regenerate with `guidefold materialize`.\n- Cross-platform imports go through `libs/` only. `platforms/atlas` must not import `platforms/forge`.\n- Commit messages: `\u003cnode>: \u003cimperative summary>` (`atlas.geo: add H3 index sharding`); the body says why.\n- Feature flags over long-lived branches. Anything behind a flag defaults off and has an owner and a\n  removal date.\n\n## Verify\n```bash\nbazel build //...                                   # whole graph builds\nbazel test //platforms/forge/...                    # scoped tests for the platform you touched\nguidefold validate                                  # every skill dir maps to one node; owners match CODEOWNERS\nfor p in $(grep -o '\"[a-z/]*/\\*\\*\"' guidefold.yaml | tr -d '\"*'); do \\\n  grep -q \"^/$p\" .github/CODEOWNERS || echo \"missing CODEOWNERS line for $p\"; done\ngit log --oneline -5                                # commit prefixes match node names\n```\n\n## See also\n- urn:skill:meridian:_root:adr-process\n- urn:skill:meridian:_root:release-process\n- urn:skill:meridian:shared:shared-lib-versioning\n", "path": ".agents/skills/monorepo-conventions/SKILL.md", "revision": "5a8ec84b3508a6c94180bd744b6c21daebb6d7db1d4204d0eac84d450fe0983c", "bytes": 4731, "requires": [], "refines": [], "references": ["WORKSPACE", ".github/CODEOWNERS"]}, {"id": "urn:skill:meridian:_root:postgres-production", "name": "postgres-production", "scope": "_root", "owner": "platform-engineering", "sourceLayer": "org", "knowledgeLayer": "Unclassified", "sourceStatus": "active", "description": "[meridian] Production Postgres conventions shared by every Meridian service: schema migrations with golang-migrate, connection pooling through libs/db and pgxpool, index, locking and timeout rules, and backup or restore expectations. Use when you add or change a migration, tune pool settings such as maxConns, write a hot-path query or bring up a new Postgres-backed service. Do not use for analytical Spark datasets, the Kafka layer or throwaway local dev databases.", "body": "# Postgres in production\n\n## When to use / when NOT to use\nUse when you:\n- add, edit or squash a migration under any `**/migrations/` directory;\n- change `libs/db/pool.go` or a service's pool settings (`maxConns`, `MinConns`, lifetimes);\n- write a query that runs on a request path or in a scheduled job;\n- create a new Postgres-backed service or database.\n\nDo not use for Spark or Parquet datasets in forge, for Kafka topic configuration, or for throwaway\ndatabases in `docker-compose.dev.yaml`; those have their own conventions.\n\n## Steps\n1. Create the migration pair: `migrate create -ext sql -dir \u003cservice>/migrations -seq \u003cshort_name>`.\n   This yields `000012_add_object_type_index.up.sql` and the matching `.down.sql`.\n2. Write the `up` file so it is safe on a live database: `SET lock_timeout = '5s';` at the top,\n   `CREATE INDEX CONCURRENTLY`, `ADD COLUMN` without a volatile default.\n3. Write the `down` file even when it is a no-op comment; CI refuses migrations without one.\n4. Open the pool with `db.NewPool(ctx, cfg)` from `libs/db`. Do not construct `pgxpool.Config` by hand;\n   lower `MaxConns` only through the service config file and justify it in the PR. Raising it above the\n   `maxConns` ceiling needs platform-engineering review.\n5. In CI run `migrate -path \u003cdir> -database \"$DATABASE_URL\" up`, then `down 1`, then `up` again against a\n   fresh container to prove reversibility.\n6. For hot queries paste an `EXPLAIN (ANALYZE, BUFFERS)` excerpt into the PR description.\n7. If the change touches a table over 10 million rows, announce it in the release notes and use the\n   two-phase pattern: add nullable column, backfill in batches, add constraint `NOT VALID`, validate.\n\n## Conventions specific to this scope\n- Migrations are sequential, six-digit, forward-only. Never edit a merged migration; add a new one.\n- One schema per service, named after the node (`atlas_identity`, `forge_ontology`). Cross-service access\n  goes through APIs, never foreign keys across schemas.\n- `maxConns` defaults to 20 per replica and must stay below `max_connections / replicas - 10`. The constant\n  lives in `libs/db/pool.go`; services read it, they do not redefine it.\n- `statement_timeout` is 30s for request paths and 15m for jobs, set per role, not per query.\n- Primary keys are `bigint generated always as identity` or UUIDv7; no natural composite keys.\n- Every table has `created_at` and `updated_at` (`timestamptz`); a trigger keeps `updated_at` current.\n- Indexes are named `\u003ctable>_\u003ccols>_idx`, unique ones `\u003ctable>_\u003ccols>_key`; partial indexes need a comment.\n- Backups: WAL archiving plus nightly base backups; restore drills are part of the quarterly release check.\n- Secrets come from the platform secret store; `DATABASE_URL` is never committed, not even for tests.\n\n## Verify\n```bash\nmigrate -path libs/db/migrations -database \"$DATABASE_URL\" version   # database is at the expected version\ngo test ./libs/db/...                                              # pool config and helpers\n! grep -rn \"pgxpool.New(\" --include=*.go platforms/                # no direct pool construction\npsql \"$DATABASE_URL\" -c \"select count(*) from pg_stat_activity\"      # stays under maxConns * replicas\n```\n\n## See also\n- urn:skill:meridian:forge.ontology:object-type-migrations\n- urn:skill:meridian:atlas.geo:geospatial-indexing", "raw": "---\nname: postgres-production\ndescription: \"[meridian] Production Postgres conventions shared by every Meridian service: schema migrations with golang-migrate, connection pooling through libs/db and pgxpool, index, locking and timeout rules, and backup or restore expectations. Use when you add or change a migration, tune pool settings such as maxConns, write a hot-path query or bring up a new Postgres-backed service. Do not use for analytical Spark datasets, the Kafka layer or throwaway local dev databases.\"\nlicense: Apache-2.0\ncompatibility: \"Needs the migrate CLI (golang-migrate), psql 15+ and a Go toolchain for libs/db.\"\nmetadata:\n  scope: _root\n  owner: platform-engineering\n  references: \"libs/db/migrations/README.md, libs/db/pool.go#maxConns\"\n  status: active\n  since: \"2026-09-04\"\n  kind: engineering\n  layer: org\n  triggers: \"Postgres migration, golang-migrate, maxConns pool size, pgxpool, lock_timeout, hot-path query\"\n  negative_triggers: \"Spark dataset, Kafka topic, local dev database\"\n  digest: >-\n    Every Meridian service that owns a Postgres database uses libs/db for pooling and golang-migrate for\n    forward-only, numbered SQL migrations. Pool sizes, lock timeouts and index rules are fixed here so that\n    ontology, geo and identity services behave the same under load and during upgrades.\n---\n\n# Postgres in production\n\n## When to use / when NOT to use\nUse when you:\n- add, edit or squash a migration under any `**/migrations/` directory;\n- change `libs/db/pool.go` or a service's pool settings (`maxConns`, `MinConns`, lifetimes);\n- write a query that runs on a request path or in a scheduled job;\n- create a new Postgres-backed service or database.\n\nDo not use for Spark or Parquet datasets in forge, for Kafka topic configuration, or for throwaway\ndatabases in `docker-compose.dev.yaml`; those have their own conventions.\n\n## Steps\n1. Create the migration pair: `migrate create -ext sql -dir \u003cservice>/migrations -seq \u003cshort_name>`.\n   This yields `000012_add_object_type_index.up.sql` and the matching `.down.sql`.\n2. Write the `up` file so it is safe on a live database: `SET lock_timeout = '5s';` at the top,\n   `CREATE INDEX CONCURRENTLY`, `ADD COLUMN` without a volatile default.\n3. Write the `down` file even when it is a no-op comment; CI refuses migrations without one.\n4. Open the pool with `db.NewPool(ctx, cfg)` from `libs/db`. Do not construct `pgxpool.Config` by hand;\n   lower `MaxConns` only through the service config file and justify it in the PR. Raising it above the\n   `maxConns` ceiling needs platform-engineering review.\n5. In CI run `migrate -path \u003cdir> -database \"$DATABASE_URL\" up`, then `down 1`, then `up` again against a\n   fresh container to prove reversibility.\n6. For hot queries paste an `EXPLAIN (ANALYZE, BUFFERS)` excerpt into the PR description.\n7. If the change touches a table over 10 million rows, announce it in the release notes and use the\n   two-phase pattern: add nullable column, backfill in batches, add constraint `NOT VALID`, validate.\n\n## Conventions specific to this scope\n- Migrations are sequential, six-digit, forward-only. Never edit a merged migration; add a new one.\n- One schema per service, named after the node (`atlas_identity`, `forge_ontology`). Cross-service access\n  goes through APIs, never foreign keys across schemas.\n- `maxConns` defaults to 20 per replica and must stay below `max_connections / replicas - 10`. The constant\n  lives in `libs/db/pool.go`; services read it, they do not redefine it.\n- `statement_timeout` is 30s for request paths and 15m for jobs, set per role, not per query.\n- Primary keys are `bigint generated always as identity` or UUIDv7; no natural composite keys.\n- Every table has `created_at` and `updated_at` (`timestamptz`); a trigger keeps `updated_at` current.\n- Indexes are named `\u003ctable>_\u003ccols>_idx`, unique ones `\u003ctable>_\u003ccols>_key`; partial indexes need a comment.\n- Backups: WAL archiving plus nightly base backups; restore drills are part of the quarterly release check.\n- Secrets come from the platform secret store; `DATABASE_URL` is never committed, not even for tests.\n\n## Verify\n```bash\nmigrate -path libs/db/migrations -database \"$DATABASE_URL\" version   # database is at the expected version\ngo test ./libs/db/...                                              # pool config and helpers\n! grep -rn \"pgxpool.New(\" --include=*.go platforms/                # no direct pool construction\npsql \"$DATABASE_URL\" -c \"select count(*) from pg_stat_activity\"      # stays under maxConns * replicas\n```\n\n## See also\n- urn:skill:meridian:forge.ontology:object-type-migrations\n- urn:skill:meridian:atlas.geo:geospatial-indexing\n", "path": ".agents/skills/postgres-production/SKILL.md", "revision": "c56277e2cec69ae0d74d6253b3041b37eb9254c356acdd5936dddb1fd14f39fd", "bytes": 4658, "requires": [], "refines": [], "references": ["libs/db/migrations/README.md", "libs/db/pool.go#maxConns"]}, {"id": "urn:skill:meridian:_root:release-process", "name": "release-process", "scope": "_root", "owner": "platform-engineering", "sourceLayer": "org", "knowledgeLayer": "Unclassified", "sourceStatus": "active", "description": "[meridian] How Meridian versions, tags, builds and publishes releases: monthly release trains tagged vYYYY.MM.N, hotfix branches, the offline release bundle produced by tools/release/build-bundle.sh, changelog rules and rollback. Use when you cut a release, hotfix a shipped version, change what goes into the bundle or edit the release workflow. Do not use for shared-library version bumps or for applying a bundle on an edge site; those have their own skills.", "body": "# Release process\n\n## When to use / when NOT to use\nUse when you:\n- cut the monthly release train or a hotfix from a `release/vYYYY.MM` branch;\n- change what `tools/release/build-bundle.sh` packs, or how it signs and checksums;\n- edit `.github/workflows/release.yaml` or the release PR template;\n- write or review `CHANGELOG.md` entries.\n\nDo not use for bumping a shared library (`shared:shared-lib-versioning`), for installing a bundle on an\nedge site (`relay.edge:air-gapped-deploy`) or for Helm chart layout (`relay.k8s:helm-conventions`).\n\n## Steps\n1. Freeze: on the first working day of the month branch `release/vYYYY.MM` from `main` and announce it.\n   Only fixes labelled `release-blocker` merge into the branch afterwards.\n2. Confirm every component's `CHANGELOG.md` has an `## Unreleased` section with user-facing entries. Move\n   them under `## vYYYY.MM.0` in the release PR.\n3. Run the migration dry-run and the upgrade test from the previous release:\n   `bazel test //tools/release:upgrade_from_previous`.\n4. Build the bundle: `tools/release/build-bundle.sh vYYYY.MM.0`. It writes `dist/meridian-vYYYY.MM.0.tar.gz`\n   containing `SHA256SUMS` and a signed `manifest.yaml`.\n5. Verify offline: `tools/release/build-bundle.sh --verify dist/meridian-vYYYY.MM.0.tar.gz` must pass on a\n   machine with no registry access.\n6. Tag: `git tag -s vYYYY.MM.0 -m \"Meridian vYYYY.MM.0\"` on the release branch and push the tag; the release\n   workflow publishes images, charts and the bundle to the release store.\n7. Hotfix: cherry-pick onto `release/vYYYY.MM`, bump the patch number (`vYYYY.MM.1`) and repeat steps 4 to 6.\n   Never hotfix from `main` directly.\n8. Rollback: the previous bundle stays installable for two trains; release notes list which migrations are\n   irreversible and therefore used the two-phase migration pattern.\n\n## Conventions specific to this scope\n- Tag format is `vYYYY.MM.N` for the platform; shared libs use plain semver and are released independently.\n- The bundle layout is fixed: `images/` (OCI layout), `charts/`, `migrations/\u003cservice>/`, `sbom/`,\n  `manifest.yaml`, `SHA256SUMS`. Adding a top-level directory needs an ADR.\n- Every image in the bundle is referenced by digest and signed; `build-bundle.sh` fails if an image comes\n  from a registry outside the security baseline's `allowedRegistries`.\n- Release notes have three sections: Breaking changes, Operator actions, Fixes. Breaking changes link the\n  ADR that introduced them.\n- The release captain rotates through platform-engineering; the checklist is the release PR template.\n- No releases on the last working day of the week; hotfixes are the exception and need two approvals.\n- Reproducibility: `build-bundle.sh` run twice on the same tag must produce identical `SHA256SUMS`.\n\n## Verify\n```bash\ntools/release/build-bundle.sh --dry-run vYYYY.MM.0     # lists contents without writing\nsha256sum -c dist/SHA256SUMS                            # every artefact matches\ncosign verify-blob --key security/policy/cosign.pub --signature dist/manifest.yaml.sig dist/manifest.yaml\ngit describe --tags --exact-match                       # HEAD is on the release tag\n```\n\n## See also\n- urn:skill:meridian:relay.edge:air-gapped-deploy\n- urn:skill:meridian:relay.k8s:helm-conventions", "raw": "---\nname: release-process\ndescription: \"[meridian] How Meridian versions, tags, builds and publishes releases: monthly release trains tagged vYYYY.MM.N, hotfix branches, the offline release bundle produced by tools/release/build-bundle.sh, changelog rules and rollback. Use when you cut a release, hotfix a shipped version, change what goes into the bundle or edit the release workflow. Do not use for shared-library version bumps or for applying a bundle on an edge site; those have their own skills.\"\nlicense: Apache-2.0\ncompatibility: \"Needs Bazel, helm, syft, cosign, signed-tag rights on main and the release workflow in .github/workflows.\"\nmetadata:\n  scope: _root\n  owner: platform-engineering\n  references: \"tools/release/build-bundle.sh\"\n  status: active\n  since: \"2026-09-04\"\n  kind: ways-of-working\n  layer: org\n  triggers: \"cut a release, release train, vYYYY.MM tag, hotfix branch, offline release bundle, build-bundle.sh\"\n  negative_triggers: \"shared library version bump, edge site install\"\n  digest: >-\n    Meridian ships a monthly release train tagged vYYYY.MM.N from main, plus hotfix tags on release branches.\n    Every release is an offline bundle built by tools/release/build-bundle.sh that contains images, Helm charts,\n    migrations, SBOMs and checksums, so air-gapped sites can install without network access.\n---\n\n# Release process\n\n## When to use / when NOT to use\nUse when you:\n- cut the monthly release train or a hotfix from a `release/vYYYY.MM` branch;\n- change what `tools/release/build-bundle.sh` packs, or how it signs and checksums;\n- edit `.github/workflows/release.yaml` or the release PR template;\n- write or review `CHANGELOG.md` entries.\n\nDo not use for bumping a shared library (`shared:shared-lib-versioning`), for installing a bundle on an\nedge site (`relay.edge:air-gapped-deploy`) or for Helm chart layout (`relay.k8s:helm-conventions`).\n\n## Steps\n1. Freeze: on the first working day of the month branch `release/vYYYY.MM` from `main` and announce it.\n   Only fixes labelled `release-blocker` merge into the branch afterwards.\n2. Confirm every component's `CHANGELOG.md` has an `## Unreleased` section with user-facing entries. Move\n   them under `## vYYYY.MM.0` in the release PR.\n3. Run the migration dry-run and the upgrade test from the previous release:\n   `bazel test //tools/release:upgrade_from_previous`.\n4. Build the bundle: `tools/release/build-bundle.sh vYYYY.MM.0`. It writes `dist/meridian-vYYYY.MM.0.tar.gz`\n   containing `SHA256SUMS` and a signed `manifest.yaml`.\n5. Verify offline: `tools/release/build-bundle.sh --verify dist/meridian-vYYYY.MM.0.tar.gz` must pass on a\n   machine with no registry access.\n6. Tag: `git tag -s vYYYY.MM.0 -m \"Meridian vYYYY.MM.0\"` on the release branch and push the tag; the release\n   workflow publishes images, charts and the bundle to the release store.\n7. Hotfix: cherry-pick onto `release/vYYYY.MM`, bump the patch number (`vYYYY.MM.1`) and repeat steps 4 to 6.\n   Never hotfix from `main` directly.\n8. Rollback: the previous bundle stays installable for two trains; release notes list which migrations are\n   irreversible and therefore used the two-phase migration pattern.\n\n## Conventions specific to this scope\n- Tag format is `vYYYY.MM.N` for the platform; shared libs use plain semver and are released independently.\n- The bundle layout is fixed: `images/` (OCI layout), `charts/`, `migrations/\u003cservice>/`, `sbom/`,\n  `manifest.yaml`, `SHA256SUMS`. Adding a top-level directory needs an ADR.\n- Every image in the bundle is referenced by digest and signed; `build-bundle.sh` fails if an image comes\n  from a registry outside the security baseline's `allowedRegistries`.\n- Release notes have three sections: Breaking changes, Operator actions, Fixes. Breaking changes link the\n  ADR that introduced them.\n- The release captain rotates through platform-engineering; the checklist is the release PR template.\n- No releases on the last working day of the week; hotfixes are the exception and need two approvals.\n- Reproducibility: `build-bundle.sh` run twice on the same tag must produce identical `SHA256SUMS`.\n\n## Verify\n```bash\ntools/release/build-bundle.sh --dry-run vYYYY.MM.0     # lists contents without writing\nsha256sum -c dist/SHA256SUMS                            # every artefact matches\ncosign verify-blob --key security/policy/cosign.pub --signature dist/manifest.yaml.sig dist/manifest.yaml\ngit describe --tags --exact-match                       # HEAD is on the release tag\n```\n\n## See also\n- urn:skill:meridian:relay.edge:air-gapped-deploy\n- urn:skill:meridian:relay.k8s:helm-conventions\n", "path": ".agents/skills/release-process/SKILL.md", "revision": "719d369cd34cd7b23bb860caa465b9800ebca930fffb004aafe540934117c9a0", "bytes": 4605, "requires": [], "refines": [], "references": ["tools/release/build-bundle.sh"]}, {"id": "urn:skill:meridian:_root:security-baseline", "name": "security-baseline", "scope": "_root", "owner": "platform-engineering", "sourceLayer": "org", "knowledgeLayer": "Unclassified", "sourceStatus": "active", "description": "[meridian] The org-wide security baseline every Meridian component must satisfy: allowedRegistries for container images, image signing and SBOMs, dependency pinning, secret handling, TLS defaults and container hardening. Use when you add a container image, a new external dependency, a network listener or a CI workflow, or when a security review asks for the baseline. Do not use for classification-label semantics or audit-event formats, which the security org owns in its own skills.", "body": "# Security baseline\n\n## When to use / when NOT to use\nUse when you:\n- add or update a container image reference in a Dockerfile, Helm chart or bundle manifest;\n- add a new external dependency (Go module, PyPI package, npm package, Bazel `http_archive`);\n- open a new network listener or change TLS settings;\n- add a GitHub Actions workflow or grant a workflow new permissions;\n- answer a security review checklist.\n\nDo not use for how classification labels propagate (`security:classification-labels`) or for the audit\nevent schema (`security.audit:audit-logging`); those extend this baseline but are owned elsewhere.\n\n## Steps\n1. Read `security/policy/baseline.yaml`. It is the source of truth; this skill explains it.\n2. Images: pull only from a registry listed under `allowedRegistries`. Reference by digest\n   (`@sha256:...`) in anything that ships; tags are tolerated only in local compose files.\n3. Sign every image you publish in the release workflow: `cosign sign --key env://COSIGN_KEY \u003cimage>@\u003cdigest>`,\n   then attach an SBOM: `syft \u003cimage> -o spdx-json > sbom.json && cosign attest --predicate sbom.json`.\n4. Dependencies: pin exact versions with a lockfile (`go.sum`, `requirements.lock`, `pnpm-lock.yaml`) and a\n   checksum in `WORKSPACE`. The bump bot opens PRs; humans merge them.\n5. Secrets: read from the mounted secret store path or an injected env var. Never commit them, log them or\n   put them in Helm values. List the key names in the service's `secrets.md` so operators know them.\n6. Network: listeners use TLS 1.2+ with the platform CA; plaintext is allowed only on `localhost` sidecars.\n   Every HTTP service exposes `/healthz` and `/readyz` without auth and everything else behind auth-sdk.\n7. CI: workflows declare `permissions:` explicitly, pin actions by commit SHA and never combine\n   `pull_request_target` with a checkout of the PR head.\n8. If you genuinely cannot meet a rule, file an exception under `security/policy/exceptions/` with an expiry\n   date and get `@meridian/security-org` approval before merging.\n\n## Conventions specific to this scope\n- `baseline.yaml` keys are a stable API: `allowedRegistries`, `imageSigning`, `sbom`, `dependencies`,\n  `secrets`, `tls`, `containers`. Tools parse them; renaming a key needs an ADR.\n- Base images: distroless or the platform-maintained minimal image only; no `latest`, no package-manager\n  installs in production stages.\n- Containers run as non-root with a read-only root filesystem and no added Linux capabilities.\n- Log lines never include tokens, session cookies or full request bodies; use the redaction helpers in\n  `libs/auth-sdk`.\n- Vulnerability gate: critical CVEs block a release; high CVEs need an exception with an owner.\n- Air-gapped installs must remain possible: every allowed registry has a mirror path in the release bundle.\n\n## Verify\n```bash\npython3 -c \"import yaml; print(yaml.safe_load(open('security/policy/baseline.yaml'))['allowedRegistries'])\"\ncosign verify --key security/policy/cosign.pub \u003cimage>@\u003cdigest>\nsyft \u003cimage> -o table | head                                    # SBOM generates cleanly\ngrep -rn \"image:\" infra/ platforms/ | grep -v \"@sha256\"          # any hit is a tag-based reference to fix\n```\n\n## See also\n- urn:skill:meridian:security:classification-labels\n- urn:skill:meridian:relay.edge:air-gapped-deploy", "raw": "---\nname: security-baseline\ndescription: \"[meridian] The org-wide security baseline every Meridian component must satisfy: allowedRegistries for container images, image signing and SBOMs, dependency pinning, secret handling, TLS defaults and container hardening. Use when you add a container image, a new external dependency, a network listener or a CI workflow, or when a security review asks for the baseline. Do not use for classification-label semantics or audit-event formats, which the security org owns in its own skills.\"\nlicense: Apache-2.0\ncompatibility: \"Needs cosign, syft and read access to security/policy/baseline.yaml; CI runs the checks automatically.\"\nmetadata:\n  scope: _root\n  owner: platform-engineering\n  references: \"security/policy/baseline.yaml#allowedRegistries\"\n  status: active\n  since: \"2026-09-04\"\n  kind: governance\n  layer: org\n  triggers: \"allowedRegistries, image signing, SBOM, container hardening, secret handling, TLS defaults\"\n  negative_triggers: \"classification label semantics, audit event format\"\n  digest: >-\n    security/policy/baseline.yaml is the machine-readable minimum for every Meridian service: images only\n    from allowedRegistries, signed and with an SBOM, pinned dependencies, no plaintext secrets, TLS by default.\n    Platform teams may tighten it but never relax it without a security-org approved exception.\n---\n\n# Security baseline\n\n## When to use / when NOT to use\nUse when you:\n- add or update a container image reference in a Dockerfile, Helm chart or bundle manifest;\n- add a new external dependency (Go module, PyPI package, npm package, Bazel `http_archive`);\n- open a new network listener or change TLS settings;\n- add a GitHub Actions workflow or grant a workflow new permissions;\n- answer a security review checklist.\n\nDo not use for how classification labels propagate (`security:classification-labels`) or for the audit\nevent schema (`security.audit:audit-logging`); those extend this baseline but are owned elsewhere.\n\n## Steps\n1. Read `security/policy/baseline.yaml`. It is the source of truth; this skill explains it.\n2. Images: pull only from a registry listed under `allowedRegistries`. Reference by digest\n   (`@sha256:...`) in anything that ships; tags are tolerated only in local compose files.\n3. Sign every image you publish in the release workflow: `cosign sign --key env://COSIGN_KEY \u003cimage>@\u003cdigest>`,\n   then attach an SBOM: `syft \u003cimage> -o spdx-json > sbom.json && cosign attest --predicate sbom.json`.\n4. Dependencies: pin exact versions with a lockfile (`go.sum`, `requirements.lock`, `pnpm-lock.yaml`) and a\n   checksum in `WORKSPACE`. The bump bot opens PRs; humans merge them.\n5. Secrets: read from the mounted secret store path or an injected env var. Never commit them, log them or\n   put them in Helm values. List the key names in the service's `secrets.md` so operators know them.\n6. Network: listeners use TLS 1.2+ with the platform CA; plaintext is allowed only on `localhost` sidecars.\n   Every HTTP service exposes `/healthz` and `/readyz` without auth and everything else behind auth-sdk.\n7. CI: workflows declare `permissions:` explicitly, pin actions by commit SHA and never combine\n   `pull_request_target` with a checkout of the PR head.\n8. If you genuinely cannot meet a rule, file an exception under `security/policy/exceptions/` with an expiry\n   date and get `@meridian/security-org` approval before merging.\n\n## Conventions specific to this scope\n- `baseline.yaml` keys are a stable API: `allowedRegistries`, `imageSigning`, `sbom`, `dependencies`,\n  `secrets`, `tls`, `containers`. Tools parse them; renaming a key needs an ADR.\n- Base images: distroless or the platform-maintained minimal image only; no `latest`, no package-manager\n  installs in production stages.\n- Containers run as non-root with a read-only root filesystem and no added Linux capabilities.\n- Log lines never include tokens, session cookies or full request bodies; use the redaction helpers in\n  `libs/auth-sdk`.\n- Vulnerability gate: critical CVEs block a release; high CVEs need an exception with an owner.\n- Air-gapped installs must remain possible: every allowed registry has a mirror path in the release bundle.\n\n## Verify\n```bash\npython3 -c \"import yaml; print(yaml.safe_load(open('security/policy/baseline.yaml'))['allowedRegistries'])\"\ncosign verify --key security/policy/cosign.pub \u003cimage>@\u003cdigest>\nsyft \u003cimage> -o table | head                                    # SBOM generates cleanly\ngrep -rn \"image:\" infra/ platforms/ | grep -v \"@sha256\"          # any hit is a tag-based reference to fix\n```\n\n## See also\n- urn:skill:meridian:security:classification-labels\n- urn:skill:meridian:relay.edge:air-gapped-deploy\n", "path": ".agents/skills/security-baseline/SKILL.md", "revision": "36affc4ac62cd581c4d8f8e7ad6d10f5184243b42a30fb29d80a64ca81ff051c", "bytes": 4704, "requires": [], "refines": [], "references": ["security/policy/baseline.yaml#allowedRegistries"]}, {"id": "urn:skill:meridian:relay:terraform-conventions", "name": "terraform-conventions", "scope": "relay", "owner": "relay-infra", "sourceLayer": "platform", "knowledgeLayer": "Unclassified", "sourceStatus": "active", "description": "[relay] Terraform layout, module usage, remote state, and review rules for Meridian infrastructure under infra/relay. Use when adding or changing a Terraform module, root stack, provider version, or backend configuration. Do not use for Kubernetes manifests and Helm charts (relay.k8s) or for offline bundle assembly (relay.edge).", "body": "# Terraform conventions for Relay\n\n## When to use / when NOT to use\nUse when you:\n- add or change a module under `infra/relay/terraform/modules/\u003cname>/`,\n- change the root stack in `infra/relay/terraform/main.tf` or an `envs/\u003cenv>.tfvars` file,\n- bump a provider or module version,\n- change backend or remote state configuration.\n\nDo NOT use when:\n- the change is a Helm values file or chart (`relay.k8s:helm-conventions`),\n- you are assembling the offline bundle for an air-gapped site (`relay.edge:air-gapped-deploy`),\n- the resource belongs to another platform's own Terraform; they follow the same rules but own their state.\n\n## Steps\n1. Branch from `main`; run `make tf-init ENV=dev` (wraps `terraform init -backend-config=envs/dev.backend.hcl`).\n2. Put reusable resources in `modules/\u003cname>/{main.tf,variables.tf,outputs.tf,README.md}`.\n   The root `main.tf` only declares providers, locals, and module calls.\n3. Pin versions: `required_version` in `main.tf`, every provider with `~>` to a minor, every remote\n   module `source` with `?ref=v\u003cx.y.z>`; local modules use a relative `./modules/\u003cname>` path.\n4. Run `terraform fmt -recursive` and `tflint --recursive`.\n5. Produce a plan: `make tf-plan ENV=dev` writes `plan.out` and a `plan.txt` summary to attach to the PR.\n6. Open the PR with the `terraform` label; CI re-runs the plan with the read-only role and comments the diff.\n7. After approval, apply happens from CI on merge (`make tf-apply ENV=\u003cenv>`), never from a laptop.\n\n## Conventions specific to this scope\n- One root stack per environment (`dev`, `staging`, `prod`, `edge-template`), selected by\n  `-var-file=envs/\u003cenv>.tfvars`. No `terraform workspace` switching.\n- Remote state: one backend per environment, state locking enabled, `prevent_destroy` on the state store.\n- Resource names come from `local.name_prefix` (`\u003cproject>-\u003cenv>-\u003ccomponent>`); never hardcode the environment.\n- Every resource gets `local.tags` (`owner`, `env`, `component`, `managed-by=terraform`) through provider `default_tags`.\n- Variables have `description` and `type`; no untyped `any`. Sensitive inputs are `sensitive = true` and have no default.\n- Outputs are consumed by other stacks only through `terraform_remote_state` data sources, never by copy-paste.\n- No `provisioner` blocks and no `local-exec`; bootstrap logic belongs in a container image or a Helm hook.\n- `count` for on/off toggles, `for_each` for collections; never index lists that can reorder.\n- Secrets never appear in `.tfvars`; reference secret-manager paths and resolve them at runtime.\n- Module `README.md` is generated with `terraform-docs markdown table` and diffed in CI.\n\n## Verify\n```bash\nterraform fmt -check -recursive infra/relay/terraform\ntflint --recursive --config infra/relay/terraform/.tflint.hcl\nmake tf-plan ENV=dev && grep -E \"Plan: [0-9]+ to add\" plan.txt\nterraform-docs markdown table infra/relay/terraform/modules/\u003cname> | diff - infra/relay/terraform/modules/\u003cname>/README.md\n```\n\n## See also\n- urn:skill:meridian:relay.k8s:helm-conventions\n- urn:skill:meridian:relay.edge:air-gapped-deploy", "raw": "---\nname: terraform-conventions\ndescription: \"[relay] Terraform layout, module usage, remote state, and review rules for Meridian infrastructure under infra/relay. Use when adding or changing a Terraform module, root stack, provider version, or backend configuration. Do not use for Kubernetes manifests and Helm charts (relay.k8s) or for offline bundle assembly (relay.edge).\"\nlicense: Apache-2.0\ncompatibility: \"Needs terraform >= 1.9, tflint, terraform-docs, and read access to the relay state backend; `terraform plan` runs in CI with a read-only role.\"\nmetadata:\n  scope: relay\n  owner: relay-infra\n  references: \"infra/relay/terraform/main.tf\"\n  status: active\n  since: \"2026-09-04\"\n  kind: engineering\n  layer: platform\n  triggers: \"Terraform module, relay infra, remote state, provider version pin, terraform plan, root stack\"\n  negative_triggers: \"Kubernetes manifest, Helm chart, offline bundle assembly\"\n  digest: >-\n    Relay infrastructure is one root stack per environment under infra/relay/terraform, composed only\n    from modules in infra/relay/terraform/modules, with locked remote state per environment. Provider\n    versions are pinned and plans are reviewed as PR artifacts before CI applies on merge.\n---\n# Terraform conventions for Relay\n\n## When to use / when NOT to use\nUse when you:\n- add or change a module under `infra/relay/terraform/modules/\u003cname>/`,\n- change the root stack in `infra/relay/terraform/main.tf` or an `envs/\u003cenv>.tfvars` file,\n- bump a provider or module version,\n- change backend or remote state configuration.\n\nDo NOT use when:\n- the change is a Helm values file or chart (`relay.k8s:helm-conventions`),\n- you are assembling the offline bundle for an air-gapped site (`relay.edge:air-gapped-deploy`),\n- the resource belongs to another platform's own Terraform; they follow the same rules but own their state.\n\n## Steps\n1. Branch from `main`; run `make tf-init ENV=dev` (wraps `terraform init -backend-config=envs/dev.backend.hcl`).\n2. Put reusable resources in `modules/\u003cname>/{main.tf,variables.tf,outputs.tf,README.md}`.\n   The root `main.tf` only declares providers, locals, and module calls.\n3. Pin versions: `required_version` in `main.tf`, every provider with `~>` to a minor, every remote\n   module `source` with `?ref=v\u003cx.y.z>`; local modules use a relative `./modules/\u003cname>` path.\n4. Run `terraform fmt -recursive` and `tflint --recursive`.\n5. Produce a plan: `make tf-plan ENV=dev` writes `plan.out` and a `plan.txt` summary to attach to the PR.\n6. Open the PR with the `terraform` label; CI re-runs the plan with the read-only role and comments the diff.\n7. After approval, apply happens from CI on merge (`make tf-apply ENV=\u003cenv>`), never from a laptop.\n\n## Conventions specific to this scope\n- One root stack per environment (`dev`, `staging`, `prod`, `edge-template`), selected by\n  `-var-file=envs/\u003cenv>.tfvars`. No `terraform workspace` switching.\n- Remote state: one backend per environment, state locking enabled, `prevent_destroy` on the state store.\n- Resource names come from `local.name_prefix` (`\u003cproject>-\u003cenv>-\u003ccomponent>`); never hardcode the environment.\n- Every resource gets `local.tags` (`owner`, `env`, `component`, `managed-by=terraform`) through provider `default_tags`.\n- Variables have `description` and `type`; no untyped `any`. Sensitive inputs are `sensitive = true` and have no default.\n- Outputs are consumed by other stacks only through `terraform_remote_state` data sources, never by copy-paste.\n- No `provisioner` blocks and no `local-exec`; bootstrap logic belongs in a container image or a Helm hook.\n- `count` for on/off toggles, `for_each` for collections; never index lists that can reorder.\n- Secrets never appear in `.tfvars`; reference secret-manager paths and resolve them at runtime.\n- Module `README.md` is generated with `terraform-docs markdown table` and diffed in CI.\n\n## Verify\n```bash\nterraform fmt -check -recursive infra/relay/terraform\ntflint --recursive --config infra/relay/terraform/.tflint.hcl\nmake tf-plan ENV=dev && grep -E \"Plan: [0-9]+ to add\" plan.txt\nterraform-docs markdown table infra/relay/terraform/modules/\u003cname> | diff - infra/relay/terraform/modules/\u003cname>/README.md\n```\n\n## See also\n- urn:skill:meridian:relay.k8s:helm-conventions\n- urn:skill:meridian:relay.edge:air-gapped-deploy\n", "path": "infra/relay/.agents/skills/terraform-conventions/SKILL.md", "revision": "efeff7a9898b2e80db27a6621313d9028c644c5b0543ec55df859668cf5b923e", "bytes": 4310, "requires": [], "refines": [], "references": ["infra/relay/terraform/main.tf"]}, {"id": "urn:skill:meridian:relay.edge:air-gapped-deploy", "name": "air-gapped-deploy", "scope": "relay.edge", "owner": "edge-team", "sourceLayer": "team", "knowledgeLayer": "Unclassified", "sourceStatus": "active", "description": "[relay/edge] Assembling and installing the Meridian offline bundle for air-gapped edge sites: image mirroring by digest, chart vendoring, manifest signing, and the offline install and upgrade sequence. Use when building a release bundle, adding a component to bundle/manifest.yaml, or changing the edge install procedure. Do not use for connected environments or for authoring the Helm charts themselves.", "body": "# Air-gapped deployment\n\n## When to use / when NOT to use\nUse when you:\n- build an offline bundle for a tagged release (`edge-bundle-v\u003cx.y.z>.tar`),\n- add or remove a component, image, or chart in `infra/relay/edge/bundle/manifest.yaml`,\n- change the offline install or upgrade scripts under `infra/relay/edge/install/`,\n- change the `mirrorRegistry` settings used by the on-site registry container.\n\nDo NOT use when:\n- the target has outbound network access; use the standard Helm release flow (`relay.k8s:helm-conventions`),\n- you are changing chart templates or values schemas (that is `relay.k8s`),\n- you are cutting the release itself (`_root:release-process` covers tagging and artifact promotion).\n\n## Steps\n1. Start from a release tag produced per `_root:release-process`; bundles are never built from branches.\n2. Update `bundle/manifest.yaml`: `release`, `components[]` (each with `chart`, `chartVersion`, `images[]`),\n   and `mirrorRegistry` (`host`, `port`, `tlsSecret`, `pullSecret`).\n3. Resolve every image to a digest: `make bundle-resolve` rewrites tags to `@sha256:` and fails on any tag left.\n4. Mirror: `make bundle-mirror` copies images with skopeo into `bundle/registry/` (OCI layout) and pulls charts\n   into `bundle/charts/`.\n5. Sign: `make bundle-sign` runs cosign over each image and the manifest; signatures sit beside the layout.\n6. Pack: `make bundle-pack` produces `dist/edge-bundle-v\u003cx.y.z>.tar` plus `.sha256` and `.sig`.\n7. On site: `install/verify.sh \u003cbundle>` (checksum and signatures), `install/load-registry.sh` (starts the mirror\n   registry from the OCI layout), then `install/apply.sh --site \u003csite>` (helm upgrade --install from vendored charts).\n8. Record the installed version in `install/state/installed.yaml` on site and in the release log.\n\n## Conventions specific to this scope\n- The bundle is self-contained: no `helm repo add`, no `docker pull`, no `curl` during install. CI runs the\n  installer inside a network-less container to prove it.\n- `mirrorRegistry.host` is always the in-cluster service name; charts are pointed at it with\n  `--set global.imageRegistry=\u003chost>:\u003cport>` by `install/apply.sh`, never by editing values files.\n- Images are referenced by digest in the manifest; tags are informational only.\n- Every component maps to exactly one chart release name; images not claimed by a component fail `bundle-resolve`.\n- Upgrades are forward-only and skip at most one minor version; larger jumps go through an intermediate bundle.\n- Bundle size limit is 20 GiB; exceeding it needs edge-team approval and a split-bundle plan.\n- Site-specific values live in `install/sites/\u003csite>.values.yaml` without secrets; secrets travel as a sealed\n  file in the bundle and are decrypted only on site.\n- Rollback means reinstalling the previous bundle from the site's retained copy; sites keep the last two bundles.\n- Only registries in the security baseline `allowedRegistries` list may be sources for `bundle-mirror`.\n\n## Verify\n```bash\nmake bundle-resolve && grep -c \"sha256:\" infra/relay/edge/bundle/manifest.yaml\nmake bundle-verify                                        # cosign verify on every image and the manifest signature\ndocker run --network none -v ./dist:/bundle edge-installer:test install/verify.sh /bundle/edge-bundle-v3.4.0.tar\nhelm template bundle/charts/*.tgz --set global.imageRegistry=\u003chost>:\u003cport> | grep \"image:\" | grep -vc \"@sha256:\"   # expect 0\n```\n\n## See also\n- urn:skill:meridian:_root:release-process\n- urn:skill:meridian:relay.k8s:helm-conventions\n- urn:skill:meridian:relay:terraform-conventions", "raw": "---\nname: air-gapped-deploy\ndescription: \"[relay/edge] Assembling and installing the Meridian offline bundle for air-gapped edge sites: image mirroring by digest, chart vendoring, manifest signing, and the offline install and upgrade sequence. Use when building a release bundle, adding a component to bundle/manifest.yaml, or changing the edge install procedure. Do not use for connected environments or for authoring the Helm charts themselves.\"\nlicense: Apache-2.0\ncompatibility: \"Needs the release toolchain (skopeo, helm, cosign, oras) on a build host with access to the internal registry; the target site has no network and receives the bundle on removable media.\"\nmetadata:\n  scope: relay.edge\n  owner: edge-team\n  requires: \"urn:skill:meridian:_root:release-process, urn:skill:meridian:relay.k8s:helm-conventions\"\n  references: \"infra/relay/edge/bundle/manifest.yaml#mirrorRegistry\"\n  status: active\n  since: \"2026-09-04\"\n  kind: engineering\n  layer: team\n  refines: \"urn:skill:meridian:_root:release-process\"\n  triggers: \"offline bundle, air-gapped install, image mirroring by digest, bundle manifest.yaml, edge site, mirrorRegistry\"\n  digest: >-\n    Edge sites install Meridian from a signed, self-contained bundle described by bundle/manifest.yaml:\n    every image is mirrored by digest into the bundle registry, every chart is vendored, and nothing is\n    fetched at install time. Bundles are built only from release tags and verified with cosign on both ends.\n---\n# Air-gapped deployment\n\n## When to use / when NOT to use\nUse when you:\n- build an offline bundle for a tagged release (`edge-bundle-v\u003cx.y.z>.tar`),\n- add or remove a component, image, or chart in `infra/relay/edge/bundle/manifest.yaml`,\n- change the offline install or upgrade scripts under `infra/relay/edge/install/`,\n- change the `mirrorRegistry` settings used by the on-site registry container.\n\nDo NOT use when:\n- the target has outbound network access; use the standard Helm release flow (`relay.k8s:helm-conventions`),\n- you are changing chart templates or values schemas (that is `relay.k8s`),\n- you are cutting the release itself (`_root:release-process` covers tagging and artifact promotion).\n\n## Steps\n1. Start from a release tag produced per `_root:release-process`; bundles are never built from branches.\n2. Update `bundle/manifest.yaml`: `release`, `components[]` (each with `chart`, `chartVersion`, `images[]`),\n   and `mirrorRegistry` (`host`, `port`, `tlsSecret`, `pullSecret`).\n3. Resolve every image to a digest: `make bundle-resolve` rewrites tags to `@sha256:` and fails on any tag left.\n4. Mirror: `make bundle-mirror` copies images with skopeo into `bundle/registry/` (OCI layout) and pulls charts\n   into `bundle/charts/`.\n5. Sign: `make bundle-sign` runs cosign over each image and the manifest; signatures sit beside the layout.\n6. Pack: `make bundle-pack` produces `dist/edge-bundle-v\u003cx.y.z>.tar` plus `.sha256` and `.sig`.\n7. On site: `install/verify.sh \u003cbundle>` (checksum and signatures), `install/load-registry.sh` (starts the mirror\n   registry from the OCI layout), then `install/apply.sh --site \u003csite>` (helm upgrade --install from vendored charts).\n8. Record the installed version in `install/state/installed.yaml` on site and in the release log.\n\n## Conventions specific to this scope\n- The bundle is self-contained: no `helm repo add`, no `docker pull`, no `curl` during install. CI runs the\n  installer inside a network-less container to prove it.\n- `mirrorRegistry.host` is always the in-cluster service name; charts are pointed at it with\n  `--set global.imageRegistry=\u003chost>:\u003cport>` by `install/apply.sh`, never by editing values files.\n- Images are referenced by digest in the manifest; tags are informational only.\n- Every component maps to exactly one chart release name; images not claimed by a component fail `bundle-resolve`.\n- Upgrades are forward-only and skip at most one minor version; larger jumps go through an intermediate bundle.\n- Bundle size limit is 20 GiB; exceeding it needs edge-team approval and a split-bundle plan.\n- Site-specific values live in `install/sites/\u003csite>.values.yaml` without secrets; secrets travel as a sealed\n  file in the bundle and are decrypted only on site.\n- Rollback means reinstalling the previous bundle from the site's retained copy; sites keep the last two bundles.\n- Only registries in the security baseline `allowedRegistries` list may be sources for `bundle-mirror`.\n\n## Verify\n```bash\nmake bundle-resolve && grep -c \"sha256:\" infra/relay/edge/bundle/manifest.yaml\nmake bundle-verify                                        # cosign verify on every image and the manifest signature\ndocker run --network none -v ./dist:/bundle edge-installer:test install/verify.sh /bundle/edge-bundle-v3.4.0.tar\nhelm template bundle/charts/*.tgz --set global.imageRegistry=\u003chost>:\u003cport> | grep \"image:\" | grep -vc \"@sha256:\"   # expect 0\n```\n\n## See also\n- urn:skill:meridian:_root:release-process\n- urn:skill:meridian:relay.k8s:helm-conventions\n- urn:skill:meridian:relay:terraform-conventions\n", "path": "infra/relay/edge/.agents/skills/air-gapped-deploy/SKILL.md", "revision": "164e57d6e23dfa8dfc3498187b6d6d1b06dc926697aef7aad587df0437e58bc1", "bytes": 5049, "requires": ["urn:skill:meridian:_root:release-process", "urn:skill:meridian:relay.k8s:helm-conventions"], "refines": ["urn:skill:meridian:_root:release-process"], "references": ["infra/relay/edge/bundle/manifest.yaml#mirrorRegistry"]}, {"id": "urn:skill:meridian:relay.k8s:helm-conventions", "name": "helm-conventions", "scope": "relay.k8s", "owner": "k8s-team", "sourceLayer": "team", "knowledgeLayer": "Unclassified", "sourceStatus": "active", "description": "[relay/k8s] Authoring and releasing Helm charts for Meridian services under infra/relay/k8s/charts: chart layout, values schema, digest-pinned images, and release versioning. Use when creating or changing a chart, its values.yaml or values.schema.json, or when publishing a chart version. Do not use for Terraform-managed cloud resources or for building offline bundles.", "body": "# Helm chart conventions\n\n## When to use / when NOT to use\nUse when you:\n- create a chart under `infra/relay/k8s/charts/\u003cservice>/`,\n- change templates, `values.yaml`, or `values.schema.json`,\n- bump `Chart.yaml` `version` or `appVersion` for a release,\n- add or update the dependency on the `meridian-common` library chart.\n\nDo NOT use when:\n- the resource is cloud infrastructure (`relay:terraform-conventions`),\n- you are packaging charts into the offline bundle (`relay.edge:air-gapped-deploy`),\n- you need to change the release tagging flow itself (`_root:release-process`).\n\n## Steps\n1. Scaffold: `make chart-new NAME=\u003cservice>` copies `charts/_template/` with `Chart.yaml`, `values.yaml`,\n   `values.schema.json`, `templates/`, `tests/`, and `README.md`.\n2. Declare `meridian-common` as a dependency in `Chart.yaml` and use its helpers\n   (`meridian.labels`, `meridian.probes`, `meridian.securityContext`) instead of copying boilerplate.\n3. Define every value in `values.yaml` with a comment and mirror it in `values.schema.json` (`additionalProperties: false`).\n4. Reference images as `{{ .Values.global.imageRegistry }}/{{ .Values.image.repository }}@{{ .Values.image.digest }}`.\n5. Write helm-unittest suites in `tests/*_test.yaml` for every template that contains a conditional.\n6. Render and validate: `make chart-lint NAME=\u003cservice>` (helm lint plus kubeconform against the pinned k8s version).\n7. Install into kind: `make chart-install NAME=\u003cservice> ENV=dev`.\n8. For a release, bump `version` (chart) and `appVersion` (image) per `_root:release-process`;\n   CI packages and pushes the chart to the internal OCI registry on tag.\n\n## Conventions specific to this scope\n- Chart name, service name, and release name are identical; namespaces are `meridian-\u003ccomponent>`.\n- `values.yaml` is the complete documented default; environment overlays in `infra/relay/k8s/values/\u003cenv>/\u003cservice>.yaml`\n  may only override keys that already exist.\n- `global.imageRegistry` is required and has no default; installs must pass it, which the offline bundle relies on.\n- Images are by digest; `image.tag` is rejected by the schema.\n- All workloads set resource requests and limits, `securityContext` from the common chart, and readiness and liveness probes.\n- Secrets are never templated from values; charts reference existing `Secret` names through `existingSecret` keys.\n- `helm template` with default values (and a registry set) must render cleanly; it is a CI job.\n- Labels come only from `meridian.labels`; no ad-hoc `app:` labels.\n- `Chart.yaml` `version` bumps: patch for template fixes, minor for new values, major for removed or renamed values.\n- `README.md` matches `helm-docs` output; CI diffs it.\n\n## Verify\n```bash\nhelm dependency update infra/relay/k8s/charts/\u003cservice>\nhelm lint infra/relay/k8s/charts/\u003cservice> --strict\nhelm template infra/relay/k8s/charts/\u003cservice> --set global.imageRegistry=\u003cregistry> | kubeconform -strict -kubernetes-version 1.30.0\nhelm unittest infra/relay/k8s/charts/\u003cservice>\nhelm-docs --chart-search-root infra/relay/k8s/charts/\u003cservice> --dry-run | diff - infra/relay/k8s/charts/\u003cservice>/README.md\n```\n\n## See also\n- urn:skill:meridian:_root:release-process\n- urn:skill:meridian:relay.edge:air-gapped-deploy\n- urn:skill:meridian:relay:terraform-conventions", "raw": "---\nname: helm-conventions\ndescription: \"[relay/k8s] Authoring and releasing Helm charts for Meridian services under infra/relay/k8s/charts: chart layout, values schema, digest-pinned images, and release versioning. Use when creating or changing a chart, its values.yaml or values.schema.json, or when publishing a chart version. Do not use for Terraform-managed cloud resources or for building offline bundles.\"\nlicense: Apache-2.0\ncompatibility: \"Needs helm >= 3.14, kubeconform, helm-unittest, and helm-docs; a kind cluster (`make kind-up`) is enough for local installs.\"\nmetadata:\n  scope: relay.k8s\n  owner: k8s-team\n  requires: \"urn:skill:meridian:_root:release-process\"\n  references: \"infra/relay/k8s/charts/README.md\"\n  status: active\n  since: \"2026-09-04\"\n  kind: engineering\n  layer: team\n  refines: \"urn:skill:meridian:_root:release-process\"\n  triggers: \"Helm chart, values.yaml schema, Chart.yaml version bump, meridian-common chart, chart-lint, digest-pinned image\"\n  negative_triggers: \"air-gapped, offline bundle\"\n  digest: >-\n    Each Meridian service ships one chart under infra/relay/k8s/charts with a values.schema.json, the\n    meridian-common library chart for labels and probes, and images referenced through global.imageRegistry\n    by digest. Chart versions follow the release process and are published only from tags.\n---\n# Helm chart conventions\n\n## When to use / when NOT to use\nUse when you:\n- create a chart under `infra/relay/k8s/charts/\u003cservice>/`,\n- change templates, `values.yaml`, or `values.schema.json`,\n- bump `Chart.yaml` `version` or `appVersion` for a release,\n- add or update the dependency on the `meridian-common` library chart.\n\nDo NOT use when:\n- the resource is cloud infrastructure (`relay:terraform-conventions`),\n- you are packaging charts into the offline bundle (`relay.edge:air-gapped-deploy`),\n- you need to change the release tagging flow itself (`_root:release-process`).\n\n## Steps\n1. Scaffold: `make chart-new NAME=\u003cservice>` copies `charts/_template/` with `Chart.yaml`, `values.yaml`,\n   `values.schema.json`, `templates/`, `tests/`, and `README.md`.\n2. Declare `meridian-common` as a dependency in `Chart.yaml` and use its helpers\n   (`meridian.labels`, `meridian.probes`, `meridian.securityContext`) instead of copying boilerplate.\n3. Define every value in `values.yaml` with a comment and mirror it in `values.schema.json` (`additionalProperties: false`).\n4. Reference images as `{{ .Values.global.imageRegistry }}/{{ .Values.image.repository }}@{{ .Values.image.digest }}`.\n5. Write helm-unittest suites in `tests/*_test.yaml` for every template that contains a conditional.\n6. Render and validate: `make chart-lint NAME=\u003cservice>` (helm lint plus kubeconform against the pinned k8s version).\n7. Install into kind: `make chart-install NAME=\u003cservice> ENV=dev`.\n8. For a release, bump `version` (chart) and `appVersion` (image) per `_root:release-process`;\n   CI packages and pushes the chart to the internal OCI registry on tag.\n\n## Conventions specific to this scope\n- Chart name, service name, and release name are identical; namespaces are `meridian-\u003ccomponent>`.\n- `values.yaml` is the complete documented default; environment overlays in `infra/relay/k8s/values/\u003cenv>/\u003cservice>.yaml`\n  may only override keys that already exist.\n- `global.imageRegistry` is required and has no default; installs must pass it, which the offline bundle relies on.\n- Images are by digest; `image.tag` is rejected by the schema.\n- All workloads set resource requests and limits, `securityContext` from the common chart, and readiness and liveness probes.\n- Secrets are never templated from values; charts reference existing `Secret` names through `existingSecret` keys.\n- `helm template` with default values (and a registry set) must render cleanly; it is a CI job.\n- Labels come only from `meridian.labels`; no ad-hoc `app:` labels.\n- `Chart.yaml` `version` bumps: patch for template fixes, minor for new values, major for removed or renamed values.\n- `README.md` matches `helm-docs` output; CI diffs it.\n\n## Verify\n```bash\nhelm dependency update infra/relay/k8s/charts/\u003cservice>\nhelm lint infra/relay/k8s/charts/\u003cservice> --strict\nhelm template infra/relay/k8s/charts/\u003cservice> --set global.imageRegistry=\u003cregistry> | kubeconform -strict -kubernetes-version 1.30.0\nhelm unittest infra/relay/k8s/charts/\u003cservice>\nhelm-docs --chart-search-root infra/relay/k8s/charts/\u003cservice> --dry-run | diff - infra/relay/k8s/charts/\u003cservice>/README.md\n```\n\n## See also\n- urn:skill:meridian:_root:release-process\n- urn:skill:meridian:relay.edge:air-gapped-deploy\n- urn:skill:meridian:relay:terraform-conventions\n", "path": "infra/relay/k8s/.agents/skills/helm-conventions/SKILL.md", "revision": "298542b6e68eec3bfbee2a90edc4cd1898020110a72b3da16ca194d9da29825c", "bytes": 4643, "requires": ["urn:skill:meridian:_root:release-process"], "refines": ["urn:skill:meridian:_root:release-process"], "references": ["infra/relay/k8s/charts/README.md"]}, {"id": "urn:skill:meridian:shared:shared-lib-versioning", "name": "shared-lib-versioning", "scope": "shared", "owner": "shared-libs", "sourceLayer": "platform", "knowledgeLayer": "Unclassified", "sourceStatus": "active", "description": "[shared] Semantic versioning, tagging and compatibility rules for the shared libraries under libs (db, classification, auth-sdk): when to bump major, minor or patch, how to tag libs/\u003cname>/vX.Y.Z, deprecation windows and the consumer upgrade policy. Use when you change a public API in libs, cut a library release or decide whether a change is breaking. Do not use for the platform release train or for application code inside platforms.", "body": "# Shared library versioning\n\n## When to use / when NOT to use\nUse when you:\n- change an exported Go symbol or public Python module in `libs/db`, `libs/classification` or `libs/auth-sdk`;\n- cut a new library tag or decide which semver component to bump;\n- deprecate an API and need to know how long consumers get;\n- bump a shared library inside a platform and want the upgrade policy.\n\nDo not use for the platform-wide release train (`_root:release-process`) or for helpers under\n`platforms/*` that are not consumed across platforms.\n\n## Steps\n1. Classify the change with the table in `libs/VERSIONING.md`: removed or changed signature is major, new\n   exported symbol or option is minor, behaviour-preserving fix is patch.\n2. For Go run `gorelease -base=libs/\u003cname>/vX.Y.Z` (or `apidiff`) and paste the summary into the PR. For\n   Python run `griffe check meridian_\u003cname> --against libs/\u003cname>/vX.Y.Z`.\n3. Update `libs/\u003cname>/CHANGELOG.md` under `## Unreleased`; every major bump also gets a `### Migration` note.\n4. If major: keep the old API for two platform trains, mark it `// Deprecated:` (Go) or\n   `warnings.warn(..., DeprecationWarning)` (Python) pointing at the replacement.\n5. Merge to `main`, then tag: `git tag -s libs/\u003cname>/vX.Y.Z -m \"libs/\u003cname> vX.Y.Z\"` and push the tag.\n   The tag prefix must equal the directory so Go module resolution works.\n6. Open follow-up PRs in each consuming platform bumping the version; consumers must be on a supported\n   major before the next train freezes.\n7. Record the release in the compatibility matrix at the bottom of `libs/VERSIONING.md`.\n\n## Conventions specific to this scope\n- Each library is its own Go module (`meridian.example/libs/\u003cname>`) and Python distribution\n  (`meridian-\u003cname>`) with the same version number in both ecosystems.\n- Pre-1.0 is not an excuse: everything in `libs/` is treated as 1.x or higher.\n- Major versions of Go modules use the `/v2` import path suffix; do not fork the directory.\n- Only `libs/` may be imported across platforms; a helper copied into two platforms is a signal to promote\n  it here with a minor release.\n- Supported majors: current and previous. Older majors receive security patches only.\n- Build tags, environment variables read by the library and default timeouts are part of the public API.\n- Exported error values and sentinel constants are frozen once released; add new ones instead.\n- The version string is exposed as `Version` (Go) and `__version__` (Python) and reported by service\n  `/version` endpoints.\n\n## Verify\n```bash\ngorelease -base=$(git describe --tags --match 'libs/db/v*' --abbrev=0)   # suggested bump matches your choice\ngo mod tidy && git diff --exit-code go.mod go.sum                          # no unpinned drift\ngrep -n \"Migration\" libs/\u003cname>/CHANGELOG.md                                # present for majors\ngit tag -l 'libs/\u003cname>/v*' | sort -V | tail -1                             # last tag is the one you expect\n```\n\n## See also\n- urn:skill:meridian:_root:release-process\n- urn:skill:meridian:shared.auth-sdk:auth-sdk-usage", "raw": "---\nname: shared-lib-versioning\ndescription: \"[shared] Semantic versioning, tagging and compatibility rules for the shared libraries under libs (db, classification, auth-sdk): when to bump major, minor or patch, how to tag libs/\u003cname>/vX.Y.Z, deprecation windows and the consumer upgrade policy. Use when you change a public API in libs, cut a library release or decide whether a change is breaking. Do not use for the platform release train or for application code inside platforms.\"\nlicense: Apache-2.0\ncompatibility: \"Needs Go 1.22+ with gorelease or apidiff, Python 3.11+ with griffe for the Python packages, and tag rights on main.\"\nmetadata:\n  scope: shared\n  owner: shared-libs\n  references: \"libs/VERSIONING.md\"\n  status: active\n  since: \"2026-09-04\"\n  kind: ways-of-working\n  layer: platform\n  triggers: \"semver bump, libs tag vX.Y.Z, deprecation window, gorelease apidiff, breaking API change, CHANGELOG Unreleased\"\n  negative_triggers: \"platform release train\"\n  digest: >-\n    Shared libraries in libs are versioned independently with strict semver and tagged as libs/\u003cname>/vX.Y.Z.\n    Breaking changes require a major bump, a deprecation window of two platform trains and a migration note in\n    the changelog, so every platform can upgrade on its own schedule.\n---\n\n# Shared library versioning\n\n## When to use / when NOT to use\nUse when you:\n- change an exported Go symbol or public Python module in `libs/db`, `libs/classification` or `libs/auth-sdk`;\n- cut a new library tag or decide which semver component to bump;\n- deprecate an API and need to know how long consumers get;\n- bump a shared library inside a platform and want the upgrade policy.\n\nDo not use for the platform-wide release train (`_root:release-process`) or for helpers under\n`platforms/*` that are not consumed across platforms.\n\n## Steps\n1. Classify the change with the table in `libs/VERSIONING.md`: removed or changed signature is major, new\n   exported symbol or option is minor, behaviour-preserving fix is patch.\n2. For Go run `gorelease -base=libs/\u003cname>/vX.Y.Z` (or `apidiff`) and paste the summary into the PR. For\n   Python run `griffe check meridian_\u003cname> --against libs/\u003cname>/vX.Y.Z`.\n3. Update `libs/\u003cname>/CHANGELOG.md` under `## Unreleased`; every major bump also gets a `### Migration` note.\n4. If major: keep the old API for two platform trains, mark it `// Deprecated:` (Go) or\n   `warnings.warn(..., DeprecationWarning)` (Python) pointing at the replacement.\n5. Merge to `main`, then tag: `git tag -s libs/\u003cname>/vX.Y.Z -m \"libs/\u003cname> vX.Y.Z\"` and push the tag.\n   The tag prefix must equal the directory so Go module resolution works.\n6. Open follow-up PRs in each consuming platform bumping the version; consumers must be on a supported\n   major before the next train freezes.\n7. Record the release in the compatibility matrix at the bottom of `libs/VERSIONING.md`.\n\n## Conventions specific to this scope\n- Each library is its own Go module (`meridian.example/libs/\u003cname>`) and Py
