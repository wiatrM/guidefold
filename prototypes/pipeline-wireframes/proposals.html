thon distribution\n  (`meridian-\u003cname>`) with the same version number in both ecosystems.\n- Pre-1.0 is not an excuse: everything in `libs/` is treated as 1.x or higher.\n- Major versions of Go modules use the `/v2` import path suffix; do not fork the directory.\n- Only `libs/` may be imported across platforms; a helper copied into two platforms is a signal to promote\n  it here with a minor release.\n- Supported majors: current and previous. Older majors receive security patches only.\n- Build tags, environment variables read by the library and default timeouts are part of the public API.\n- Exported error values and sentinel constants are frozen once released; add new ones instead.\n- The version string is exposed as `Version` (Go) and `__version__` (Python) and reported by service\n  `/version` endpoints.\n\n## Verify\n```bash\ngorelease -base=$(git describe --tags --match 'libs/db/v*' --abbrev=0)   # suggested bump matches your choice\ngo mod tidy && git diff --exit-code go.mod go.sum                          # no unpinned drift\ngrep -n \"Migration\" libs/\u003cname>/CHANGELOG.md                                # present for majors\ngit tag -l 'libs/\u003cname>/v*' | sort -V | tail -1                             # last tag is the one you expect\n```\n\n## See also\n- urn:skill:meridian:_root:release-process\n- urn:skill:meridian:shared.auth-sdk:auth-sdk-usage\n", "path": "libs/.agents/skills/shared-lib-versioning/SKILL.md", "revision": "3730d4a7f225c3a9427e5019582131755dc7cd796c459f5dee5620e5955dd503", "bytes": 4341, "requires": [], "refines": [], "references": ["libs/VERSIONING.md"]}, {"id": "urn:skill:meridian:shared.auth-sdk:auth-sdk-usage", "name": "auth-sdk-usage", "scope": "shared.auth-sdk", "owner": "identity-platform", "sourceLayer": "team", "knowledgeLayer": "Unclassified", "sourceStatus": "active", "description": "[shared/auth-sdk] How services consume the Meridian auth SDK (Go and Python) to authenticate callers and enforce RBAC decisions: middleware wiring, token verification, principal propagation, policy client usage and test doubles. Use when you add an authenticated endpoint, call another service with the caller's identity, or upgrade the auth-sdk dependency. Do not use for writing the RBAC policies themselves or for changing the identity service internals.", "body": "# Using the auth SDK\n\n## When to use / when NOT to use\nUse when you:\n- add an HTTP or gRPC endpoint that must know who is calling;\n- make an outbound call to another Meridian service on behalf of the current caller;\n- write tests for authenticated code paths;\n- upgrade `libs/auth-sdk` in a platform and hit API changes.\n\nDo not use for authoring or editing Rego policies (`atlas.identity:rbac-policies`), for identity service or\nturnstile internals, or for end-user login flows in the web UI.\n\n## Steps\n1. Add the dependency: Go `meridian.example/libs/auth-sdk`, Python `meridian-auth-sdk`, at the version pinned\n   in your platform's lockfile.\n2. Wire the middleware once at server construction. Go:\n   `srv.Use(authsdk.Middleware(authsdk.Config{Audience: \"atlas-geo\", Issuer: cfg.Issuer}))`;\n   Python: `app.add_middleware(AuthMiddleware, audience=\"forge-pipelines\")`.\n3. Read the caller from context, never from headers: `p := authsdk.PrincipalFrom(ctx)` or\n   `principal = request.state.principal`. A missing principal is a 401 handled by the middleware.\n4. Authorize with a policy check, never with role string comparisons:\n   `authsdk.Authorize(ctx, p, authsdk.Action(\"dataset.read\"), authsdk.Resource(datasetURN))`.\n   Actions are dot-separated and listed in the policy registry.\n5. Propagate identity on outbound calls with `authsdk.Outbound(ctx)` (Go) or `outbound_session(request)`\n   (Python); it forwards a short-lived delegated token, not the original.\n6. In tests use `authsdk/fake`: `fake.Allow(\"dataset.read\")` and `fake.Principal(\"analyst-1\", groups...)`.\n   Never disable the middleware with a build tag or env var.\n7. On upgrade read `libs/auth-sdk/CHANGELOG.md` and run the contract tests in `libs/auth-sdk/conformance`.\n\n## Conventions specific to this scope\n- Audience equals the service name derived from the node path (`atlas-geo`, `forge-pipelines`).\n- The Principal is immutable and carries `Subject`, `Groups`, `Clearance` and `SessionID`; add fields in\n  the SDK, not in service code.\n- Decision caching lives inside the SDK (30s, keyed by principal, action, resource); do not add another.\n- Deny is the default: a policy error, timeout or unknown action is a 403 with an audit event, never a pass.\n- Every authorization decision emits an audit event through the SDK hook; services must not log decisions\n  separately.\n- Health and readiness endpoints are the only unauthenticated routes; register them via `authsdk.Public()`.\n- Do not log tokens; use `authsdk.Redact(header)` when tracing requests.\n- Go and Python APIs are kept in lockstep; a feature missing in one language is a bug, not a difference.\n\n## Verify\n```bash\ngo test ./libs/auth-sdk/... ./platforms/\u003cplatform>/...             # middleware and handlers\ngo run ./libs/auth-sdk/cmd/authlint ./platforms/\u003cplatform>/...     # flags header parsing and role string checks\npytest platforms/\u003cplatform>/tests -k auth                          # Python services\n! grep -rn \"X-Meridian-Subject\" platforms/                         # no direct header use\n```\n\n## See also\n- urn:skill:meridian:atlas.identity:rbac-policies\n- urn:skill:meridian:shared:shared-lib-versioning\n- urn:skill:meridian:security.audit:audit-logging", "raw": "---\nname: auth-sdk-usage\ndescription: \"[shared/auth-sdk] How services consume the Meridian auth SDK (Go and Python) to authenticate callers and enforce RBAC decisions: middleware wiring, token verification, principal propagation, policy client usage and test doubles. Use when you add an authenticated endpoint, call another service with the caller's identity, or upgrade the auth-sdk dependency. Do not use for writing the RBAC policies themselves or for changing the identity service internals.\"\nlicense: Apache-2.0\ncompatibility: \"Needs the auth-sdk Go module or Python package, a policy endpoint or the bundled fake, and the platform CA bundle for token verification.\"\nmetadata:\n  scope: shared.auth-sdk\n  owner: identity-platform\n  requires: \"urn:skill:meridian:atlas.identity:rbac-policies\"\n  references: \"libs/auth-sdk/README.md\"\n  status: active\n  since: \"2026-09-04\"\n  kind: engineering\n  layer: team\n  triggers: \"auth-sdk middleware, PrincipalFrom context, authsdk.Authorize, token verification, authenticated endpoint, outbound delegated token\"\n  digest: >-\n    auth-sdk is the only supported way for Meridian services to verify caller tokens, build a Principal and\n    ask the RBAC policy service for a decision. Services wire the middleware once, pass the Principal through\n    context, and never parse tokens or hard-code role checks themselves.\n---\n\n# Using the auth SDK\n\n## When to use / when NOT to use\nUse when you:\n- add an HTTP or gRPC endpoint that must know who is calling;\n- make an outbound call to another Meridian service on behalf of the current caller;\n- write tests for authenticated code paths;\n- upgrade `libs/auth-sdk` in a platform and hit API changes.\n\nDo not use for authoring or editing Rego policies (`atlas.identity:rbac-policies`), for identity service or\nturnstile internals, or for end-user login flows in the web UI.\n\n## Steps\n1. Add the dependency: Go `meridian.example/libs/auth-sdk`, Python `meridian-auth-sdk`, at the version pinned\n   in your platform's lockfile.\n2. Wire the middleware once at server construction. Go:\n   `srv.Use(authsdk.Middleware(authsdk.Config{Audience: \"atlas-geo\", Issuer: cfg.Issuer}))`;\n   Python: `app.add_middleware(AuthMiddleware, audience=\"forge-pipelines\")`.\n3. Read the caller from context, never from headers: `p := authsdk.PrincipalFrom(ctx)` or\n   `principal = request.state.principal`. A missing principal is a 401 handled by the middleware.\n4. Authorize with a policy check, never with role string comparisons:\n   `authsdk.Authorize(ctx, p, authsdk.Action(\"dataset.read\"), authsdk.Resource(datasetURN))`.\n   Actions are dot-separated and listed in the policy registry.\n5. Propagate identity on outbound calls with `authsdk.Outbound(ctx)` (Go) or `outbound_session(request)`\n   (Python); it forwards a short-lived delegated token, not the original.\n6. In tests use `authsdk/fake`: `fake.Allow(\"dataset.read\")` and `fake.Principal(\"analyst-1\", groups...)`.\n   Never disable the middleware with a build tag or env var.\n7. On upgrade read `libs/auth-sdk/CHANGELOG.md` and run the contract tests in `libs/auth-sdk/conformance`.\n\n## Conventions specific to this scope\n- Audience equals the service name derived from the node path (`atlas-geo`, `forge-pipelines`).\n- The Principal is immutable and carries `Subject`, `Groups`, `Clearance` and `SessionID`; add fields in\n  the SDK, not in service code.\n- Decision caching lives inside the SDK (30s, keyed by principal, action, resource); do not add another.\n- Deny is the default: a policy error, timeout or unknown action is a 403 with an audit event, never a pass.\n- Every authorization decision emits an audit event through the SDK hook; services must not log decisions\n  separately.\n- Health and readiness endpoints are the only unauthenticated routes; register them via `authsdk.Public()`.\n- Do not log tokens; use `authsdk.Redact(header)` when tracing requests.\n- Go and Python APIs are kept in lockstep; a feature missing in one language is a bug, not a difference.\n\n## Verify\n```bash\ngo test ./libs/auth-sdk/... ./platforms/\u003cplatform>/...             # middleware and handlers\ngo run ./libs/auth-sdk/cmd/authlint ./platforms/\u003cplatform>/...     # flags header parsing and role string checks\npytest platforms/\u003cplatform>/tests -k auth                          # Python services\n! grep -rn \"X-Meridian-Subject\" platforms/                         # no direct header use\n```\n\n## See also\n- urn:skill:meridian:atlas.identity:rbac-policies\n- urn:skill:meridian:shared:shared-lib-versioning\n- urn:skill:meridian:security.audit:audit-logging\n", "path": "libs/auth-sdk/.agents/skills/auth-sdk-usage/SKILL.md", "revision": "5a63afec0ca51ab2b0057a075f2941dd6e7af673cb228e6262dbd71320e7ed43", "bytes": 4566, "requires": ["urn:skill:meridian:atlas.identity:rbac-policies"], "refines": [], "references": ["libs/auth-sdk/README.md"]}, {"id": "urn:skill:meridian:atlas:atlas-api-conventions", "name": "atlas-api-conventions", "scope": "atlas", "owner": "atlas-platform", "sourceLayer": "platform", "knowledgeLayer": "Unclassified", "sourceStatus": "active", "description": "[atlas] HTTP API design rules for every atlas service: URL layout, the shared error envelope, cursor pagination, versioning and the contract-first OpenAPI workflow. Use when adding or changing an endpoint, response schema, status code or error code in any service under platforms/atlas. Do not use for internal gRPC between atlas services or for deciding who may call an endpoint (see atlas/identity rbac-policies).", "body": "# Atlas API conventions\n\n## When to use / when NOT to use\nUse this skill when you:\n- add, rename or remove a public HTTP endpoint in any service under `platforms/atlas/`\n- change a request or response schema, status code or error code\n- bump the API version prefix or deprecate an endpoint\n- review a PR that touches `platforms/atlas/api/openapi.yaml` or a sub-service `openapi.yaml`\n\nDo NOT use it for:\n- internal gRPC or message-bus contracts between atlas services\n- deciding *who* may call an endpoint; that is `rbac-policies` in `atlas.identity`\n- database schema changes (follow `_root:postgres-production`)\n\n## Steps\n1. Edit the contract first. Shared components (`ErrorEnvelope`, `PageSize`, `PageToken`, the\n   `Error` response) live in `platforms/atlas/api/openapi.yaml`; sub-services (geo, graph, turnstile)\n   keep their own `openapi.yaml` next to `src/` and `$ref` the shared file. Never copy a component.\n2. Run `make api-lint` (spectral with the atlas ruleset). Zero errors before writing any Go.\n3. Regenerate server stubs with `make api-gen` (oapi-codegen, strict-server mode) and commit the\n   generated `api/gen/*.go`; CI diffs them against a fresh generation.\n4. Implement the handler in `src/http/` and register it only through the generated router so it\n   passes the shared middleware chain (request-id → auth → RBAC → handler).\n5. Add a contract test in `src/http/*_contract_test.go` that replays the example bodies from the spec.\n6. For a breaking change add a `/v{n+1}` path, keep the old one for two minor releases, mark the old\n   operation `deprecated: true` and set `x-sunset` to a release tag.\n\n## Conventions specific to this scope\n- Path layout: `/v1/{resource}` with plural kebab-case nouns, at most three levels\n  (`/v1/layers/{layerId}/features`). Verbs belong in the HTTP method, never in the path.\n- IDs are opaque strings prefixed by resource type (`lyr_`, `ent_`, `lnk_`, `usr_`). Never expose a\n  Postgres serial id.\n- Every non-2xx response is an `ErrorEnvelope`: `{ \"error\": { \"code\", \"message\", \"requestId\",\n  \"details\"[] } }`. `code` is one of the shared enum values (`NOT_FOUND`, `FORBIDDEN`,\n  `INVALID_ARGUMENT`, `RATE_LIMITED`, `INTERNAL`); free text goes only in `message`.\n- List endpoints take `pageSize` (default 50, max 500) and `pageToken` and return `nextPageToken`\n  (empty string when exhausted). Offset pagination is forbidden on tables above 10k rows.\n- Timestamps are RFC 3339 UTC strings; geometries in JSON bodies are GeoJSON objects, never WKT.\n- Idempotent writes accept an `Idempotency-Key` header scoped to the caller principal.\n- Every response carries `X-Request-Id`; handlers propagate it into logs and downstream calls.\n- Per-operation rate limits are declared with the `x-rate-limit` extension so the gateway can enforce them.\n\n## Verify\n- `make api-lint` passes with zero warnings on the atlas ruleset.\n- `make api-gen && git diff --exit-code platforms/atlas/api/gen` shows generated code is committed.\n- `go test ./platforms/atlas/... -run Contract` runs the replayed spec examples.\n- `curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/does-not-exist` returns 404 with an\n  `ErrorEnvelope` body and an `X-Request-Id` header.\n- The PR description links the spec diff and states whether the change is additive or breaking.\n\n## See also\n- urn:skill:meridian:atlas.graph:link-analysis-api (builds on these conventions)\n- urn:skill:meridian:atlas.identity:rbac-policies (authorization of the endpoints)", "raw": "---\nname: atlas-api-conventions\ndescription: \"[atlas] HTTP API design rules for every atlas service: URL layout, the shared error envelope, cursor pagination, versioning and the contract-first OpenAPI workflow. Use when adding or changing an endpoint, response schema, status code or error code in any service under platforms/atlas. Do not use for internal gRPC between atlas services or for deciding who may call an endpoint (see atlas/identity rbac-policies).\"\nlicense: Apache-2.0\ncompatibility: \"Needs Go 1.22+ and the oapi-codegen and spectral CLIs from the repo toolchain; no cluster access required.\"\nmetadata:\n  scope: atlas\n  owner: atlas-platform\n  references: \"platforms/atlas/api/openapi.yaml\"\n  status: active\n  since: \"2026-09-04\"\n  kind: engineering\n  layer: platform\n  triggers: \"atlas HTTP API, OpenAPI contract-first, error envelope, cursor pagination, /v1 path prefix, oapi-codegen\"\n  digest: >-\n    Every atlas HTTP API is contract-first: the OpenAPI document under platforms/atlas/api is the\n    source of truth and handlers are generated from it. All endpoints share one error envelope,\n    cursor-based pagination and a /v{n} path prefix so analyst clients treat geo, graph and identity\n    services uniformly.\n---\n# Atlas API conventions\n\n## When to use / when NOT to use\nUse this skill when you:\n- add, rename or remove a public HTTP endpoint in any service under `platforms/atlas/`\n- change a request or response schema, status code or error code\n- bump the API version prefix or deprecate an endpoint\n- review a PR that touches `platforms/atlas/api/openapi.yaml` or a sub-service `openapi.yaml`\n\nDo NOT use it for:\n- internal gRPC or message-bus contracts between atlas services\n- deciding *who* may call an endpoint; that is `rbac-policies` in `atlas.identity`\n- database schema changes (follow `_root:postgres-production`)\n\n## Steps\n1. Edit the contract first. Shared components (`ErrorEnvelope`, `PageSize`, `PageToken`, the\n   `Error` response) live in `platforms/atlas/api/openapi.yaml`; sub-services (geo, graph, turnstile)\n   keep their own `openapi.yaml` next to `src/` and `$ref` the shared file. Never copy a component.\n2. Run `make api-lint` (spectral with the atlas ruleset). Zero errors before writing any Go.\n3. Regenerate server stubs with `make api-gen` (oapi-codegen, strict-server mode) and commit the\n   generated `api/gen/*.go`; CI diffs them against a fresh generation.\n4. Implement the handler in `src/http/` and register it only through the generated router so it\n   passes the shared middleware chain (request-id → auth → RBAC → handler).\n5. Add a contract test in `src/http/*_contract_test.go` that replays the example bodies from the spec.\n6. For a breaking change add a `/v{n+1}` path, keep the old one for two minor releases, mark the old\n   operation `deprecated: true` and set `x-sunset` to a release tag.\n\n## Conventions specific to this scope\n- Path layout: `/v1/{resource}` with plural kebab-case nouns, at most three levels\n  (`/v1/layers/{layerId}/features`). Verbs belong in the HTTP method, never in the path.\n- IDs are opaque strings prefixed by resource type (`lyr_`, `ent_`, `lnk_`, `usr_`). Never expose a\n  Postgres serial id.\n- Every non-2xx response is an `ErrorEnvelope`: `{ \"error\": { \"code\", \"message\", \"requestId\",\n  \"details\"[] } }`. `code` is one of the shared enum values (`NOT_FOUND`, `FORBIDDEN`,\n  `INVALID_ARGUMENT`, `RATE_LIMITED`, `INTERNAL`); free text goes only in `message`.\n- List endpoints take `pageSize` (default 50, max 500) and `pageToken` and return `nextPageToken`\n  (empty string when exhausted). Offset pagination is forbidden on tables above 10k rows.\n- Timestamps are RFC 3339 UTC strings; geometries in JSON bodies are GeoJSON objects, never WKT.\n- Idempotent writes accept an `Idempotency-Key` header scoped to the caller principal.\n- Every response carries `X-Request-Id`; handlers propagate it into logs and downstream calls.\n- Per-operation rate limits are declared with the `x-rate-limit` extension so the gateway can enforce them.\n\n## Verify\n- `make api-lint` passes with zero warnings on the atlas ruleset.\n- `make api-gen && git diff --exit-code platforms/atlas/api/gen` shows generated code is committed.\n- `go test ./platforms/atlas/... -run Contract` runs the replayed spec examples.\n- `curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/does-not-exist` returns 404 with an\n  `ErrorEnvelope` body and an `X-Request-Id` header.\n- The PR description links the spec diff and states whether the change is additive or breaking.\n\n## See also\n- urn:skill:meridian:atlas.graph:link-analysis-api (builds on these conventions)\n- urn:skill:meridian:atlas.identity:rbac-policies (authorization of the endpoints)\n", "path": "platforms/atlas/.agents/skills/atlas-api-conventions/SKILL.md", "revision": "9dfc7ca7dc9acb1a96cb3610b8d43f4e63ef639c0fdc7ab03c565f26a352418f", "bytes": 4722, "requires": [], "refines": [], "references": ["platforms/atlas/api/openapi.yaml"]}, {"id": "urn:skill:meridian:atlas.geo:geospatial-indexing", "name": "geospatial-indexing", "scope": "atlas.geo", "owner": "geo-team", "sourceLayer": "team", "knowledgeLayer": "Unclassified", "sourceStatus": "active", "description": "[atlas/geo] Indexing conventions for geospatial layers in atlas: PostGIS geometry columns, companion H3 cell columns, GiST/GIN/BRIN index choice and the h3_index Go helpers. Use when creating or altering a table with a geometry column, writing a bounding-box, radius or containment query, choosing a layer's H3 resolution, or tuning a slow spatial query. Do not use for vector tile rendering (see map-tile-serving) or for non-spatial Postgres schema work.", "body": "# Geospatial indexing for atlas layers\n\n## When to use / when NOT to use\nUse this skill when you:\n- create or alter a table under `platforms/atlas/geo/` that has a `geometry` or `geography` column\n- add a query that filters by bounding box, radius, polygon containment or \"nearby\" semantics\n- choose or change the H3 resolution of a layer\n- investigate a slow spatial query (`EXPLAIN` shows a seq scan on a geometry column)\n- touch the helpers in `platforms/atlas/geo/src/index/h3_index.go`\n\nDo NOT use it for:\n- rendering or caching vector tiles; that is `map-tile-serving`\n- pooling, migration mechanics or failover; follow `_root:postgres-production`\n- defining what a location object *means* in the ontology (forge.ontology owns that)\n\n## Steps\n1. Pick the layer's H3 resolution from the guide below and record it in the layer manifest\n   (`layers/\u003clayer>/manifest.yaml`, key `h3Resolution`). The resolution is immutable once data exists.\n2. Write the migration under `platforms/atlas/geo/migrations/` using the `_root` naming scheme\n   (`NNNN_\u003cverb>_\u003ctable>.sql`). The table must have:\n   - `geom geometry(Geometry, 4326) NOT NULL`\n   - `h3_cells h3index[] NOT NULL` (every cell of the polygon at the layer resolution, or one cell for points)\n   - `h3_res smallint NOT NULL` copied from the manifest so mixed-resolution rows are detectable\n3. Add indexes in the same migration: `USING gist (geom)` and `USING gin (h3_cells)`. Append-only,\n   time-ordered layers additionally get `USING brin (observed_at)`.\n4. Populate `h3_cells` through `index.CellsForGeometry(geom, res)`; never compute cells ad hoc in SQL\n   or inside a handler.\n5. Write the query cell-first: filter with `h3_cells && index.CoverCells(bbox, res)`, then refine with\n   `ST_Intersects` or `ST_DWithin` in the same `WHERE` clause, not in application code.\n6. Run `EXPLAIN (ANALYZE, BUFFERS)` on the new query against the `geo-bench` fixture and paste the\n   plan into the PR.\n\n## Conventions specific to this scope\n- SRID is always 4326 in storage. Reproject in the query (`ST_Transform`) only for distance maths;\n  prefer a `geography` cast for radius searches under 500 km.\n- H3 resolution guide: region-scale layers 4–5, city-scale layers 7–8, building-scale layers 10–11.\n  Anything above 12 needs geo-team sign-off because of index size.\n- `h3_cells` is capped at 2 048 cells per row (`index.MaxCellsPerRow`). Larger polygons are stored\n  compacted (`index.CompactCells`) and expanded at query time.\n- Column names: `geom` for the primary geometry, `centroid` for a derived point; never `geometry`,\n  `shape` or `location`.\n- Every spatial table has `observed_at timestamptz` and `source_layer text`; both are required by the\n  tile pipeline and by audit queries.\n- Never store latitude and longitude as two float columns; convert at ingest if a feed delivers them.\n- Go code calls the `index.*` wrappers only, so the H3 library version is upgraded in one place.\n\n## Verify\n- `make -C platforms/atlas/geo migrate-check` applies the migration to a scratch database.\n- `go test ./platforms/atlas/geo/src/index/...` passes, including the property test that the union of\n  `CellsForGeometry` cells `ST_Covers` the input geometry.\n- `psql -f platforms/atlas/geo/bench/queries.sql` prints plans; none may contain `Seq Scan` on a\n  table with more than 100k rows.\n- `SELECT count(*) FROM \u003ctable> WHERE h3_res \u003c> \u003cmanifest resolution>` returns 0.\n\n## See also\n- urn:skill:meridian:_root:postgres-production (required)\n- urn:skill:meridian:atlas.geo:map-tile-serving\n- urn:skill:meridian:atlas:atlas-api-conventions", "raw": "---\nname: geospatial-indexing\ndescription: \"[atlas/geo] Indexing conventions for geospatial layers in atlas: PostGIS geometry columns, companion H3 cell columns, GiST/GIN/BRIN index choice and the h3_index Go helpers. Use when creating or altering a table with a geometry column, writing a bounding-box, radius or containment query, choosing a layer's H3 resolution, or tuning a slow spatial query. Do not use for vector tile rendering (see map-tile-serving) or for non-spatial Postgres schema work.\"\nlicense: Apache-2.0\ncompatibility: \"Needs PostGIS 3.4+ with the h3 and h3_postgis extensions, psql, and Go 1.22+ for the index helpers.\"\nmetadata:\n  scope: atlas.geo\n  owner: geo-team\n  requires: \"urn:skill:meridian:_root:postgres-production\"\n  references: \"platforms/atlas/geo/src/index/h3_index.go\"\n  status: active\n  since: \"2026-09-04\"\n  kind: engineering\n  layer: team\n  refines: \"urn:skill:meridian:_root:postgres-production\"\n  triggers: \"PostGIS geometry column, H3 cell index, GiST GIN BRIN, h3_index helpers, spatial bounding-box query, H3 resolution\"\n  negative_triggers: \"vector tile rendering\"\n  digest: >-\n    Atlas geo layers store geometry in PostGIS together with an H3 cell column at a fixed resolution\n    per layer. Spatial queries filter by H3 cells first and refine with ST_ functions, and the index\n    helpers in geo/src/index are the only code that computes cells.\n---\n# Geospatial indexing for atlas layers\n\n## When to use / when NOT to use\nUse this skill when you:\n- create or alter a table under `platforms/atlas/geo/` that has a `geometry` or `geography` column\n- add a query that filters by bounding box, radius, polygon containment or \"nearby\" semantics\n- choose or change the H3 resolution of a layer\n- investigate a slow spatial query (`EXPLAIN` shows a seq scan on a geometry column)\n- touch the helpers in `platforms/atlas/geo/src/index/h3_index.go`\n\nDo NOT use it for:\n- rendering or caching vector tiles; that is `map-tile-serving`\n- pooling, migration mechanics or failover; follow `_root:postgres-production`\n- defining what a location object *means* in the ontology (forge.ontology owns that)\n\n## Steps\n1. Pick the layer's H3 resolution from the guide below and record it in the layer manifest\n   (`layers/\u003clayer>/manifest.yaml`, key `h3Resolution`). The resolution is immutable once data exists.\n2. Write the migration under `platforms/atlas/geo/migrations/` using the `_root` naming scheme\n   (`NNNN_\u003cverb>_\u003ctable>.sql`). The table must have:\n   - `geom geometry(Geometry, 4326) NOT NULL`\n   - `h3_cells h3index[] NOT NULL` (every cell of the polygon at the layer resolution, or one cell for points)\n   - `h3_res smallint NOT NULL` copied from the manifest so mixed-resolution rows are detectable\n3. Add indexes in the same migration: `USING gist (geom)` and `USING gin (h3_cells)`. Append-only,\n   time-ordered layers additionally get `USING brin (observed_at)`.\n4. Populate `h3_cells` through `index.CellsForGeometry(geom, res)`; never compute cells ad hoc in SQL\n   or inside a handler.\n5. Write the query cell-first: filter with `h3_cells && index.CoverCells(bbox, res)`, then refine with\n   `ST_Intersects` or `ST_DWithin` in the same `WHERE` clause, not in application code.\n6. Run `EXPLAIN (ANALYZE, BUFFERS)` on the new query against the `geo-bench` fixture and paste the\n   plan into the PR.\n\n## Conventions specific to this scope\n- SRID is always 4326 in storage. Reproject in the query (`ST_Transform`) only for distance maths;\n  prefer a `geography` cast for radius searches under 500 km.\n- H3 resolution guide: region-scale layers 4–5, city-scale layers 7–8, building-scale layers 10–11.\n  Anything above 12 needs geo-team sign-off because of index size.\n- `h3_cells` is capped at 2 048 cells per row (`index.MaxCellsPerRow`). Larger polygons are stored\n  compacted (`index.CompactCells`) and expanded at query time.\n- Column names: `geom` for the primary geometry, `centroid` for a derived point; never `geometry`,\n  `shape` or `location`.\n- Every spatial table has `observed_at timestamptz` and `source_layer text`; both are required by the\n  tile pipeline and by audit queries.\n- Never store latitude and longitude as two float columns; convert at ingest if a feed delivers them.\n- Go code calls the `index.*` wrappers only, so the H3 library version is upgraded in one place.\n\n## Verify\n- `make -C platforms/atlas/geo migrate-check` applies the migration to a scratch database.\n- `go test ./platforms/atlas/geo/src/index/...` passes, including the property test that the union of\n  `CellsForGeometry` cells `ST_Covers` the input geometry.\n- `psql -f platforms/atlas/geo/bench/queries.sql` prints plans; none may contain `Seq Scan` on a\n  table with more than 100k rows.\n- `SELECT count(*) FROM \u003ctable> WHERE h3_res \u003c> \u003cmanifest resolution>` returns 0.\n\n## See also\n- urn:skill:meridian:_root:postgres-production (required)\n- urn:skill:meridian:atlas.geo:map-tile-serving\n- urn:skill:meridian:atlas:atlas-api-conventions\n", "path": "platforms/atlas/geo/.agents/skills/geospatial-indexing/SKILL.md", "revision": "8f3f9d62c046e8763b5cad457747ba7c98d754cb8b204808828eed71b5f81bae", "bytes": 4985, "requires": ["urn:skill:meridian:_root:postgres-production"], "refines": ["urn:skill:meridian:_root:postgres-production"], "references": ["platforms/atlas/geo/src/index/h3_index.go"]}, {"id": "urn:skill:meridian:atlas.geo:map-tile-serving", "name": "map-tile-serving", "scope": "atlas.geo", "owner": "geo-team", "sourceLayer": "team", "knowledgeLayer": "Unclassified", "sourceStatus": "active", "description": "[atlas/geo] Serving atlas geo layers as Mapbox vector tiles: per-layer zoom ranges, simplification, generalisation by H3 parent cell, tile cache keys and the tile size budget in tiles/config.yaml. Use when exposing a layer as tiles, changing minZoom/maxZoom or cache settings, or debugging missing, oversized or slow tiles. Do not use for designing the tables and H3 columns behind a layer (see geospatial-indexing) or for raster basemaps.", "body": "# Map tile serving\n\n## When to use / when NOT to use\nUse this skill when you:\n- expose a geo layer as vector tiles at `/v1/tiles/{layer}/{z}/{x}/{y}.mvt`\n- change `platforms/atlas/geo/tiles/config.yaml` (zoom range, tolerance, cache TTL, properties)\n- add a generalised low-zoom representation of a large layer\n- debug missing, oversized or slow tiles\n\nDo NOT use it for:\n- designing the tables or H3 columns behind a layer; that is `geospatial-indexing`, loaded with this skill\n- raster imagery or basemap hosting (served by the relay deployment layer, not atlas)\n- client-side styling of layers\n\n## Steps\n1. Confirm the layer follows `geospatial-indexing` (`geom`, `h3_cells`, indexes). The tile server\n   refuses layers whose manifest lacks `h3Resolution`.\n2. Add a `layers.\u003cname>` block to `tiles/config.yaml` with `layerVersion`, `minZoom`, `maxZoom`,\n   `tolerance` (metres per zoom step), `cacheTtl` and the `properties` allow-list. Unlisted\n   properties are never emitted in a tile. Values omitted fall back to `defaults`.\n3. If `maxZoom - minZoom > 8`, add a `generalize` section: below `generalize.zoom` the server\n   aggregates rows by H3 parent cell (`h3ParentResolution`) and emits one feature per cell with a `count`.\n4. Run `tilectl lint tiles/config.yaml` and `tilectl bench \u003clayer> --zooms \u003cmin>,\u003cmid>,\u003cmax>` locally.\n5. Register the tile route through the generated OpenAPI router (see `atlas-api-conventions`); the\n   handler only sets `Content-Type: application/vnd.mapbox-vector-tile` and the cache headers.\n6. Add the layer to `tiles/config.yaml` `warm` if it is on an analyst default map.\n\n## Conventions specific to this scope\n- Tiles come from a single `ST_AsMVT` query per layer per zoom; the SQL template lives in\n  `tiles/sql/\u003clayer>.sql.tmpl` and is rendered from `config.yaml`. No hand-written tile SQL in Go.\n- Tile size budget is 500 KB compressed. `tilectl bench` fails above that; fix by raising `tolerance`,\n  lowering `maxZoom` or adding `generalize`, in that order.\n- `maxZoom` never exceeds 16 for polygon layers and 18 for point layers; `minZoom` below 4 requires\n  a `generalize` section.\n- Cache keys are `tile:\u003clayer>:\u003clayerVersion>:\u003cz>/\u003cx>/\u003cy>`; bump `layerVersion` whenever the SQL\n  template or property list changes. Never purge the cache by hand.\n- The `properties` allow-list must not contain fields classified above the layer's declared label\n  (see `security:classification-labels`); tiles are cached without per-caller context.\n- Zoom 0–3 of layers in `warm` are pre-rendered at release time and shipped as static files.\n- The tile server is stateless; all per-layer configuration comes from `config.yaml`, never from env vars.\n\n## Verify\n- `tilectl lint platforms/atlas/geo/tiles/config.yaml` exits 0.\n- `tilectl bench \u003clayer> --zooms \u003cminZoom>,\u003cmid>,\u003cmaxZoom>` reports p95 under 200 ms and no tile\n  above the size budget.\n- `curl -sI localhost:8080/v1/tiles/\u003clayer>/8/128/85.mvt` shows the MVT content type,\n  `Cache-Control: public, max-age=\u003ccacheTtl>` and an `ETag`.\n- `go test ./platforms/atlas/geo/tiles/...` decodes a rendered tile and checks only allow-listed\n  properties are present.\n\n## See also\n- urn:skill:meridian:atlas.geo:geospatial-indexing (required)\n- urn:skill:meridian:atlas:atlas-api-conventions\n- urn:skill:meridian:security:classification-labels", "raw": "---\nname: map-tile-serving\ndescription: \"[atlas/geo] Serving atlas geo layers as Mapbox vector tiles: per-layer zoom ranges, simplification, generalisation by H3 parent cell, tile cache keys and the tile size budget in tiles/config.yaml. Use when exposing a layer as tiles, changing minZoom/maxZoom or cache settings, or debugging missing, oversized or slow tiles. Do not use for designing the tables and H3 columns behind a layer (see geospatial-indexing) or for raster basemaps.\"\nlicense: Apache-2.0\ncompatibility: \"Needs the tilectl CLI from the repo toolchain, a PostGIS database with the layer tables, and Go 1.22+ for the tile server tests.\"\nmetadata:\n  scope: atlas.geo\n  owner: geo-team\n  requires: \"urn:skill:meridian:atlas.geo:geospatial-indexing\"\n  references: \"platforms/atlas/geo/tiles/config.yaml#maxZoom\"\n  status: active\n  since: \"2026-09-04\"\n  kind: engineering\n  layer: team\n  refines: \"urn:skill:meridian:atlas:atlas-api-conventions\"\n  triggers: \"vector tiles, Mapbox MVT, tiles/config.yaml, zoom range, tile cache TTL, H3 parent cell generalisation\"\n  negative_triggers: \"raster basemap\"\n  digest: >-\n    Atlas geo layers are served as vector tiles generated by one ST_AsMVT query per layer and zoom,\n    driven entirely by tiles/config.yaml. Each layer declares its zoom range, simplification and\n    property allow-list, and large layers are generalised by H3 parent cell below a threshold zoom.\n---\n# Map tile serving\n\n## When to use / when NOT to use\nUse this skill when you:\n- expose a geo layer as vector tiles at `/v1/tiles/{layer}/{z}/{x}/{y}.mvt`\n- change `platforms/atlas/geo/tiles/config.yaml` (zoom range, tolerance, cache TTL, properties)\n- add a generalised low-zoom representation of a large layer\n- debug missing, oversized or slow tiles\n\nDo NOT use it for:\n- designing the tables or H3 columns behind a layer; that is `geospatial-indexing`, loaded with this skill\n- raster imagery or basemap hosting (served by the relay deployment layer, not atlas)\n- client-side styling of layers\n\n## Steps\n1. Confirm the layer follows `geospatial-indexing` (`geom`, `h3_cells`, indexes). The tile server\n   refuses layers whose manifest lacks `h3Resolution`.\n2. Add a `layers.\u003cname>` block to `tiles/config.yaml` with `layerVersion`, `minZoom`, `maxZoom`,\n   `tolerance` (metres per zoom step), `cacheTtl` and the `properties` allow-list. Unlisted\n   properties are never emitted in a tile. Values omitted fall back to `defaults`.\n3. If `maxZoom - minZoom > 8`, add a `generalize` section: below `generalize.zoom` the server\n   aggregates rows by H3 parent cell (`h3ParentResolution`) and emits one feature per cell with a `count`.\n4. Run `tilectl lint tiles/config.yaml` and `tilectl bench \u003clayer> --zooms \u003cmin>,\u003cmid>,\u003cmax>` locally.\n5. Register the tile route through the generated OpenAPI router (see `atlas-api-conventions`); the\n   handler only sets `Content-Type: application/vnd.mapbox-vector-tile` and the cache headers.\n6. Add the layer to `tiles/config.yaml` `warm` if it is on an analyst default map.\n\n## Conventions specific to this scope\n- Tiles come from a single `ST_AsMVT` query per layer per zoom; the SQL template lives in\n  `tiles/sql/\u003clayer>.sql.tmpl` and is rendered from `config.yaml`. No hand-written tile SQL in Go.\n- Tile size budget is 500 KB compressed. `tilectl bench` fails above that; fix by raising `tolerance`,\n  lowering `maxZoom` or adding `generalize`, in that order.\n- `maxZoom` never exceeds 16 for polygon layers and 18 for point layers; `minZoom` below 4 requires\n  a `generalize` section.\n- Cache keys are `tile:\u003clayer>:\u003clayerVersion>:\u003cz>/\u003cx>/\u003cy>`; bump `layerVersion` whenever the SQL\n  template or property list changes. Never purge the cache by hand.\n- The `properties` allow-list must not contain fields classified above the layer's declared label\n  (see `security:classification-labels`); tiles are cached without per-caller context.\n- Zoom 0–3 of layers in `warm` are pre-rendered at release time and shipped as static files.\n- The tile server is stateless; all per-layer configuration comes from `config.yaml`, never from env vars.\n\n## Verify\n- `tilectl lint platforms/atlas/geo/tiles/config.yaml` exits 0.\n- `tilectl bench \u003clayer> --zooms \u003cminZoom>,\u003cmid>,\u003cmaxZoom>` reports p95 under 200 ms and no tile\n  above the size budget.\n- `curl -sI localhost:8080/v1/tiles/\u003clayer>/8/128/85.mvt` shows the MVT content type,\n  `Cache-Control: public, max-age=\u003ccacheTtl>` and an `ETag`.\n- `go test ./platforms/atlas/geo/tiles/...` decodes a rendered tile and checks only allow-listed\n  properties are present.\n\n## See also\n- urn:skill:meridian:atlas.geo:geospatial-indexing (required)\n- urn:skill:meridian:atlas:atlas-api-conventions\n- urn:skill:meridian:security:classification-labels\n", "path": "platforms/atlas/geo/.agents/skills/map-tile-serving/SKILL.md", "revision": "fea4670e514d8c68097a9b0459bc761ffa370331d78474d28eae4cd8e9fe2947", "bytes": 4747, "requires": ["urn:skill:meridian:atlas.geo:geospatial-indexing"], "refines": ["urn:skill:meridian:atlas:atlas-api-conventions"], "references": ["platforms/atlas/geo/tiles/config.yaml#maxZoom"]}, {"id": "urn:skill:meridian:atlas.graph:link-analysis-api", "name": "link-analysis-api", "scope": "atlas.graph", "owner": "graph-team", "sourceLayer": "team", "knowledgeLayer": "Unclassified", "sourceStatus": "active", "description": "[atlas/graph] Design and implementation rules for the atlas graph endpoints (/v1/graph/neighbors, /v1/graph/paths): request shape, bounded BFS traversal, depth/fan-out/result limits, truncation reporting and in-traversal RBAC filtering. Use when adding or changing a graph query endpoint, modifying traversal.go, tuning traversal limits, or exposing a new edge type. Do not use for general HTTP conventions (see atlas-api-conventions) or for batch graph analytics pipelines.", "body": "# Link analysis API\n\n## When to use / when NOT to use\nUse this skill when you:\n- add or change an endpoint under `/v1/graph/` (neighbours, paths, subgraph export)\n- modify the traversal engine in `platforms/atlas/graph/src/query/traversal.go`\n- tune depth, fan-out, result-size or time limits for graph queries\n- expose a new edge type or edge property through the API\n\nDo NOT use it for:\n- envelope, pagination and versioning rules; those come from `atlas-api-conventions`, loaded with this skill\n- defining what entities and links *mean*; object and link types are owned by forge.ontology\n- bulk graph analytics (centrality, community detection) that run as forge pipelines\n\n## Steps\n1. Model the request as a `GraphQuery` in the graph `openapi.yaml`: `seeds[]` (entity ids),\n   `edgeTypes[]`, `direction` (`out|in|both`), `maxDepth`, `maxFanOut`, `limit`, `pageToken`.\n2. Implement the query on top of `query.BoundedBFS` in `traversal.go`. Never write a new traversal\n   loop; extend `TraversalLimits` if a new bound is needed.\n3. Enforce limits server-side regardless of the request: `maxDepth ≤ 4`, `maxFanOut ≤ 200` per node,\n   `limit ≤ 5000` nodes per page, wall-clock budget 5 s via the request context. Requests above a cap\n   get `INVALID_ARGUMENT`, never a silently clamped result.\n4. Return a flat `nodes[]` + `edges[]` pair with `truncated: true` and `truncationReason`\n   (`depth|fanOut|limit|timeBudget`) whenever a bound was hit.\n5. Pass the caller's RBAC decision as the `VisitFilter` so unreadable nodes are neither returned nor\n   expanded; do not post-filter the result.\n6. Add a golden test in `src/query/testdata/` with a small fixture graph and the expected node sets\n   for each `direction` and each truncation reason.\n\n## Conventions specific to this scope\n- Entity ids are `ent_` prefixed; edge ids are `lnk_` prefixed and stable across re-ingestion.\n- Edge types are lower_snake strings from the ontology (`part_of`, `located_in`, `derived_from`);\n  the API validates them against the ontology cache and rejects unknown types with `INVALID_ARGUMENT`.\n- `/v1/graph/paths` is bidirectional BFS with the same limits; `maxDepth` counts hops from either end,\n  so the longest returned path has 8 hops.\n- Every traversal emits a `graph.query` audit event with seed ids, limits and truncation reason\n  (see `security.audit:audit-logging`), never the returned node ids.\n- `traversal.go` uses a frontier queue, not recursion, so depth bounds cannot depend on stack size.\n- Results are cached for 60 s keyed on the canonicalised request plus the caller's role set.\n- No endpoint returns the whole graph; exports go through the pipeline platform as datasets.\n\n## Verify\n- `go test ./platforms/atlas/graph/src/query/...` passes, including the property test that\n  `BoundedBFS` never visits more than `maxDepth * maxFanOut` nodes per seed.\n- `go test -bench BFS ./platforms/atlas/graph/src/query/` stays under 50 ms on the 10k-node fixture.\n- `curl -s -X POST localhost:8080/v1/graph/neighbors -d '{\"seeds\":[\"ent_x\"],\"maxDepth\":9}'` returns\n  400 with `error.code == \"INVALID_ARGUMENT\"`.\n- `make api-lint` passes for the graph `openapi.yaml`.\n\n## See also\n- urn:skill:meridian:atlas:atlas-api-conventions (required)\n- urn:skill:meridian:atlas.identity:rbac-policies\n- urn:skill:meridian:forge.ontology:ontology-modeling", "raw": "---\nname: link-analysis-api\ndescription: \"[atlas/graph] Design and implementation rules for the atlas graph endpoints (/v1/graph/neighbors, /v1/graph/paths): request shape, bounded BFS traversal, depth/fan-out/result limits, truncation reporting and in-traversal RBAC filtering. Use when adding or changing a graph query endpoint, modifying traversal.go, tuning traversal limits, or exposing a new edge type. Do not use for general HTTP conventions (see atlas-api-conventions) or for batch graph analytics pipelines.\"\nlicense: Apache-2.0\ncompatibility: \"Needs Go 1.22+, the graph fixture database (make graph-fixture) and the atlas API toolchain (make api-lint, make api-gen).\"\nmetadata:\n  scope: atlas.graph\n  owner: graph-team\n  requires: \"urn:skill:meridian:atlas:atlas-api-conventions\"\n  references: \"platforms/atlas/graph/src/query/traversal.go\"\n  status: active\n  since: \"2026-09-04\"\n  kind: engineering\n  layer: team\n  refines: \"urn:skill:meridian:atlas:atlas-api-conventions\"\n  triggers: \"graph neighbors endpoint, bounded BFS traversal, maxDepth maxFanOut, traversal.go, truncation reporting, edge type\"\n  digest: >-\n    The atlas graph API exposes neighbourhood and path queries over ontology entities and links\n    through one bounded breadth-first traversal engine. Depth, fan-out, result size and time budget\n    are capped server-side, truncation is always reported, and RBAC filtering happens inside the\n    traversal so unreadable nodes are never expanded.\n---\n# Link analysis API\n\n## When to use / when NOT to use\nUse this skill when you:\n- add or change an endpoint under `/v1/graph/` (neighbours, paths, subgraph export)\n- modify the traversal engine in `platforms/atlas/graph/src/query/traversal.go`\n- tune depth, fan-out, result-size or time limits for graph queries\n- expose a new edge type or edge property through the API\n\nDo NOT use it for:\n- envelope, pagination and versioning rules; those come from `atlas-api-conventions`, loaded with this skill\n- defining what entities and links *mean*; object and link types are owned by forge.ontology\n- bulk graph analytics (centrality, community detection) that run as forge pipelines\n\n## Steps\n1. Model the request as a `GraphQuery` in the graph `openapi.yaml`: `seeds[]` (entity ids),\n   `edgeTypes[]`, `direction` (`out|in|both`), `maxDepth`, `maxFanOut`, `limit`, `pageToken`.\n2. Implement the query on top of `query.BoundedBFS` in `traversal.go`. Never write a new traversal\n   loop; extend `TraversalLimits` if a new bound is needed.\n3. Enforce limits server-side regardless of the request: `maxDepth ≤ 4`, `maxFanOut ≤ 200` per node,\n   `limit ≤ 5000` nodes per page, wall-clock budget 5 s via the request context. Requests above a cap\n   get `INVALID_ARGUMENT`, never a silently clamped result.\n4. Return a flat `nodes[]` + `edges[]` pair with `truncated: true` and `truncationReason`\n   (`depth|fanOut|limit|timeBudget`) whenever a bound was hit.\n5. Pass the caller's RBAC decision as the `VisitFilter` so unreadable nodes are neither returned nor\n   expanded; do not post-filter the result.\n6. Add a golden test in `src/query/testdata/` with a small fixture graph and the expected node sets\n   for each `direction` and each truncation reason.\n\n## Conventions specific to this scope\n- Entity ids are `ent_` prefixed; edge ids are `lnk_` prefixed and stable across re-ingestion.\n- Edge types are lower_snake strings from the ontology (`part_of`, `located_in`, `derived_from`);\n  the API validates them against the ontology cache and rejects unknown types with `INVALID_ARGUMENT`.\n- `/v1/graph/paths` is bidirectional BFS with the same limits; `maxDepth` counts hops from either end,\n  so the longest returned path has 8 hops.\n- Every traversal emits a `graph.query` audit event with seed ids, limits and truncation reason\n  (see `security.audit:audit-logging`), never the returned node ids.\n- `traversal.go` uses a frontier queue, not recursion, so depth bounds cannot depend on stack size.\n- Results are cached for 60 s keyed on the canonicalised request plus the caller's role set.\n- No endpoint returns the whole graph; exports go through the pipeline platform as datasets.\n\n## Verify\n- `go test ./platforms/atlas/graph/src/query/...` passes, including the property test that\n  `BoundedBFS` never visits more than `maxDepth * maxFanOut` nodes per seed.\n- `go test -bench BFS ./platforms/atlas/graph/src/query/` stays under 50 ms on the 10k-node fixture.\n- `curl -s -X POST localhost:8080/v1/graph/neighbors -d '{\"seeds\":[\"ent_x\"],\"maxDepth\":9}'` returns\n  400 with `error.code == \"INVALID_ARGUMENT\"`.\n- `make api-lint` passes for the graph `openapi.yaml`.\n\n## See also\n- urn:skill:meridian:atlas:atlas-api-conventions (required)\n- urn:skill:meridian:atlas.identity:rbac-policies\n- urn:skill:meridian:forge.ontology:ontology-modeling\n", "path": "platforms/atlas/graph/.agents/skills/link-analysis-api/SKILL.md", "revision": "cbfb6b252621b034f1508c65be87aa9366ec992276dc8aafbf5111c7c96e4ad7", "bytes": 4818, "requires": ["urn:skill:meridian:atlas:atlas-api-conventions"], "refines": ["urn:skill:meridian:atlas:atlas-api-conventions"], "references": ["platforms/atlas/graph/src/query/traversal.go"]}, {"id": "urn:skill:meridian:atlas.identity:legacy-session-auth", "name": "legacy-session-auth", "scope": "atlas.identity", "owner": "identity-platform", "sourceLayer": "team", "knowledgeLayer": "Unclassified", "sourceStatus": "deprecated", "description": "[atlas/identity] DEPRECATED. Cookie-based session authorization evaluated inside each atlas service, superseded by turnstile's postgres-auth. Use only when reading old code paths guarded by legacyAuthMode while they are being removed. Do not use for new endpoints or for any change to authorization logic.", "body": "# Legacy session auth (deprecated)\n\n## When to use / when NOT to use\nRead this only to understand code paths guarded by `legacyAuthMode` while they are being removed.\nDo not follow it for any new or changed authorization logic; load\n`urn:skill:meridian:atlas.identity.turnstile:postgres-auth` instead.\n\n## Steps\nThere are no steps. The former procedure (per-service session lookup, role checks inside handlers)\nis intentionally not reproduced here so that it cannot be applied by accident.\n\n## Conventions specific to this scope\n- Superseded because per-service role evaluation drifted between geo, graph and the API gateway and\n  could not be audited from one place; turnstile now issues a single decision per request.\n- The `atlas_sessions` table is read-only and will be dropped once `legacyAuthMode` is `false` in\n  every turnstile deployment.\n\n## Verify\n- `grep -rn legacyAuthMode platforms/atlas/` lists only hits tracked in the turnstile removal issue.\n\n## See also\n- urn:skill:meridian:atlas.identity.turnstile:postgres-auth (replacement)\n- urn:skill:meridian:atlas.identity:rbac-policies", "raw": "---\nname: legacy-session-auth\ndescription: \"[atlas/identity] DEPRECATED. Cookie-based session authorization evaluated inside each atlas service, superseded by turnstile's postgres-auth. Use only when reading old code paths guarded by legacyAuthMode while they are being removed. Do not use for new endpoints or for any change to authorization logic.\"\nlicense: Apache-2.0\ncompatibility: \"No tooling required; informational only.\"\nmetadata:\n  scope: atlas.identity\n  owner: identity-platform\n  status: deprecated\n  replaced_by: urn:skill:meridian:atlas.identity.turnstile:postgres-auth\n  since: \"2026-09-04\"\n  kind: engineering\n  layer: team\n  triggers: \"legacyAuthMode, atlas_sessions table, cookie-based session authorization, per-service role check, deprecated auth path\"\n  negative_triggers: \"new service, greenfield endpoint\"\n  digest: >-\n    Legacy session authorization kept an atlas-wide sessions table and evaluated roles separately in\n    each service. It is superseded by turnstile's postgres-auth, which centralises token validation\n    and RBAC evaluation; this skill remains only until the last legacyAuthMode deployment is retired.\n---\n# Legacy session auth (deprecated)\n\n## When to use / when NOT to use\nRead this only to understand code paths guarded by `legacyAuthMode` while they are being removed.\nDo not follow it for any new or changed authorization logic; load\n`urn:skill:meridian:atlas.identity.turnstile:postgres-auth` instead.\n\n## Steps\nThere are no steps. The former procedure (per-service session lookup, role checks inside handlers)\nis intentionally not reproduced here so that it cannot be applied by accident.\n\n## Conventions specific to this scope\n- Superseded because per-service role evaluation drifted between geo, graph and the API gateway and\n  could not be audited from one place; turnstile now issues a single decision per request.\n- The `atlas_sessions` table is read-only and will be dropped once `legacyAuthMode` is `false` in\n  every turnstile deployment.\n\n## Verify\n- `grep -rn legacyAuthMode platforms/atlas/` lists only hits tracked in the turnstile removal issue.\n\n## See also\n- urn:skill:meridian:atlas.identity.turnstile:postgres-auth (replacement)\n- urn:skill:meridian:atlas.identity:rbac-policies\n", "path": "platforms/atlas/identity/.agents/skills/legacy-session-auth/SKILL.md", "revision": "5b683b9b2f7d5497ca35c023adf55becd0e26c42d661a228cdd1c724261fa115", "bytes": 2246, "requires": [], "refines": [], "references": []}, {"id": "urn:skill:meridian:atlas.identity:rbac-policies", "name": "rbac-policies", "scope": "atlas.identity", "owner": "identity-platform", "sourceLayer": "team", "knowledgeLayer": "Unclassified", "sourceStatus": "active", "description": "[atlas/identity] Authoring and testing the atlas RBAC policy bundle in OPA Rego: the analyst/supervisor/admin role model, the fixed OPA input document, allow-rule structure, policy tests and bundle versioning. Use when adding a role, action or resource type to policies/rbac.rego, changing how a service builds the policy input, or reviewing a request for broader access. Do not use for turnstile service internals (see atlas/identity/turnstile postgres-auth) or for authentication.", "body": "# RBAC policies for atlas\n\n## When to use / when NOT to use\nUse this skill when you:\n- add a role, action or resource type to `platforms/atlas/identity/policies/rbac.rego`\n- change how an atlas service maps an HTTP request to the OPA `input` document\n- write or update policy unit tests (`*_test.rego`)\n- review a request to grant a role broader access\n\nDo NOT use it for:\n- turnstile internals (token validation, Postgres lookups, deployment flags); see\n  `atlas.identity.turnstile:postgres-auth`\n- authentication, i.e. establishing who the caller is; this scope only decides what a principal may do\n- classification labels on data rows; that is the security org's `classification-labels`\n\n## Steps\n1. Describe the change as a row in `policies/MATRIX.md` (role × action × resource) before touching Rego.\n2. Edit `rbac.rego`. Keep the structure: `default allow := false`, one `allow` rule per (role, action\n   family), helper sets in `roles.rego`, no role names inlined outside `role_rank`.\n3. Add a test in `rbac_test.rego` for the new allow AND for the closest deny (same action, next lower\n   role). A PR that adds an allow without a matching deny test is rejected.\n4. Run `opa fmt --write policies/` and `opa test -v policies/`.\n5. Bump `bundle.version` in `policies/.manifest`; services pin a bundle version and refresh every 60 s.\n6. If the change alters decisions for existing inputs, say so in the PR so turnstile-team can bump\n   `decisionCacheVersion`.\n\n## Conventions specific to this scope\n- Roles are exactly `analyst`, `supervisor`, `admin`; a new role needs identity-platform approval and\n  a MATRIX.md update. Inheritance is linear: admin ⊇ supervisor ⊇ analyst (`role_rank`).\n- Actions are `\u003cresource>:\u003cverb>` strings with verbs from `read|write|export|admin`\n  (`layer:read`, `graph:export`).\n- The `input` document shape is fixed:\n  `{ principal: {id, roles[], orgUnit, clearance[]}, action, resource: {type, id, orgUnit, label}, context: {requestId} }`.\n  Services build it through `libs/auth-sdk`, never by hand.\n- Deny by default; there is no `deny` rule. Anything not explicitly allowed is refused.\n- Policies read no external data at decision time except the bundled `data.roles` document; no\n  `http.send` in Rego.\n- `export` actions additionally require `resource.label` to be within the principal's clearance set,\n  evaluated by the shared `label_ok` helper.\n- Every decision is logged by the calling service with the bundle version and the `requestId`.\n\n## Verify\n- `opa test -v platforms/atlas/identity/policies/` passes with coverage ≥ 90 % (`opa test --coverage`).\n- `opa eval -d policies/ -i testdata/analyst_read.json 'data.atlas.rbac.allow'` prints `true`.\n- `opa eval -d policies/ -i testdata/analyst_export.json 'data.atlas.rbac.allow'` prints `false`.\n- `opa fmt --diff policies/` is empty.\n- `make -C platforms/atlas/identity matrix-check` confirms `MATRIX.md` has a row for every allow rule.\n\n## See also\n- urn:skill:meridian:atlas.identity.turnstile:postgres-auth\n- urn:skill:meridian:shared.auth-sdk:auth-sdk-usage", "raw": "---\nname: rbac-policies\ndescription: \"[atlas/identity] Authoring and testing the atlas RBAC policy bundle in OPA Rego: the analyst/supervisor/admin role model, the fixed OPA input document, allow-rule structure, policy tests and bundle versioning. Use when adding a role, action or resource type to policies/rbac.rego, changing how a service builds the policy input, or reviewing a request for broader access. Do not use for turnstile service internals (see atlas/identity/turnstile postgres-auth) or for authentication.\"\nlicense: Apache-2.0\ncompatibility: \"Needs the opa CLI (0.60+) and read access to the identity policies directory; no cluster access required.\"\nmetadata:\n  scope: atlas.identity\n  owner: identity-platform\n  references: \"platforms/atlas/identity/policies/rbac.rego\"\n  status: active\n  since: \"2026-09-04\"\n  kind: governance\n  layer: team\n  triggers: \"OPA Rego policy, rbac.rego, analyst supervisor admin roles, allow rule deny by default, policy bundle version, MATRIX.md\"\n  digest: >-\n    Atlas authorization decisions come from one OPA Rego bundle with three linearly inherited roles\n    (analyst, supervisor, admin) and a fixed input document built by the auth-sdk. Policies deny by\n    default, every allow has a matching deny test, and bundle versions are pinned by the services.\n---\n# RBAC policies for atlas\n\n## When to use / when NOT to use\nUse this skill when you:\n- add a role, action or resource type to `platforms/atlas/identity/policies/rbac.rego`\n- change how an atlas service maps an HTTP request to the OPA `input` document\n- write or update policy unit tests (`*_test.rego`)\n- review a request to grant a role broader access\n\nDo NOT use it for:\n- turnstile internals (token validation, Postgres lookups, deployment flags); see\n  `atlas.identity.turnstile:postgres-auth`\n- authentication, i.e. establishing who the caller is; this scope only decides what a principal may do\n- classification labels on data rows; that is the security org's `classification-labels`\n\n## Steps\n1. Describe the change as a row in `policies/MATRIX.md` (role × action × resource) before touching Rego.\n2. Edit `rbac.rego`. Keep the structure: `default allow := false`, one `allow` rule per (role, action\n   family), helper sets in `roles.rego`, no role names inlined outside `role_rank`.\n3. Add a test in `rbac_test.rego` for the new allow AND for the closest deny (same action, next lower\n   role). A PR that adds an allow without a matching deny test is rejected.\n4. Run `opa fmt --write policies/` and `opa test -v policies/`.\n5. Bump `bundle.version` in `policies/.manifest`; services pin a bundle version and refresh every 60 s.\n6. If the change alters decisions for existing inputs, say so in the PR so turnstile-team can bump\n   `decisionCacheVersion`.\n\n## Conventions specific to this scope\n- Roles are exactly `analyst`, `supervisor`, `admin`; a new role needs identity-platform approval and\n  a MATRIX.md update. Inheritance is linear: admin ⊇ supervisor ⊇ analyst (`role_rank`).\n- Actions are `\u003cresource>:\u003cverb>` strings with verbs from `read|write|export|admin`\n  (`layer:read`, `graph:export`).\n- The `input` document shape is fixed:\n  `{ principal: {id, roles[], orgUnit, clearance[]}, action, resource: {type, id, orgUnit, label}, context: {requestId} }`.\n  Services build it through `libs/auth-sdk`, never by hand.\n- Deny by default; there is no `deny` rule. Anything not explicitly allowed is refused.\n- Policies read no external data at decision time except the bundled `data.roles` document; no\n  `http.send` in Rego.\n- `export` actions additionally require `resource.label` to be within the principal's clearance set,\n  evaluated by the shared `label_ok` helper.\n- Every decision is logged by the calling service with the bundle version and the `requestId`.\n\n## Verify\n- `opa test -v platforms/atlas/identity/policies/` passes with coverage ≥ 90 % (`opa test --coverage`).\n- `opa eval -d policies/ -i testdata/analyst_read.json 'data.atlas.rbac.allow'` prints `true`.\n- `opa eval -d policies/ -i testdata/analyst_export.json 'data.atlas.rbac.allow'` prints `false`.\n- `opa fmt --diff policies/` is empty.\n- `make -C platforms/atlas/identity matrix-check` confirms `MATRIX.md` has a row for every allow rule.\n\n## See also\n- urn:skill:meridian:atlas.identity.turnstile:postgres-auth\n- urn:skill:meridian:shared.auth-sdk:auth-sdk-usage\n", "path": "platforms/atlas/identity/.agents/skills/rbac-policies/SKILL.md", "revision": "5793295c6a2e44bfadd4c9e5b7090a9ea32a152cecf8f8dd00816c0f3a97cd75", "bytes": 4373, "requires": [], "refines": [], "references": ["platforms/atlas/identity/policies/rbac.rego"]}, {"id": "urn:skill:meridian:atlas.identity.turnstile:postgres-auth", "name": "postgres-auth", "scope": "atlas.identity.turnstile", "owner": "turnstile-team", "sourceLayer": "team", "knowledgeLayer": "Unclassified", "sourceStatus": "active", "description": "[atlas/identity/turnstile] Add or change authorization checks in the turnstile service: bearer-token validation, principal and role lookup in Postgres, RBAC evaluation through the OPA middleware, and the legacyAuthMode flag in deploy/deployment.yaml. Use when touching turnstile's auth middleware, its principal or role tables, or any auth-related field in deployment.yaml. Do not use for writing Rego policies (see atlas/identity rbac-policies) or for on-call incident response (see turnstile-oncall-runbook).", "body": "# Postgres-backed authorization in turnstile\n\n## When to use / when NOT to use\nUse this skill when you:\n- change `platforms/atlas/identity/turnstile/src/auth/middleware.go` or anything it calls\n- add or alter the `principals`, `principal_roles` or `decision_cache` tables\n- flip or remove `legacyAuthMode` (or any `config.auth` key) in `deploy/deployment.yaml`\n- put a new atlas service behind turnstile\n\nDo NOT use it for:\n- writing or testing Rego; that is `rbac-policies`, loaded with this skill\n- pooling, migrations and failover mechanics; follow `_root:postgres-production`\n- responding to an auth outage; use `turnstile-oncall-runbook`\n\n## Steps\n1. Read the chain in `middleware.go`: `Authenticate` (token → principal id) → `LoadPrincipal`\n   (one Postgres query, cached 30 s) → `Authorize` (OPA eval with the pinned bundle) → handler. New\n   checks are added as a step in this chain, never inside a handler.\n2. Schema changes go through a migration in `turnstile/migrations/` with the `_root` naming scheme.\n   `principals` and `principal_roles` are append-only with `valid_from`/`valid_to`; never `DELETE` a role row.\n3. If the change needs a new policy input field, extend `auth.PolicyInput` in `middleware.go` and the\n   `input` schema in `rbac-policies` in the same PR (both CODEOWNERS must approve).\n4. Add any behaviour flag under `config.auth` in the ConfigMap in `deploy/deployment.yaml`, with a\n   default equal to current production behaviour, and read it once at start-up via `auth.Config`.\n5. To retire `legacyAuthMode`: set it to `false` per environment in the order dev → staging → prod,\n   one release apart, and confirm `turnstile_auth_legacy_fallback_total` stays at zero before each step.\n6. Add middleware tests with a fake `Verifier` and a Postgres test container covering allow, deny,\n   expired token, unknown principal and a role outside its validity window.\n\n## Conventions specific to this scope\n- Tokens are verified with the key set from `libs/auth-sdk`; turnstile never parses JWTs itself.\n- Principal lookup is exactly one query joining `principals` and `principal_roles` on the validity\n  window. Any additional query on the request path needs a benchmark in the PR.\n- The decision cache key is `sha256(principalId | action | resourceType | resourceId | bundleVersion |\n  decisionCacheVersion)`; it is invalidated by version bumps, never by TTL alone.\n- Failure mode is closed: a Postgres or OPA error yields `FORBIDDEN` with\n  `details[0].reason = \"auth_backend_unavailable\"`, never a pass-through.\n- `legacyAuthMode: true` makes `Authenticate` fall back to the `atlas_sessions` table when the bearer\n  token is absent; every fallback increments `turnstile_auth_legacy_fallback_total`. The flag is read\n  only through `auth.Config`.\n- The auth query path uses `maxConns` from the `_root` Postgres defaults; do not raise it per deployment.\n- Decisions are logged with `requestId`, `principalId`, `action`, `decision`, `bundleVersion` and\n  `latencyMs`; never log the token or the resource payload.\n\n## Verify\n- `go test ./platforms/atlas/identity/turnstile/src/auth/...` passes with the Postgres test container.\n- `go test -bench Authorize ./platforms/atlas/identity/turnstile/src/auth/` reports p50 under 2 ms\n  with a warm cache and under 15 ms cold.\n- `kubectl -n turnstile get configmap turnstile-config -o yaml | grep legacyAuthMode` matches the\n  value in `deploy/deployment.yaml` for that environment.\n- `curl -s -H 'Authorization: Bearer invalid' localhost:8081/v1/authz/check` returns 403 with the\n  atlas error envelope.\n\n## See also\n- urn:skill:meridian:atlas.identity:rbac-policies (required)\n- urn:skill:meridian:_root:postgres-production (required)\n- urn:skill:meridian:atlas.identity.turnstile:turnstile-oncall-runbook\n- urn:skill:meridian:shared.auth-sdk:auth-sdk-usage", "raw": "---\nname: postgres-auth\ndescription: \"[atlas/identity/turnstile] Add or change authorization checks in the turnstile service: bearer-token validation, principal and role lookup in Postgres, RBAC evaluation through the OPA middleware, and the legacyAuthMode flag in deploy/deployment.yaml. Use when touching turnstile's auth middleware, its principal or role tables, or any auth-related field in deployment.yaml. Do not use for writing Rego policies (see atlas/identity rbac-policies) or for on-call incident response (see turnstile-oncall-runbook).\"\nlicense: Apache-2.0\ncompatibility: \"Needs Go 1.22+, a local Postgres 16 with the turnstile schema, the opa CLI and kubectl read access to the turnstile namespace.\"\nmetadata:\n  scope: atlas.identity.turnstile\n  owner: turnstile-team\n  requires: \"urn:skill:meridian:atlas.identity:rbac-policies, urn:skill:meridian:_root:postgres-production\"\n  references: \"platforms/atlas/identity/turnstile/deploy/deployment.yaml#legacyAuthMode, platforms/atlas/identity/turnstile/src/auth/middleware.go\"\n  status: active\n  since: \"2026-09-04\"\n  kind: engineering\n  layer: team\n  refines: \"urn:skill:meridian:_root:postgres-production\"\n  replaces: \"urn:skill:meridian:atlas.identity:legacy-session-auth\"\n  triggers: \"turnstile auth middleware, bearer token validation, principal role lookup, legacyAuthMode flag, decision cache, principals table\"\n  digest: >-\n    Turnstile authorizes every atlas API request by validating the bearer token, loading the principal\n    and its roles from Postgres, and evaluating the atlas RBAC bundle in-process. All auth behaviour\n    flags, including the transitional legacyAuthMode, live in deploy/deployment.yaml and nowhere else.\n---\n# Postgres-backed authorization in turnstile\n\n## When to use / when NOT to use\nUse this skill when you:\n- change `platforms/atlas/identity/turnstile/src/auth/middleware.go` or anything it calls\n- add or alter the `principals`, `principal_roles` or `decision_cache` tables\n- flip or remove `legacyAuthMode` (or any `config.auth` key) in `deploy/deployment.yaml`\n- put a new atlas service behind turnstile\n\nDo NOT use it for:\n- writing or testing Rego; that is `rbac-policies`, loaded with this skill\n- pooling, migrations and failover mechanics; follow `_root:postgres-production`\n- responding to an auth outage; use `turnstile-oncall-runbook`\n\n## Steps\n1. Read the chain in `middleware.go`: `Authenticate` (token → principal id) → `LoadPrincipal`\n   (one Postgres query, cached 30 s) → `Authorize` (OPA eval with the pinned bundle) → handler. New\n   checks are added as a step in this chain, never inside a handler.\n2. Schema changes go through a migration in `turnstile/migrations/` with the `_root` naming scheme.\n   `principals` and `principal_roles` are append-only with `valid_from`/`valid_to`; never `DELETE` a role row.\n3. If the change needs a new policy input field, extend `auth.PolicyInput` in `middleware.go` and the\n   `input` schema in `rbac-policies` in the same PR (both CODEOWNERS must approve).\n4. Add any behaviour flag under `config.auth` in the ConfigMap in `deploy/deployment.yaml`, with a\n   default equal to current production behaviour, and read it once at start-up via `auth.Config`.\n5. To retire `legacyAuthMode`: set it to `false` per environment in the order dev → staging → prod,\n   one release apart, and confirm `turnstile_auth_legacy_fallback_total` stays at zero before each step.\n6. Add middleware tests with a fake `Verifier` and a Postgres test container covering allow, deny,\n   expired token, unknown principal and a role outside its validity window.\n\n## Conventions specific to this scope\n- Tokens are verified with the key set from `libs/auth-sdk`; turnstile never parses JWTs itself.\n- Principal lookup is exactly one query joining `principals` and `principal_roles` on the validity\n  window. Any additional query on the request path needs a benchmark in the PR.\n- The decision cache key is `sha256(principalId | action | resourceType | resourceId | bundleVersion |\n  decisionCacheVersion)`; it is invalidated by version bumps, never by TTL alone.\n- Failure mode is closed: a Postgres or OPA error yields `FORBIDDEN` with\n  `details[0].reason = \"auth_backend_unavailable\"`, never a pass-through.\n- `legacyAuthMode: true` makes `Authenticate` fall back to the `atlas_sessions` table when the bearer\n  token is absent; every fallback increments `turnstile_auth_legacy_fallback_total`. The flag is read\n  only through `auth.Config`.\n- The auth query path uses `maxConns` from the `_root` Postgres defaults; do not raise it per deployment.\n- Decisions are logged with `requestId`, `principalId`, `action`, `decision`, `bundleVersion` and\n  `latencyMs`; never log the token or the resource payload.\n\n## Verify\n- `go test ./platforms/atlas/identity/turnstile/src/auth/...` passes with the Postgres test container.\n- `go test -bench Authorize ./platforms/atlas/identity/turnstile/src/auth/` reports p50 under 2 ms\n  with a warm cache and under 15 ms cold.\n- `kubectl -n turnstile get configmap turnstile-config -o yaml | grep legacyAuthMode` matches the\n  value in `deploy/deployment.yaml` for that environment.\n- `curl -s -H 'Authorization: Bearer invalid' localhost:8081/v1/authz/check` returns 403 with the\n  atlas error envelope.\n\n## See also\n- urn:skill:meridian:atlas.identity:rbac-policies (required)\n- urn:skill:meridian:_root:postgres-production (required)\n- urn:skill:meridian:atlas.identity.turnstile:turnstile-oncall-runbook\n- urn:skill:meridian:shared.auth-sdk:auth-sdk-usage\n", "path": "platforms/atlas/identity/turnstile/.agents/skills/postgres-auth/SKILL.md", "revision": "0f506e5c5bd354754b4ab4244c6992d2819e5266dc10717b97eef693442b214b", "bytes": 5540, "requires": ["urn:skill:meridian:atlas.identity:rbac-policies", "urn:skill:meridian:_root:postgres-production"], "refines": ["urn:skill:meridian:_root:postgres-production"], "references": ["platforms/atlas/identity/turnstile/deploy/deployment.yaml#legacyAuthMode", "platforms/atlas/identity/turnstile/src/auth/middleware.go"]}, {"id": "urn:skill:meridian:atlas.identity.turnstile:turnstile-oncall-runbook", "name": "turnstile-oncall-runbook", "scope": "atlas.identity.turnstile", "owner": "turnstile-oncall", "sourceLayer": "team", "knowledgeLayer": "Unclassified", "sourceStatus": "active", "description": "[atlas/identity/turnstile] On-call runbook for the turnstile authorization service: what each TurnstileAuth* alert means, first-response checks, the three approved mitigations (rollout undo, bundle re-pin, rolling restart), reconciling deploy/deployment.yaml afterwards, and escalation. Use when paged for a turnstile alert, when atlas APIs return 403s at scale, or when rolling back a turnstile release. Do not use for planned auth changes or policy edits.", "body": "# Turnstile on-call runbook\n\n## When to use / when NOT to use\nUse this skill when:\n- you are paged by any `TurnstileAuth*` alert\n- atlas services report an elevated 403 or 5xx rate that correlates with `turnstile_authz_errors_total`\n- a turnstile release must be rolled back outside a planned window\n\nDo NOT use it for:\n- planned changes to auth logic, schema or flags; those follow `postgres-auth` with a normal PR\n- editing Rego policies during an incident (re-pin the previous bundle instead, step 4)\n- incidents in the token issuer; page identity-platform directly\n\n## Steps\n1. Acknowledge the page and post the alert name plus a sample `requestId` in the incident channel.\n2. Triage by alert:\n   - `TurnstileAuthErrorRateHigh`: Postgres or OPA backend errors, go to step 3.\n   - `TurnstileAuthLatencyHigh`: usually pool exhaustion or a cold decision cache, go to step 5.\n   - `TurnstileBundleStale`: bundle refresh failing for over 5 min, go to step 4.\n   - `TurnstileLegacyFallbackNonZero`: `legacyAuthMode` is on where it should be off; compare the\n     ConfigMap in `deploy/deployment.yaml` for that environment and go to step 6.\n3. Backend errors: `kubectl -n turnstile logs deploy/turnstile --since=10m | grep auth_backend_unavailable`.\n   If the reason is Postgres, follow the `_root` Postgres incident checks; if OPA, go to step 4.\n4. Bundle problems: re-pin the last known-good version with\n   `kubectl -n turnstile set env deploy/turnstile AUTH_BUNDLE_VERSION=\u003cprevious>` and confirm\n   `turnstile_bundle_version` changes on the dashboard. Open an issue for identity-platform.\n5. Latency: compare `turnstile_pg_pool_in_use` with `maxConns`. If saturated, restart pods one at a\n   time (`kubectl -n turnstile rollout restart deploy/turnstile`); never raise `maxConns` mid-incident.\n6. Rollback: `kubectl -n turnstile rollout undo deploy/turnstile`, then revert the change in\n   `deploy/deployment.yaml` through a PR so the manifest matches the cluster again.\n7. Escalate to turnstile-team after 30 min without mitigation, or immediately if a mitigation would\n   change `legacyAuthMode` or any other `config.auth` value.\n8. Write the incident note within 24 h using `docs/incidents/TEMPLATE.md`.\n\n## Conventions specific to this scope\n- Turnstile fails closed. An outage is a 403 storm, not a security bypass; do not \"open\" auth to\n  restore traffic. There is no flag for that and none may be added.\n- Only three mitigations are approved for on-call use without a second reviewer: rollout undo,\n  bundle re-pin, rolling pod restart.\n- `deploy/deployment.yaml` is the single source of truth for flags; a manual `kubectl set env` is a\n  temporary mitigation and must be reconciled by a PR before the incident is closed.\n- Never run ad-hoc SQL against the principal tables during an incident; read-only checks go through\n  the `turnstile_ro` role.\n- Alert thresholds live in `deploy/alerts.yaml` next to `deployment.yaml`; tuning one is a PR, not\n  a dashboard edit.\n- The rota is turnstile-oncall (a turnstile-team sub-team); handover notes go in the incident channel\n  at the end of each shift.\n\n## Verify\n- After mitigation, the `turnstile_authz_errors_total` rate is back to baseline for 15 min and the\n  atlas gateway 403 rate matches the previous day.\n- `kubectl -n turnstile get configmap turnstile-config -o yaml` matches the ConfigMap in\n  `deploy/deployment.yaml`, or a reconciling PR is open.\n- The incident note links the alert, the mitigation used and the follow-up issue.\n\n## See also\n- urn:skill:meridian:atlas.identity.turnstile:postgres-auth (required)\n- urn:skill:meridian:_root:postgres-production\n- urn:skill:meridian:atlas.identity:rbac-policies", "raw": "---\nname: turnstile-oncall-runbook\ndescription: \"[atlas/identity/turnstile] On-call runbook for the turnstile authorization service: what each TurnstileAuth* alert means, first-response checks, the three approved mitigations (rollout undo, bundle re-pin, rolling restart), reconciling deploy/deployment.yaml afterwards, and escalation. Use when paged for a turnstile alert, when atlas APIs return 403s at scale, or when rolling back a turnstile release. Do not use for planned auth changes or policy edits.\"\nlicense: Apache-2.0\ncompatibility: \"Needs kubectl access to the turnstile namespace, read access to the metrics dashboard and membership of the turnstile-oncall pager rota.\"\nmetadata:\n  scope: atlas.identity.turnstile\n  owner: turnstile-oncall\n  requires: \"urn:skill:meridian:atlas.identity.turnstile:postgres-auth\"\n  references: \"platforms/atlas/identity/turnstile/deploy/deployment.yaml\"\n  status: active\n  since: \"2026-09-04\"\n  kind: ways-of-working\n  layer: team\n  triggers: \"paged for turnstile alert, TurnstileAuth alert, 403 spike, rollout undo, bundle re-pin, rolling restart\"\n  negative_triggers: \"planned auth change, policy edit\"\n  digest: >-\n    Turnstile on-call handles authorization outages for all atlas APIs; the service fails closed, so\n    incidents surface as 403 spikes rather than bypasses. The runbook maps each alert to a triage\n    path, limits on-call to three approved mitigations, and defines when to escalate to\n    turnstile-team or identity-platform.\n---\n# Turnstile on-call runbook\n\n## When to use / when NOT to use\nUse this skill when:\n- you are paged by any `TurnstileAuth*` alert\n- atlas services report an elevated 403 or 5xx rate that correlates with `turnstile_authz_errors_total`\n- a turnstile release must be rolled back outside a planned window\n\nDo NOT use it for:\n- planned changes to auth logic, schema or flags; those follow `postgres-auth` with a normal PR\n- editing Rego policies during an incident (re-pin the previous bundle instead, step 4)\n- incidents in the token issuer; page identity-platform directly\n\n## Steps\n1. Acknowledge the page and post the alert name plus a sample `requestId` in the incident channel.\n2. Triage by alert:\n   - `TurnstileAuthErrorRateHigh`: Postgres or OPA backend errors, go to step 3.\n   - `TurnstileAuthLatencyHigh`: usually pool exhaustion or a cold decision cache, go to step 5.\n   - `TurnstileBundleStale`: bundle refresh failing for over 5 min, go to step 4.\n   - `TurnstileLegacyFallbackNonZero`: `legacyAuthMode` is on where it should be off; compare the\n     ConfigMap in `deploy/deployment.yaml` for that environment and go to step 6.\n3. Backend errors: `kubectl -n turnstile logs deploy/turnstile --since=10m | grep auth_backend_unavailable`.\n   If the reason is Postgres, follow the `_root` Postgres incident checks; if OPA, go to step 4.\n4. Bundle problems: re-pin the last known-good version with\n   `kubectl -n turnstile set env deploy/turnstile AUTH_BUNDLE_VERSION=\u003cprevious>` and confirm\n   `turnstile_bundle_version` changes on the dashboard. Open an issue for identity-platform.\n5. Latency: compare `turnstile_pg_pool_in_use` with `maxConns`. If saturated, restart pods one at a\n   time (`kubectl -n turnstile rollout restart deploy/turnstile`); never raise `
