name: Publish images

# Builds and pushes the API, worker and portal images to GHCR on every push to
# main that touches their inputs. This is the only place these images are
# built: there is no usable self-hosted runner for this repository (checked
# against the deploy cluster's runner registration — zero runners scoped to
# this repo) and no local Docker in the dev environment, so GitHub-hosted
# runners + GHCR is the realistic path. See deploy/k8s/environments/*/README.md
# for how a release picks up the digests these jobs produce.
on:
  push:
    branches: [main]
    paths:
      - services/search/**
      - portal/**
      - .github/workflows/publish-images.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # github.repository_owner is "wiatrM" (mixed case); OCI registry names must be
  # lowercase. GitHub Actions expressions have no built-in lowercase() function,
  # so this is hardcoded rather than derived — it's a fixed fact about this repo.
  API_IMAGE: ghcr.io/wiatrm/guidefold-search
  WORKER_IMAGE: ghcr.io/wiatrm/guidefold-worker
  PORTAL_IMAGE: ghcr.io/wiatrm/guidefold-portal

jobs:
  api-and-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      api_digest: ${{ steps.push-api.outputs.digest }}
      worker_digest: ${{ steps.push-worker.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        id: push-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/search/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest

      - name: Build and push worker image
        id: push-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/search/Dockerfile.worker
          push: true
          tags: |
            ${{ env.WORKER_IMAGE }}:${{ github.sha }}
            ${{ env.WORKER_IMAGE }}:latest

      - name: Summary
        run: |
          echo "### Published images" >> "$GITHUB_STEP_SUMMARY"
          echo "- API:    \`${{ env.API_IMAGE }}@${{ steps.push-api.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: \`${{ env.WORKER_IMAGE }}@${{ steps.push-worker.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin these digests into the environment's Helm values (image / worker.image) — the chart refuses an unpinned production image." >> "$GITHUB_STEP_SUMMARY"

  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      portal_digest: ${{ steps.push-portal.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push portal image
        id: push-portal
        uses: docker/build-push-action@v6
        with:
          context: .
          file: portal/Dockerfile
          push: true
          tags: |
            ${{ env.PORTAL_IMAGE }}:${{ github.sha }}
            ${{ env.PORTAL_IMAGE }}:latest

      - name: Summary
        run: |
          echo "### Published portal image" >> "$GITHUB_STEP_SUMMARY"
          echo "- Portal: \`${{ env.PORTAL_IMAGE }}@${{ steps.push-portal.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin this digest into the environment's Helm values (portal.image)." >> "$GITHUB_STEP_SUMMARY"
