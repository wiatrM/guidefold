name: Publish images

# Builds and pushes the API and worker images to GHCR on every push to main
# that touches services/search. This is the only place these images are
# built: there is no usable self-hosted runner for this repository (checked
# against the deploy cluster's runner registration — zero runners scoped to
# this repo) and no local Docker in the dev environment, so GitHub-hosted
# runners + GHCR is the realistic path. See deploy/k8s/environments/*/README.md
# for how a release picks up the digest this job produces.
on:
  push:
    branches: [main]
    paths:
      - services/search/**
      - .github/workflows/publish-images.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/guidefold-search
  WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/guidefold-worker

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      api_digest: ${{ steps.push-api.outputs.digest }}
      worker_digest: ${{ steps.push-worker.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        id: push-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/search/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest

      - name: Build and push worker image
        id: push-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/search/Dockerfile.worker
          push: true
          tags: |
            ${{ env.WORKER_IMAGE }}:${{ github.sha }}
            ${{ env.WORKER_IMAGE }}:latest

      - name: Summary
        run: |
          echo "### Published images" >> "$GITHUB_STEP_SUMMARY"
          echo "- API:    \`${{ env.API_IMAGE }}@${{ steps.push-api.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: \`${{ env.WORKER_IMAGE }}@${{ steps.push-worker.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin these digests into the environment's Helm values (image / worker.image) — the chart refuses an unpinned production image." >> "$GITHUB_STEP_SUMMARY"
