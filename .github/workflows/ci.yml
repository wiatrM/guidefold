name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install pyyaml pytest numpy "jsonschema>=4.23,<5"

      - name: Syntax check the CLI
        run: python -m py_compile skills/guidefold/scripts/guidefold

      - name: Run tests
        run: pytest

  fixture-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate the example monorepo fixture
        run: cd examples/monorepo && python3 ../../skills/guidefold/scripts/guidefold validate

  golden-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run the E1.2 golden set and gate on regression vs the committed baseline
        run: python3 tools/eval/run_golden.py --check

  index-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build the E1.4 index artifact for the example monorepo fixture
        run: cd examples/monorepo && python3 ../../skills/guidefold/scripts/guidefold index

      - name: index --check must pass immediately after a fresh build
        run: cd examples/monorepo && python3 ../../skills/guidefold/scripts/guidefold index --check

  native-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/search/go.mod
          cache-dependency-path: services/search/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Regenerate policy conformance cases from the unchanged CLI
        run: |
          python tools/search_service/contract_fixtures.py
          python tools/search_service/bm25f_fixtures.py
          python tools/search_service/telemetry_fixtures.py
          git diff --exit-code -- services/search/testdata/policy.json services/search/testdata/bm25f.json services/search/testdata/telemetry.json services/search/telemetry-schema.json
      - name: Go race tests and vet
        working-directory: services/search
        run: |
          test -z "$(gofmt -l *.go)"
          go test -race ./...
          go vet ./...

  compose-service:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml numpy huggingface_hub "jsonschema>=4.23,<5"
      - name: Build, publish and deploy Go with real ParadeDB
        run: python tools/search_service/dev.py deploy
      - name: Validate opt-in GPU Compose and operator syntax (no GPU on this runner)
        env:
          GUIDEFOLD_ENCODER_ID: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          GUIDEFOLD_MODEL_DIR: /tmp/guidefold-model
        run: |
          docker compose -f compose.yaml -f compose.gpu.yaml config --quiet
          python -m py_compile tools/search_service/gpu.py tools/search_service/gpu_probe.py tools/search_service/gpu_quality.py tools/search_service/gpu_smoke.py
      - name: HTTP contract, real SQL, publication and restart checks
        run: python tools/search_service/smoke.py --recovery --output .guidefold/checks/compose-smoke.json
      - name: Fetch pinned public corpus for the 1000-query parity gate
        run: python -c "from tools.eval.corpora import fetch; fetch('skillret')"
      - name: Full default SEARCH parity against the unchanged CLI (1000 DEV queries)
        run: python tools/search_service/parity.py --output .guidefold/checks/router-parity.json
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-smoke
          path: |
            .guidefold/checks/compose-smoke.json
            .guidefold/checks/router-parity.json
      - name: Stop this CI stack
        if: always()
        run: docker compose down

  telemetry-service:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest
      - name: Prepare fixture and build the Go ledger service
        run: |
          python tools/search_service/dev.py prepare
          docker compose build api
      - name: Same SQLite and Postgres contracts, real CLI spool replay and report parity
        run: python tools/search_service/telemetry_integration.py
      - name: Upload ledger evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-postgres
          path: .guidefold/checks/telemetry-postgres.json
      - name: Stop isolated telemetry stack
        if: always()
        run: docker compose -p guidefold-ledger-contract down

  # Authoring loop, part 1 (docs/MVP.md §5 "3-6 authoring loop"): a per-PR skill collision report +
  # trigger suggestions, posted as one sticky comment. This job INFORMS — it never gates the build
  # (that is E7.5's separate, later gate) — so it always exits 0 by construction: the two tools
  # never compute a pass/fail threshold, only a report. `continue-on-error: true` on the reporting
  # steps is a second, belt-and-braces guarantee of the same "never red because of this job" contract.
  skill-authoring-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # base and head SHAs must both be reachable for `git archive`

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check whether this PR touches a fixture SKILL.md
        id: gate
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" \
               -- 'examples/monorepo/**/SKILL.md' | grep -q .; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collision report (product Index/Router, base vs head, golden queries)
        if: steps.gate.outputs.relevant == 'true'
        continue-on-error: true
        run: |
          python3 tools/authoring/collision_report.py \
            --root examples/monorepo \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.sha }}" \
            --queries tests/golden/*.yaml \
            --md collision-report.md --json collision-report.json

      - name: Trigger/negative-trigger suggestions (F5, deterministic)
        if: steps.gate.outputs.relevant == 'true'
        continue-on-error: true
        run: |
          python3 tools/authoring/suggest_triggers.py \
            --root examples/monorepo \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.sha }}" \
            --md suggest-triggers.md --json suggest-triggers.json

      - name: Post or update the one sticky PR comment
        if: steps.gate.outputs.relevant == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            cat collision-report.md 2>/dev/null || echo "_collision report step failed — see job log_"
            echo
            cat suggest-triggers.md 2>/dev/null || echo "_suggestion step failed — see job log_"
          } > authoring-report.md
          python3 tools/authoring/sticky_comment.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --body-file authoring-report.md
