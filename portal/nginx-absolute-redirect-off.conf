# The portal sits behind ingress-nginx (port 80/443 externally); this container only
# knows its own internal listen port (8080). Without this, nginx's directory-redirect
# for a path with no trailing slash (e.g. /evidence -> /evidence/, the standard
# behaviour for a folder request) builds an ABSOLUTE Location header using its own
# port: `http://guidefold.cloudfloo.io:8080/evidence/` — port 8080 isn't reachable
# from outside the cluster at all, so every such link 404s/times out for a real
# visitor. `absolute_redirect off` makes nginx emit a bare relative path instead
# (`/evidence/`), which the browser resolves against whatever host/port/scheme it's
# actually talking to — correct today over plain HTTP, and still correct once the
# owner adds TLS at the ingress (no re-fix needed then).
absolute_redirect off;
